<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071b2b">
<title>BARAMEEL RUN — HOW IT WORKS</title>
<link rel="preload" as="image" href="./assets/screen01-start.webp?v=20261010-run-transition-1" fetchpriority="high">
<link rel="stylesheet" href="./barameel-flow.css?v=20261010-run-transition-1">

</head>
<body>
<main class="flow-stage">
<img class="flow-art" src="./assets/how-it-works.webp?v=20261010-run-transition-1" alt="BARAMEEL RUN HOW IT WORKS" fetchpriority="high">
<div class="arcade-shine"></div>
<button id="back" class="flow-hit" style="left:3%;top:1%;width:19%;height:6%" aria-label="Back"></button>
<button id="cta" class="flow-hit" style="left:20%;top:91.8%;width:62%;height:7%" aria-label="Let's Run"></button>
</main>
<script src="./app.js?v=20261010-run-transition-1"></script>
<script src="./barameel-flow.js?v=20261010-run-transition-1"></script>
<script>
(() => {
  document.getElementById('back').onclick = () => BARAMEEL_FLOW.go('world.html', 'back', 180);
  document.getElementById('cta').onclick = () => {
    BR.markRunHowItWorksSeen();
    BR.safeSession.set('barameelStartFlashPending', '0');
    BR.safeSession.set('barameelStartFlashShown', '1');
    BR.haptic('confirm');
    BR.play('confirm');
    window.location.replace('./run.html?v=20261010-run-transition-1');
  };
  BARAMEEL_FLOW.preload('./assets/screen01-start.webp?v=20261010-run-transition-1');
})();
</script>
</body>
