<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><link rel="stylesheet" href="./barameel-flow.css?v=20261006-23.7"><script src="./config.js?v=20261006-23.7"></script></head><body><main class="flow-stage"><img class="flow-art" src="./assets/marks-wallet.webp" alt="BARAMEEL RUN" fetchpriority="high"><div class="arcade-shine"></div><button id="back" class="flow-hit" style="left:3%;top:1%;width:19%;height:6%" aria-label="Back"></button><div id="points" class="flow-data flow-number" style="left:9%;top:47%;width:35%;text-align:center">0</div><div id="marks" class="flow-data flow-number" style="left:58%;top:47%;width:35%;text-align:center">0</div><button id="convert" class="flow-hit" style="left:55%;top:53%;width:40%;height:7%" aria-label="Convert Now"></button><button id="info" class="flow-hit" style="left:24%;top:84%;width:52%;height:7%" aria-label="What are Marks"></button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js?v=20261006-23.7"></script><script src="./barameel-flow.js?v=20261006-23.7"></script><script>
(async()=>{
  await BR.syncPlayer().catch(()=>null);
  const parent=BR.safeSession.get('barameelRewardsParent')||'leaderboard.html';
  const collectionId=BR.safeSession.get('barameelCollectionId')||'collection01';

  async function loadWallet(){
    try{
      const r=await BR.api('/wallet',{});
      if(r?.ok){
        const serverPoints=Number(r.points??r.points_remaining??0);
        const localPoints=Number(BR.state?.points||0);
        const points=Math.max(serverPoints,localPoints);
        document.getElementById('points').textContent=points.toLocaleString();
        document.getElementById('marks').textContent=Number(r.marks??r.marks_total??0).toLocaleString();
        return;
      }
    }catch{}
    document.getElementById('points').textContent=Number(BR.state?.points||0).toLocaleString();
  }

  await loadWallet();

  document.getElementById('back').onclick=()=>{
    BR.safeSession.remove('barameelRewardsParent');
    BARAMEEL_FLOW.go(parent,'back');
  };

  document.getElementById('info').onclick=()=>BARAMEEL_FLOW.go('barameel-marks.html','tap');

  const convert=document.getElementById('convert');
  let converting=false;
  convert.onclick=async()=>{
    if(converting)return;
    converting=true;
    convert.disabled=true;
    convert.setAttribute('aria-busy','true');
    BARAMEEL_FLOW.fx('confirm');
    try{
      const r=await BR.api('/wallet',{action:'convert',idempotency_key:BR.makeId('convert')});
      if(r?.ok){
        const remaining=Number(r.points_remaining??0);
        const marks=Number(r.marks_total??0);
        BR.mergePlayer({points:remaining});
        document.getElementById('points').textContent=remaining.toLocaleString();
        document.getElementById('marks').textContent=marks.toLocaleString();
        BARAMEEL_FLOW.fx('reward');
      }else BARAMEEL_FLOW.fx('error');
    }catch{BARAMEEL_FLOW.fx('error')}
    finally{
      converting=false;
      convert.disabled=false;
      convert.removeAttribute('aria-busy');
    }
  };
})();
</script></body></html>
