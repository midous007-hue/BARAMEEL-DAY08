<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>BARAMEEL WORLD — DUO CONNECT</title>
<link rel="stylesheet" href="./styles.css?v=20261029-duo-identity-fix-2">
<script src="./config.js?v=20261029-duo-identity-fix-1"></script>
<style>
:root{--dc-navy:#06152f;--dc-blue:#0648f5;--dc-cyan:#20f2ff;--dc-gold:#ffd21c;--dc-white:#fff}
html,body{margin:0;min-height:100%;background:var(--dc-navy);color:var(--dc-white);font-family:Impact,"Arial Narrow",system-ui,sans-serif}
body{overflow-x:hidden}
.duo-stage{position:relative;isolation:isolate;min-height:100svh;overflow:hidden;padding:18px 15px 28px;box-sizing:border-box;background:radial-gradient(ellipse at 50% 28%,#063b9d 0,#062765 29%,#06152f 67%);display:flex;justify-content:center}
.duo-stage:before{content:"";position:absolute;inset:-10% -35%;z-index:-1;background:repeating-conic-gradient(from -7deg at 50% 28%,rgba(0,105,255,.32) 0deg 8deg,transparent 8deg 17deg);opacity:.65;mask-image:linear-gradient(#000,transparent 78%)}
.duo-content{width:min(100%,470px);display:flex;flex-direction:column;gap:13px}
.duo-top{height:42px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;text-align:center}
.duo-back{width:42px;height:42px;border:3px solid var(--dc-gold);border-radius:50%;background:linear-gradient(145deg,#fff27a,#ffbd00);color:#06152f;font:900 25px/1 Arial;text-decoration:none;display:grid;place-items:center;box-shadow:0 0 0 3px #06152f,0 0 14px #078bff}
.duo-top-title{font-size:clamp(16px,4vw,21px);font-weight:1000;letter-spacing:2px;text-shadow:0 3px #00102c}
.duo-crown{color:var(--dc-gold);font-size:28px;text-shadow:0 0 12px #078bff}
.duo-brand{margin:-3px auto -1px;text-align:center;line-height:.83;font-weight:1000;font-style:italic;text-transform:uppercase;letter-spacing:-1.8px;text-shadow:3px 4px 0 #06152f,-2px -2px 0 #06152f,0 0 14px #00aaff}
.duo-brand small{display:block;font-size:clamp(17px,5vw,24px);color:#fff;letter-spacing:1px}
.duo-brand strong{display:block;font-size:clamp(35px,10vw,48px);background:linear-gradient(#fff86a 0%,#ffca00 50%,#ff5729 100%);background-clip:text;-webkit-background-clip:text;color:transparent;letter-spacing:-1px}
.duo-camera-panel{position:relative;height:clamp(160px,27vh,235px);border:4px solid #e9fdff;border-radius:27px;background:linear-gradient(145deg,rgba(0,27,82,.95),rgba(0,9,33,.98));box-shadow:0 0 0 2px #20f2ff,0 0 23px rgba(0,161,255,.75),inset 0 0 25px rgba(0,80,255,.45);overflow:hidden;display:grid;place-items:center}
.duo-camera-panel:before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(0,100,255,.25) 0deg 9deg,transparent 9deg 20deg);opacity:.5}
.duo-camera-symbol{position:relative;display:grid;place-items:center;width:130px;height:130px;border-radius:50%;border:1px solid rgba(0,195,255,.3);box-shadow:0 0 30px rgba(0,111,255,.4);color:#fff}
.duo-camera-symbol svg{width:82px;height:82px;filter:drop-shadow(0 0 10px #138dff)}
.duo-corners{position:absolute;inset:16% 28%;pointer-events:none}
.duo-corners i{position:absolute;width:29px;height:29px;border-color:var(--dc-gold);border-style:solid}
.duo-corners i:nth-child(1){left:0;top:0;border-width:6px 0 0 6px;border-radius:10px 0 0}
.duo-corners i:nth-child(2){right:0;top:0;border-width:6px 6px 0 0;border-radius:0 10px 0 0}
.duo-corners i:nth-child(3){left:0;bottom:0;border-width:0 0 6px 6px;border-radius:0 0 0 10px}
.duo-corners i:nth-child(4){right:0;bottom:0;border-width:0 6px 6px 0;border-radius:0 0 10px}
#duoVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.duo-camera-panel.scanning #duoVideo{display:block}
.duo-camera-panel.scanning .duo-camera-symbol{display:none}
.duo-camera-panel.scanning:before{opacity:.12}
.duo-scan-line{position:absolute;left:12%;right:12%;top:50%;height:2px;background:#20f2ff;box-shadow:0 0 12px #20f2ff;display:none;animation:duoScan 2s ease-in-out infinite alternate}
.duo-camera-panel.scanning .duo-scan-line{display:block}
@keyframes duoScan{to{transform:translateY(-70px)}}
.duo-connect-button{appearance:none;border:0;padding:0;width:100%;aspect-ratio:3.0/1;max-height:106px;cursor:pointer;position:relative;display:block;background:transparent;filter:drop-shadow(0 5px 0 #00102b) drop-shadow(0 0 9px rgba(0,135,255,.5));}
.duo-connect-button:active{transform:translateY(2px) scale(.995)}
.duo-connect-button svg{display:block;width:100%;height:100%}
.duo-connect-button:focus-visible{outline:3px solid #fff;outline-offset:4px;border-radius:24px}
.duo-helper{margin:0;text-align:center;font-size:clamp(11px,3.2vw,14px);font-weight:900;letter-spacing:1.4px;color:#35f6ff;text-shadow:0 0 9px #006aff}
.duo-status{border:2px solid #087cff;border-radius:22px;background:rgba(2,17,44,.91);padding:10px 14px 12px;box-shadow:inset 0 0 16px rgba(0,91,255,.18);text-align:center}
.duo-status-label{font-size:clamp(10px,2.8vw,13px);font-weight:900;letter-spacing:2px;color:#d9faff}
.duo-status-track{height:12px;border:3px solid #20f2ff;border-radius:20px;margin:9px 0 7px;overflow:hidden;background:#001027}
.duo-status-fill{height:100%;width:0;background:linear-gradient(90deg,#0058ff,#20f2ff);transition:width .25s}
.duo-status-message{font-size:clamp(10px,2.7vw,12px);letter-spacing:1.8px;color:#dbeaff}
.duo-player-panel{border:3px solid #eafcff;border-radius:25px;padding:14px 14px 12px;background:linear-gradient(150deg,rgba(0,34,88,.96),rgba(1,11,34,.98));box-shadow:0 0 0 2px #20f2ff,0 0 17px rgba(0,151,255,.48);text-align:center;position:relative}
.duo-player-heading{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:10px;color:#fff;font-size:clamp(17px,4.6vw,22px);font-weight:1000;letter-spacing:1px;text-shadow:0 2px #00102b}
.duo-player-heading:before,.duo-player-heading:after{content:"";height:3px;width:42px;background:linear-gradient(90deg,transparent,#20f2ff)}
.duo-player-heading:after{transform:rotate(180deg)}
.duo-qr-frame{width:min(48vw,190px);aspect-ratio:1;margin:0 auto 8px;background:#fff;border:5px solid #fff;border-radius:13px;box-shadow:0 0 0 3px #06152f,0 0 0 5px #20f2ff;display:grid;place-items:center;overflow:hidden}
#playerQr{width:100%;height:100%;display:grid;place-items:center}
#playerQr canvas,#playerQr img{width:100%!important;height:100%!important;object-fit:contain}
.duo-player-name{font-family:Arial,sans-serif;font-weight:800;font-size:14px;min-height:18px;color:#fff}
.duo-player-code{font-family:monospace;font-size:13px;letter-spacing:2px;color:#ffdb22;margin-top:3px}
.duo-id-caption{margin:8px 0 0;color:#d9faff;font-size:10px;letter-spacing:2px}
.duo-message{min-height:20px;text-align:center;font:700 12px/1.4 Arial,sans-serif;color:#e9faff}
.duo-message.error{color:#ff8a72}.duo-message.success{color:#72ffcb}
.duo-success-overlay{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;overflow:hidden;pointer-events:none;background:transparent}
.duo-success-overlay.show{display:flex;animation:duoSuccessIn .22s ease-out both}
.duo-success-emblem{position:relative;z-index:2;width:min(78%,330px);height:46%;max-height:390px;display:grid;place-items:center;isolation:isolate;overflow:hidden;border-radius:22px;opacity:1;transition:opacity .45s ease}
.duo-success-badge{position:relative;z-index:2;display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 0 16px #00cfff) drop-shadow(0 0 30px #ffd21c);animation:duoBadgePop .55s cubic-bezier(.16,1.4,.35,1) both}
.duo-success-emblem:before{content:"";position:absolute;z-index:3;left:12%;right:12%;bottom:-24%;height:28%;background:linear-gradient(0deg,transparent 0%,rgba(0,220,255,.22) 12%,rgba(255,255,255,1) 40%,rgba(255,219,35,1) 52%,rgba(0,207,255,.72) 68%,transparent 100%);filter:blur(3px);opacity:.98;transform:rotate(0);animation:duoArcadeFlash 1.05s ease-in-out infinite;pointer-events:none}
.duo-success-emblem:after{content:"";position:absolute;z-index:1;inset:12%;border-radius:22%;background:radial-gradient(ellipse,rgba(255,255,255,.65),rgba(0,205,255,.25) 45%,transparent 72%);mix-blend-mode:screen;animation:duoFlashPulse .38s steps(2,end) infinite;pointer-events:none}
.duo-success-emblem.is-finished{opacity:0;pointer-events:none}
.duo-success-emblem.is-finished:before,.duo-success-emblem.is-finished:after,.duo-success-emblem.is-finished .duo-success-badge{animation:none!important}
.duo-success-emblem.is-finished:before,.duo-success-emblem.is-finished:after{display:none}
.duo-success-overlay:before{content:none}
.duo-success-overlay:after{content:none}
.duo-reward-next{position:absolute;z-index:8;left:4%;right:4%;bottom:7.5%;width:92%;padding:0;border:0;background:transparent;display:block;opacity:1;cursor:default;pointer-events:none;filter:none}
.duo-reward-next img{display:block;width:100%;height:auto;object-fit:contain}
.duo-reward-next .duo-reward-color{display:none}
.duo-reward-next.is-ready{cursor:pointer;pointer-events:auto;animation:duoRewardReady .55s ease-out both}
.duo-reward-next.is-ready .duo-reward-muted{display:none}
.duo-reward-next.is-ready .duo-reward-color{display:block;filter:drop-shadow(0 0 12px #20f2ff) drop-shadow(0 0 22px #ffd21c)}
.duo-reward-next:focus-visible{outline:3px solid #fff;outline-offset:4px;border-radius:18px}
@keyframes duoRewardReady{0%{transform:scale(.97);filter:brightness(.65)}65%{transform:scale(1.025);filter:brightness(1.35)}100%{transform:scale(1);filter:brightness(1)}}
.duo-fail-overlay{position:absolute;inset:0;z-index:31;display:none;align-items:center;justify-content:center;overflow:hidden;pointer-events:none;background:rgba(12,0,13,.82);backdrop-filter:grayscale(.55) blur(2px)}
.duo-fail-overlay.show{display:flex;animation:duoFailIn .25s ease-out both}
.duo-fail-badge{position:relative;z-index:2;width:98%;height:auto;max-height:82%;object-fit:contain;filter:drop-shadow(0 0 14px #ff263c) drop-shadow(0 0 28px #00bfff);animation:duoFailImpact .5s cubic-bezier(.2,1.5,.4,1) both}
.duo-fail-overlay:before{content:"";position:absolute;z-index:3;left:-25%;right:-25%;top:-48%;height:44%;background:linear-gradient(180deg,transparent,rgba(0,0,0,.2) 15%,rgba(255,255,255,.95) 43%,rgba(255,40,58,.9) 52%,rgba(0,205,255,.48) 65%,transparent);filter:blur(9px);transform:rotate(8deg);animation:duoReverseFlash 1.05s linear infinite}
.duo-fail-overlay:after{content:"";position:absolute;inset:0;z-index:1;background:repeating-linear-gradient(180deg,rgba(255,30,50,.10) 0 2px,transparent 2px 15px);mix-blend-mode:screen;animation:duoFailPulse .3s steps(2,end) infinite}
@keyframes duoFailIn{from{opacity:0}to{opacity:1}}
@keyframes duoFailImpact{0%{transform:scale(1.15) translateY(-16px);opacity:0}45%{transform:scale(.96) translateY(3px);opacity:1}70%{transform:translateX(-5px)}85%{transform:translateX(5px)}100%{transform:scale(1) translateX(0)}}
@keyframes duoReverseFlash{0%{top:-48%}100%{top:112%}}
@keyframes duoFailPulse{0%,100%{opacity:.18}50%{opacity:.8}}
@keyframes duoSuccessIn{from{opacity:0}to{opacity:1}}
@keyframes duoBadgePop{0%{transform:scale(.52) rotate(-5deg);opacity:0}65%{transform:scale(1.06) rotate(1deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes duoArcadeFlash{0%{bottom:-48%}100%{bottom:112%}}
@keyframes duoFlashPulse{0%,100%{opacity:.16}50%{opacity:.72}}
@media(prefers-reduced-motion:reduce){.duo-success-emblem:before,.duo-success-emblem:after,.duo-success-badge,.duo-fail-overlay:before,.duo-fail-overlay:after,.duo-fail-badge{animation:none}}
.duo-hidden{display:none!important}
@media(min-height:850px){.duo-content{gap:15px}.duo-camera-panel{height:clamp(190px,25vh,255px)}.duo-player-panel{padding:17px}}
@media(prefers-reduced-motion:reduce){.duo-scan-line{animation:none}.duo-status-fill{transition:none}}

<body>
<main class="duo-stage">
  <div class="duo-content">
    <header class="duo-top">
      <a class="duo-back" href="./world.html" aria-label="Back to Barameel World">‹</a>
      <div class="duo-top-title">DUO CONNECT</div>
      <div class="duo-crown" aria-hidden="true">♛</div>
    </header>

    <div class="duo-brand" aria-label="Barameel Duo Connect">
      <small>BARAMEEL</small>
      <strong>DUO CONNECT</strong>
    </div>

    <section class="duo-camera-panel" id="cameraPanel" aria-label="QR camera preview">
      <video id="duoVideo" playsinline webkit-playsinline muted autoplay></video>
      <div class="duo-camera-symbol" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="none"><path d="M17 31h15l7-10h23l7 10h14a8 8 0 0 1 8 8v37a8 8 0 0 1-8 8H17a8 8 0 0 1-8-8V39a8 8 0 0 1 8-8Z" fill="currentColor"/><circle cx="50" cy="55" r="19" fill="#08275e"/><circle cx="50" cy="55" r="11" fill="currentColor"/><circle cx="76" cy="41" r="4" fill="#08275e"/></svg>
      </div>
      <div class="duo-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="duo-scan-line" aria-hidden="true"></div>
      <canvas id="duoCanvas" hidden></canvas>
    </section>

    <button id="startScanButton" class="duo-start-scan" type="button" aria-label="Start QR scanner">START SCAN</button>
    <button id="connectButton" class="duo-connect-button" type="button" aria-label="Connect to scanned Barameel player" disabled><img class="connect-idle-art" src="./assets/distressed-connect-game-button.webp" alt=""><img class="connect-ready-art" src="./assets/glossy-neon-connect-button.webp" alt=""></button>

    <p class="duo-helper">SCAN A PLAYER. DISCOVER YOUR DUO.</p>

    <section class="duo-status" aria-live="polite">
      <div class="duo-status-label">DUO DISCOVERY</div>
      <div class="duo-status-track"><div id="statusFill" class="duo-status-fill"></div></div>
      <div id="statusMessage" class="duo-status-message">READY TO CONNECT</div>
    </section>

    <section class="duo-player-panel" aria-label="My Barameel QR code">
      <div class="duo-player-heading">MY BARAMEEL CODE</div>
      <div class="duo-qr-frame"><div id="playerQr"><span style="font:700 11px Arial;color:#15335c">LOADING QR…</span></div></div>
      <div id="playerName" class="duo-player-name">BARAMEEL PLAYER</div>
      <div id="playerCode" class="duo-player-code">BM-••••••••</div>
      <p class="duo-id-caption">YOUR CODE. YOUR IDENTITY.</p>
    </section>
    <div id="duoMessage" class="duo-message" role="status" aria-live="polite"></div>
    <div id="duoSuccessOverlay" class="duo-success-overlay" aria-hidden="true"><div class="duo-success-emblem"><img class="duo-success-badge" src="./assets/duo-connected-badge.webp" alt="Duo Connected"></div><button id="duoRewardNext" class="duo-reward-next" type="button" aria-label="Discover your reward" disabled><img class="duo-reward-muted" src="./assets/discover-your-reward-monochrome.webp" alt="Discover your reward"><img class="duo-reward-color" src="./assets/discover-your-reward.webp" alt=""></button></div>
    <div id="duoFailOverlay" class="duo-fail-overlay" aria-hidden="true"><img class="duo-fail-badge" src="./assets/duo-try-again.webp" alt="Try Again — Find Your Duo Again"></div>
    <audio id="duoLoseSound" preload="auto" src="./assets/duo-try-again-lose.mp3"></audio>
    <audio id="duoJackpotSound" preload="auto" src="./assets/duo-connected-jackpot.mp3"></audio>
  </div>
</main>

<script>
(() => {
  const panel=document.getElementById('cameraPanel');
  const video=document.getElementById('duoVideo');
  const canvas=document.getElementById('duoCanvas');
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  const connect=document.getElementById('connectButton');
  const startScan=document.getElementById('startScanButton');
  const playerQr=document.getElementById('playerQr');
  const playerName=document.getElementById('playerName');
  const playerCodeEl=document.getElementById('playerCode');
  const statusMessage=document.getElementById('statusMessage');
  const statusFill=document.getElementById('statusFill');
  const message=document.getElementById('duoMessage');
  const successOverlay=document.getElementById('duoSuccessOverlay');
  const failOverlay=document.getElementById('duoFailOverlay');
  const loseSound=document.getElementById('duoLoseSound');
  const jackpotSound=document.getElementById('duoJackpotSound');
  let successOverlayTimer=0,failOverlayTimer=0;
  const rewardNext=document.getElementById('duoRewardNext');
  let stream=null, detector=null, raf=0, busy=false, locked=false, jsqrLoading=false;
  let ownCode='', lastRaw='', lastAt=0, scannedCode='';

  function setMessage(text,type=''){message.textContent=text||'';message.className='duo-message'+(type?' '+type:'');}
  function showDuoSuccess(){clearTimeout(successOverlayTimer);clearTimeout(failOverlayTimer);failOverlay.classList.remove('show');failOverlay.setAttribute('aria-hidden','true');message.textContent='';message.className='duo-message';rewardNext.disabled=true;rewardNext.classList.remove('is-ready');const emblem=successOverlay.querySelector('.duo-success-emblem');emblem.classList.remove('is-finished');successOverlay.classList.add('show');successOverlay.setAttribute('aria-hidden','false');let advanced=false;const enableReward=()=>{if(advanced)return;advanced=true;rewardNext.disabled=false;rewardNext.classList.add('is-ready');};jackpotSound.onended=enableReward;try{jackpotSound.currentTime=0;const play=jackpotSound.play();if(play?.catch)play.catch(()=>{setTimeout(enableReward,250);});}catch{setTimeout(enableReward,250);}successOverlayTimer=setTimeout(()=>{emblem.classList.add('is-finished');},7800);}
  function showDuoFailure(){clearTimeout(failOverlayTimer);clearTimeout(successOverlayTimer);successOverlay.classList.remove('show');successOverlay.setAttribute('aria-hidden','true');message.textContent='';message.className='duo-message';failOverlay.classList.add('show');failOverlay.setAttribute('aria-hidden','false');try{loseSound.currentTime=0;const play=loseSound.play();if(play?.catch)play.catch(()=>{});}catch{}failOverlayTimer=setTimeout(()=>{failOverlay.classList.remove('show');failOverlay.setAttribute('aria-hidden','true');},6200);}
  function setStatus(text,progress=null){statusMessage.textContent=text;if(progress!==null)statusFill.style.width=Math.max(0,Math.min(100,progress))+'%';}
  let progressAudio=null,progressFrame=0;
  function progressTone(value,up){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;progressAudio=progressAudio||new AC();if(progressAudio.state==='suspended')progressAudio.resume();const p=Math.max(0,Math.min(100,value))/100,t=progressAudio.currentTime,o=progressAudio.createOscillator(),g=progressAudio.createGain();o.type='triangle';o.frequency.value=up?260+900*p:900-620*p;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.09);o.connect(g).connect(progressAudio.destination);o.start(t);o.stop(t+.1);}catch{}}
  function animateProgress(target,up,duration,onComplete=null){cancelAnimationFrame(progressFrame);const from=parseFloat(statusFill.style.width)||0,start=performance.now();let last=-1;function tick(now){const p=Math.min(1,(now-start)/duration),e=up?1-Math.pow(1-p,2):p*p,value=from+(target-from)*e;statusFill.style.width=value+'%';const step=Math.floor(value/7);if(step!==last){last=step;progressTone(value,up);}if(p<1)progressFrame=requestAnimationFrame(tick);else{statusFill.style.width=target+'%';if(typeof onComplete==='function')onComplete();}}progressFrame=requestAnimationFrame(tick);}
  function stopCamera(){cancelAnimationFrame(raf);raf=0;stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;panel.classList.remove('scanning');locked=false;startScan.setAttribute('aria-label','Start QR scanner');}
  function playerCode(){
    const stateCode=String(BR.state?.playerCode||BR.state?.player_code||BR.state?.playerId||'').trim().toUpperCase();
    if(/^BM-[A-Z0-9]{7,8}$/.test(stateCode))return stateCode;
    try{
      const saved=JSON.parse(localStorage.getItem('barameel.world.player.v23.7')||'null');
      const savedCode=String(saved?.playerCode||saved?.player_code||saved?.playerId||'').trim().toUpperCase();
      if(/^BM-[A-Z0-9]{7,8}$/.test(savedCode)){
        if(typeof BR.mergePlayer==='function')BR.mergePlayer({...saved,playerId:savedCode,playerCode:savedCode,player_code:savedCode});
        return savedCode;
      }
    }catch(error){console.warn('[DUO] Could not restore saved player identity',error);}
    return '';
  }
  function renderIdentity(){
    ownCode=playerCode();
    playerName.textContent=String(BR.state?.nickname||'BARAMEEL PLAYER').trim().slice(0,40);
    playerCodeEl.textContent=ownCode||'RESTORING PLAYER CODE…';
    playerQr.innerHTML='';
    if(!ownCode||!/^BM-[A-Z0-9]{7,8}$/.test(ownCode)){
      playerQr.innerHTML='<span style="font:700 11px Arial;color:#15335c;text-align:center;padding:8px">RESTORING YOUR BARAMEEL ID…</span>';
      return;
    }
    if(typeof QRCode!=='function'){playerQr.textContent=ownCode;setMessage('QR renderer did not load. Check your connection.','error');return;}
    new QRCode(playerQr,{text:ownCode,width:190,height:190,colorDark:'#07152f',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
    setMessage('');
  }
  async function nativeReader(){
    if(!('BarcodeDetector' in window))return;
    try{const formats=await BarcodeDetector.getSupportedFormats();if(formats.includes('qr_code'))detector=new BarcodeDetector({formats:['qr_code']});}catch{}
  }
  function loadJsQR(){
    if(typeof window.jsQR==='function')return Promise.resolve(true);
    if(jsqrLoading)return new Promise(resolve=>{const t=setInterval(()=>{if(window.jsQR){clearInterval(t);resolve(true)}},100);setTimeout(()=>{clearInterval(t);resolve(!!window.jsQR)},5000)});
    jsqrLoading=true;
    return new Promise(resolve=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';s.onload=()=>resolve(true);s.onerror=()=>resolve(false);document.head.appendChild(s);});
  }
  async function startCamera(){
    if(stream){stopCamera();setStatus('READY TO CONNECT',0);return;}
    setMessage('');
    if(!ownCode)renderIdentity();
    if(!ownCode||!/^BM-[A-Z0-9]{7,8}$/.test(ownCode)){setMessage('Your Barameel player code is not ready.','error');return;}
    if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){setMessage('Camera requires HTTPS. Open Barameel in Safari or Chrome.','error');return;}
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
      video.srcObject=stream;await video.play();panel.classList.add('scanning');
      startScan.setAttribute('aria-label','Stop camera scanner');
      setStatus('SCANNING FOR A BARAMEEL PLAYER QR',10);
      await nativeReader();
      const ok=await loadJsQR();
      if(!detector&&!ok){setMessage('QR scanner could not load. Check your internet connection.','error');stopCamera();return;}
      loop();
    }catch(err){
      const denied=err?.name==='NotAllowedError'||err?.name==='PermissionDeniedError';
      const missing=err?.name==='NotFoundError';
      setMessage(denied?'Camera permission denied. Allow camera access in browser settings.':missing?'No camera was found on this device.':'Camera could not start. Close other camera apps and retry.','error');
      stopCamera();
    }
  }
  async function loop(){
    if(!stream||locked)return;
    if(!busy&&video.readyState>=2&&video.videoWidth){
      busy=true;
      try{
        if(detector){try{const found=await detector.detect(video);if(found?.length){busy=false;return handle(found[0].rawValue||'');}}catch{}}
        if(window.jsQR){
          const w=760,h=Math.max(1,Math.round(760*video.videoHeight/video.videoWidth));
          if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
          ctx.drawImage(video,0,0,w,h);
          const found=window.jsQR(ctx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'attemptBoth'});
          if(found?.data){busy=false;return handle(found.data);}
        }
      }catch{}finally{busy=false;}
    }
    raf=requestAnimationFrame(loop);
  }
  async function handle(raw){
    if(locked)return;
    const code=String(raw||'').trim().toUpperCase();
    if(!/^BM-[A-Z0-9]{7,8}$/.test(code)){
      const now=Date.now();if(code===lastRaw&&now-lastAt<1800)return;lastRaw=code;lastAt=now;
      setMessage('This is not a Barameel player code. Scan another player’s QR.','error');return;
    }
    if(code===ownCode){setMessage('That is your own QR code. Scan another player.','error');return;}
    scannedCode=code;stopCamera();connect.disabled=false;connect.classList.add('is-ready');
    setStatus('PLAYER SCANNED — READY TO CONNECT',0);
    setMessage('PLAYER CODE READ SUCCESSFULLY. PRESS CONNECT TO CHECK YOUR DUO.','success');
    BR.play('confirm');BR.haptic('confirm');
  }
  async function connectScannedPlayer(){
    if(!scannedCode||locked)return;
    locked=true;connect.disabled=true;connect.classList.remove('is-ready');setMessage('CHECKING DUO COMPATIBILITY…');setStatus('CHECKING PLAYER…',45);BR.play('confirm');BR.haptic('confirm');progressTone(45,true);
    const key='duo-'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));
    let result;try{result=await BR.duoLink(scannedCode,key);}catch(error){result={ok:false,message:'Could not connect right now. Please try again.'};}
    if(!result?.ok){setStatus('CONNECTION FAILED',45);animateProgress(0,false,650);setMessage(result?.message||'Could not connect right now. Please try again.','error');scannedCode='';locked=false;return;}
    if(result.discovered){setStatus('MATCHING…',parseFloat(statusFill.style.width)||45);animateProgress(100,true,1250,()=>{setStatus('PARTNER DISCOVERED!',100);showDuoSuccess();BR.haptic('reward');});}
    else{setStatus('NO DISCOVERY THIS TIME',45);animateProgress(0,false,900);showDuoFailure();BR.play('error');BR.haptic('error');scannedCode='';locked=false;}
  }
  startScan.addEventListener('click',()=>{if(stream){stopCamera();setStatus('READY TO SCAN',0);return;}scannedCode='';connect.disabled=true;connect.classList.remove('is-ready');setStatus('READY TO SCAN',0);BR.play('scan');BR.haptic('scan');startCamera();});
  connect.addEventListener('click',connectScannedPlayer);
  rewardNext.addEventListener('click',()=>{if(rewardNext.disabled)return;window.location.href='./reveal-barameel-box.html';});
  window.addEventListener('pagehide',stopCamera);
  renderIdentity();
  if(!ownCode&&typeof BR.syncPlayer==='function'){
    BR.syncPlayer().then(result=>{
      if(result?.player)BR.mergePlayer(result.player);
      renderIdentity();
      if(!ownCode)setMessage('Your registered player code could not be restored. Return to My Barameel and retry.','error');
    }).catch(error=>{
      console.error('[DUO] Player identity restore failed',error);
      setMessage('Could not restore your Barameel code. Check your connection and retry.','error');
    });
  }
  BR.duoStatus?.().then(r=>{
    if(r?.ok&&Array.isArray(r.pending_rewards)&&r.pending_rewards.length){
      setMessage('YOU HAVE '+r.pending_rewards.length+' REWARD(S) WAITING FOR REDEMPTION.','success');
    }
  }).catch(()=>{});
})();
</script>
