<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BARAMEEL RUN — ALEXANDRIA</title>
<link rel="stylesheet" href="./styles.css?v=20261001-21.0"><script src="./config.js?v=20261001-21.0"></script>
<style>#imagePreload{position:fixed;width:1px;height:1px;left:-10px;top:-10px;opacity:0;pointer-events:none}</style>
</head>
<body>
<main class="stage collection-stage">
  <img class="base" src="./assets/screen06-puzzle.webp" alt="ALEXANDRIA Collection">
  <button id="back" class="collection-back" aria-label="Back"></button>
  <select id="select" class="collection-select" aria-label="Select collection"><option value="collection01">ALEXANDRIA</option></select>
  <div id="heroGrid" class="hero-grid"></div>
  <div id="reward" class="reward-text" aria-live="polite"></div>
  <div id="thumbs" class="collection-thumbs"></div>
  <button id="myRewards" class="hotspot" style="left:44.5%;top:62.8%;width:24.8%;height:5.2%" aria-label="My Rewards"></button>
  <button id="scanMore" class="hotspot" style="left:70.0%;top:62.8%;width:25.0%;height:5.2%" aria-label="Scan More"></button>
  <div id="completeFlash" class="complete-flash"></div>
  <div id="imagePreload"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js?v=20261001-21.0"></script>
<script src="./barameel-v205-fix.js?v=20261001-21.0"></script>
<script>
(async()=>{
  const cfg=await BR.fetchCollection('collection01');
  const hero=document.getElementById('heroGrid'),thumbs=document.getElementById('thumbs'),reward=document.getElementById('reward'),select=document.getElementById('select'),completeFlash=document.getElementById('completeFlash');
  let handoff=null;try{handoff=JSON.parse(sessionStorage.getItem('barameelLastScan')||'null')}catch{}
  const params=new URLSearchParams(location.search);
  const requestedImage=params.get('image')||handoff?.image_id||handoff?.image||handoff?.reward?.image_id||handoff?.reward?.image||BR.state?.lastReward?.image_id||'image01';
  const cache=new Map();
  try{await BR.syncPlayer()}catch{}
  function url(file){if(!file)return '';let s=String(file).replace(/^\.\//,'');if(/\.png$/i.test(s)&&/\/masters\/image\d{2}-master\.png$/i.test(s))s=s.replace(/\.png$/i,'.webp');return './'+s+'?v=20261001-21.0'}
  function load(file,priority='low'){const u=url(file);if(!u)return Promise.resolve(null);if(cache.has(u))return cache.get(u);const p=new Promise(resolve=>{const img=new Image();img.decoding='async';img.loading='eager';try{img.fetchPriority=priority}catch{}img.onload=async()=>{try{await img.decode()}catch{}resolve(img)};img.onerror=()=>resolve(null);img.src=u});cache.set(u,p);return p}
  function crop(el,p){el.style.backgroundSize='300% 300%';el.style.backgroundPosition=`${(p.column-1)*50}% ${(p.row-1)*50}%`;el.style.backgroundRepeat='no-repeat'}
  function rarityFor(im,n){return String(im.pieces[n-1]?.rarity||'COMMON').toUpperCase()}
  function piecePointsFor(im,n){return Number(im.pieces[n-1]?.points||BR.RARITY?.[rarityFor(im,n)]?.points||10000)}
  function isComplete(im){return BR.count('collection01',im.imageId)>=9}
  async function paintMaster(im){const img=await load(im.masterFile,'high');if(!img)return false;const bg=`url("${img.src}")`;if(isComplete(im)){hero.style.backgroundImage=bg;hero.style.backgroundSize='100% 100%';hero.style.backgroundPosition='center';return true}for(let n=1;n<=9;n++){const p=im.pieces[n-1],c=hero.children[n-1];if(c){c.style.backgroundImage=bg;c.style.backgroundSize='300% 300%';c.style.backgroundPosition=`${(p.column-1)*50}% ${(p.row-1)*50}%`}}return true}
  function renderHero(im){
    hero.classList.remove('completed');hero.style.backgroundImage='';hero.innerHTML='';
    if(isComplete(im)){hero.classList.add('completed');paintMaster(im);return}
    for(let n=1;n<=9;n++){const p=im.pieces[n-1],c=document.createElement('div');c.className='hero-piece';crop(c,p);c.classList.toggle('is-missing',!BR.hasPiece('collection01',im.imageId,n));c.classList.toggle('is-collected',BR.hasPiece('collection01',im.imageId,n));hero.appendChild(c)}
    paintMaster(im);
  }
  const pos=[
    [2.62,69.25,18.24,11.83],[22.12,69.25,17.92,11.83],[41.19,69.25,17.92,11.83],[60.17,69.25,17.82,11.83],[79.35,69.25,18.24,11.83],
    [2.62,81.25,18.24,12.07],[22.12,81.25,17.92,12.07],[41.19,81.25,17.92,12.07],[60.17,81.25,17.92,12.07],[79.35,81.25,18.24,12.07]
  ];
  const jobs=[];
  cfg.images.forEach((im,idx)=>{
    const b=document.createElement('button');b.type='button';b.className='collection-thumb';b.style.cssText=`left:${pos[idx][0]}%;top:${pos[idx][1]}%;width:${pos[idx][2]}%;height:${pos[idx][3]}%`;
    const grid=document.createElement('div');grid.className='thumb-grid';
    for(let n=1;n<=9;n++){const p=im.pieces[n-1],c=document.createElement('span');c.className='thumb-piece';crop(c,p);c.classList.toggle('is-missing',!BR.hasPiece('collection01',im.imageId,n));c.classList.toggle('is-collected',BR.hasPiece('collection01',im.imageId,n));grid.appendChild(c)}
    b.appendChild(grid);
    const count=document.createElement('span');count.className='thumb-count';count.textContent=BR.count('collection01',im.imageId);b.appendChild(count);
    b.onclick=()=>{BR.play('tap');select.value=im.imageId;render(im)};
    thumbs.appendChild(b);jobs.push({im,pieces:[...grid.children]});
  });
  function applyThumbs(im,img){if(!img)return;const u=`url("${img.src}")`;const job=jobs.find(x=>x.im.imageId===im.imageId);if(job)job.pieces.forEach(el=>el.style.backgroundImage=u)}
  async function preloadAll(){const loaded=await Promise.all(cfg.images.map(im=>load(im.masterFile,'low')));loaded.forEach((img,i)=>applyThumbs(cfg.images[i],img))}
  function render(im){select.value=im.imageId;renderHero(im);load(im.masterFile,'high').then(img=>applyThumbs(im,img));preloadAll()}
  function animateNumber(target,duration){const start=0;const t0=performance.now();return new Promise(resolve=>{function step(now){const p=Math.min(1,(now-t0)/duration);const eased=1-Math.pow(1-p,3);reward.textContent='+'+Math.round(start+(target-start)*eased).toLocaleString();if(p<1)requestAnimationFrame(step);else{reward.textContent='+'+target.toLocaleString();resolve()}}requestAnimationFrame(step)})}
  function revealReward(points,rarity){
    const safePoints=Math.max(10000,Number(points)||10000);
    const spec=BR.rewardSpec?BR.rewardSpec(rarity,safePoints):{duration:1400,rarity:String(rarity||'COMMON').toUpperCase(),points:safePoints};
    const key=String(spec.rarity||'COMMON').toLowerCase();reward.className='reward-text '+key+' revealing';
    BR.playRewardReveal?BR.playRewardReveal(safePoints,spec.rarity):BR.playPointsCountUp(safePoints,spec.rarity);
    animateNumber(safePoints,Number(spec.duration)||1400).then(()=>{reward.classList.remove('revealing')});
    if(spec.rarity==='LEGENDARY'||spec.rarity==='MYTHIC'){completeFlash.classList.remove('on');void completeFlash.offsetWidth;completeFlash.classList.add('on')}
  }
  function normalizeHandoff(h){
    if(!h)return null;
    const imageId=h.image_id||h.image||h.reward?.image_id||h.reward?.image;
    const pieceNumber=Number(h.piece_number||h.piece||h.reward?.piece_number||h.reward?.piece||0);
    const im=cfg.images.find(x=>x.imageId===imageId);
    const meta=im?.pieces?.[pieceNumber-1];
    const serverPoints=Number(h.points??h.points_awarded??h.reward?.points??0);
    const points=(serverPoints>=10000?serverPoints:Number(meta?.points||BR.RARITY?.[String(meta?.rarity||h.rarity||'COMMON').toUpperCase()]?.points||10000));
    const rarity=String(h.rarity||h.reward?.rarity||meta?.rarity||'COMMON').toUpperCase();
    return {...h,image_id:imageId,piece_number:pieceNumber,points,rarity};
  }
  const current=cfg.images.find(im=>im.imageId===requestedImage)||cfg.images[0];
  render(current);select.onchange=()=>{BR.play('tap');const im=cfg.images.find(x=>x.imageId===select.value)||cfg.images[0];render(im)};
  if(handoff){
    handoff=normalizeHandoff(handoff);
    const points=Number(handoff?.points||0);
    const rarity=String(handoff?.rarity||'COMMON').toUpperCase();
    if(points>0&&!handoff.duplicate)revealReward(points,rarity);
    const rewardedImage=handoff?.image_id;
    if(rewardedImage){const im=cfg.images.find(x=>x.imageId===rewardedImage);if(im){select.value=im.imageId;render(im);if(isComplete(im)){BR.playCompletionSound();completeFlash.classList.add('on');BR.flash()}}}
  }
  document.getElementById('back').onclick=()=>BR.goAfter('screen05.html','back',180);
  document.getElementById('myRewards').onclick=()=>BR.goAfter('screen04.html','confirm',180);
  document.getElementById('scanMore').onclick=()=>BR.goAfter('screen05.html','scan',180);
  BR.track('collection_view',{image_id:select.value});
})();
</script>
</body>
</html>
