<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e2a3d">
<title>BARAMEEL RUN — ALEXANDRIA</title>
<link rel="stylesheet" href="./styles.css?v=20260930-20.7">
<script src="./config.js?v=20260930-20.7"></script>
<style>
/* V20.7: image loading layer. Existing layout/hotspots remain untouched. */
.collection-image-layer{position:absolute;inset:0;pointer-events:none;z-index:2}
.collection-master-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .12s ease;display:block}
.collection-master-img.ready{opacity:1}
.collection-loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;opacity:.85;font:900 12px/1.1 system-ui,sans-serif;letter-spacing:.08em}
</style>
</head>
<body>
<main class="stage collection-stage">
  <img class="base" src="./assets/screen06-puzzle.webp" alt="ALEXANDRIA Collection">

  <div id="masterLayer" class="collection-image-layer" aria-hidden="true"></div>
  <div id="loading" class="collection-loading" hidden>LOADING</div>

  <button id="back" class="hotspot" style="left:2%;top:2%;width:20%;height:7%" aria-label="Back"></button>

  <select id="select" style="position:absolute;left:27%;top:13%;width:46%;z-index:20;height:4%;font-weight:900">
    <option value="collection01">ALEXANDRIA</option>
  </select>

  <div id="heroGrid" class="hero-grid"></div>
  <div id="reward" class="reward-text"></div>
  <div id="thumbs" class="collection-thumbs"></div>

  <button id="myRewards" class="hotspot" style="left:7%;top:81%;width:41%;height:9%" aria-label="My Rewards"></button>
  <button id="scanMore" class="hotspot" style="left:52%;top:81%;width:41%;height:9%" aria-label="Scan More"></button>
  <div id="completeFlash" class="barameel-flash"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js?v=20260930-20.4"></script>
<script src="./barameel-v205-fix.js?v=20260930-20.6.1"></script>

<script>
(async()=>{
  const cfg=await BR.fetchCollection('collection01');
  const hero=document.getElementById('heroGrid');
  const thumbs=document.getElementById('thumbs');
  const reward=document.getElementById('reward');
  const select=document.getElementById('select');
  const layer=document.getElementById('masterLayer');
  const loading=document.getElementById('loading');

  const params=new URLSearchParams(location.search);
  let handoff=null;
  try{handoff=JSON.parse(sessionStorage.getItem('barameelLastScan')||'null')}catch{}

  const requestedImage=params.get('image')
    || handoff?.image_id
    || handoff?.image
    || handoff?.reward?.image_id
    || handoff?.reward?.image
    || BR.state?.lastReward?.image_id
    || 'image01';

  const imageCache=new Map();

  try{await BR.syncPlayer()}catch{}

  function masterUrl(file){
    if(!file)return '';
    // collection.json now contains the real .webp path.
    return './'+file.replace(/^\.?\//,'');
  }

  function loadMaster(file, priority='auto'){
    const url=masterUrl(file);
    if(!url)return Promise.resolve(null);
    if(imageCache.has(url))return imageCache.get(url);

    const p=new Promise(resolve=>{
      const img=new Image();
      img.decoding='async';
      img.loading='eager';
      try{img.fetchPriority=priority}catch{}
      img.onload=async()=>{
        try{await img.decode()}catch{}
        resolve(img);
      };
      img.onerror=()=>resolve(null);
      img.src=url;
    });
    imageCache.set(url,p);
    return p;
  }

  async function showMaster(im){
    layer.innerHTML='';
    loading.hidden=false;

    const img=document.createElement('img');
    img.className='collection-master-img';
    img.alt='';
    img.decoding='async';
    img.loading='eager';
    try{img.fetchPriority='high'}catch{}
    img.src=masterUrl(im.masterFile);
    layer.appendChild(img);

    const ready=await new Promise(resolve=>{
      if(img.complete&&img.naturalWidth>0)return resolve(true);
      img.onload=()=>resolve(true);
      img.onerror=()=>resolve(false);
    });

    if(ready){
      try{await img.decode()}catch{}
      img.classList.add('ready');
      loading.hidden=true;
    }else{
      loading.textContent='IMAGE ERROR';
      // Fallback: try a direct Image object from the same path through cache.
      const cached=await loadMaster(im.masterFile,'high');
      if(cached){
        img.src=cached.src;
        try{await img.decode()}catch{}
        img.classList.add('ready');
        loading.hidden=true;
      }
    }
    return ready;
  }

  function crop(el,p){
    el.style.backgroundSize='300% 300%';
    el.style.backgroundPosition=`${(p.column-1)*50}% ${(p.row-1)*50}%`;
  }

  function renderPieceGrid(im){
    hero.innerHTML='';
    const els=[];
    for(let n=1;n<=9;n++){
      const p=im.pieces[n-1];
      const c=document.createElement('div');
      c.className='hero-piece';
      crop(c,p);
      c.classList.toggle('is-missing',!BR.hasPiece('collection01',im.imageId,n));
      c.classList.toggle('is-collected',BR.hasPiece('collection01',im.imageId,n));
      hero.appendChild(c);
      els.push(c);
    }
    // Keep the existing CSS piece-grid behavior; once the master is decoded,
    // also give each crop the same real WebP as a background for compatibility.
    return loadMaster(im.masterFile,'high').then(img=>{
      if(img){
        const u=`url("${img.src}")`;
        els.forEach(el=>el.style.backgroundImage=u);
      }
    });
  }

  function renderThumbGrid(im){
    const b=document.createElement('button');
    b.type='button';
    b.className='collection-thumb';

    const grid=document.createElement('div');
    grid.className='thumb-grid';
    for(let n=1;n<=9;n++){
      const p=im.pieces[n-1];
      const c=document.createElement('span');
      c.className='thumb-piece';
      crop(c,p);
      c.classList.toggle('is-missing',!BR.hasPiece('collection01',im.imageId,n));
      c.classList.toggle('is-collected',BR.hasPiece('collection01',im.imageId,n));
      grid.appendChild(c);
    }
    b.appendChild(grid);

    const badge=document.createElement('span');
    badge.className='thumb-index';
    badge.textContent=im.imageNumber;
    b.appendChild(badge);

    const count=document.createElement('span');
    count.className='thumb-count';
    count.textContent=BR.count('collection01',im.imageId);
    b.appendChild(count);

    b.onclick=()=>{
      BR.play('tap');
      select.value=im.imageId;
      render(im);
    };
    return {button:b,pieces:[...grid.children]};
  }

  const pos=[
    [2.62,71.07,18.24,11.83],[22.12,71.07,17.92,11.83],[41.19,71.07,17.92,11.83],
    [60.17,71.07,17.82,11.83],[79.35,71.07,18.24,11.83],
    [2.62,83.38,18.24,12.07],[22.12,83.38,17.92,12.07],[41.19,83.38,17.92,12.07],
    [60.17,83.38,17.92,12.07],[79.35,83.38,18.24,12.07]
  ];

  const thumbJobs=[];
  cfg.images.forEach((im,idx)=>{
    const job=renderThumbGrid(im);
    job.button.style.cssText=`left:${pos[idx][0]}%;top:${pos[idx][1]}%;width:${pos[idx][2]}%;height:${pos[idx][3]}%`;
    thumbs.appendChild(job.button);
    thumbJobs.push({im,pieces:job.pieces});
  });

  // Preload all 10 WebP masters concurrently after the selected image is ready.
  async function preloadAllMasters(){
    await Promise.all(cfg.images.map(im=>loadMaster(im.masterFile,'low')));
    thumbJobs.forEach(job=>{
      const p=imageCache.get(masterUrl(job.im.masterFile));
      if(p)p.then(img=>{
        if(!img)return;
        const u=`url("${img.src}")`;
        job.pieces.forEach(el=>el.style.backgroundImage=u);
      });
    });
  }

  let renderToken=0;
  async function render(im){
    const token=++renderToken;
    select.value=im.imageId;

    // Selected image is decoded first. This is the only image that blocks
    // the hero render.
    await showMaster(im);
    if(token!==renderToken)return;

    await renderPieceGrid(im);
    if(token!==renderToken)return;

    // Start all remaining WebPs together after hero is ready.
    preloadAllMasters();
  }

  const current=cfg.images.find(im=>im.imageId===requestedImage)||cfg.images[0];
  render(current);

  select.onchange=()=>{
    BR.play('tap');
    const im=cfg.images.find(x=>x.imageId===select.value)||cfg.images[0];
    render(im);
  };

  if(handoff){
    const points=Number(handoff.points??handoff.points_awarded??handoff.reward?.points??0);
    if(points>0&&!handoff.duplicate){
      reward.textContent='+'+points.toLocaleString();
      BR.playPointsCountUp(points);
    }

    const rewardedImage=
      handoff.image_id
      ||handoff.image
      ||handoff.reward?.image_id
      ||handoff.reward?.image;

    if(rewardedImage){
      const im=cfg.images.find(x=>x.imageId===rewardedImage);
      if(im){
        select.value=im.imageId;
        render(im);
        if(BR.count('collection01',im.imageId)===9){
          BR.playCompletionSound();
          BR.flash();
        }
      }
    }
  }

  document.getElementById('back').onclick=()=>BR.goAfter('screen05.html','back',180);
  document.getElementById('myRewards').onclick=()=>BR.goAfter('screen04.html','confirm',180);
  document.getElementById('scanMore').onclick=()=>BR.goAfter('screen05.html','scan',180);

  BR.track('collection_view',{image_id:select.value});
})();
</script>
</body>
</html>
