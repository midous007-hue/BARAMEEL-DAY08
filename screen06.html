<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BARAMEEL RUN — COLLECTION PUZZLE</title>
<link rel="stylesheet" href="./styles.css?v=20261023-reward-audio-2">
<script src="./config.js?v=20261006-23.8"></script>
</head>
<body>
<main class="stage collection-stage">
<img class="base" src="./assets/screen06-puzzle.webp?v=20261023-reward-audio-2" alt="Collection Puzzle">
<button id="back" class="collection-back" aria-label="Back to Collection Scan"></button>
<select id="select" class="collection-select" aria-label="Select collection"></select>
<div id="collectionName" class="collection-name" aria-hidden="true"></div>
<div id="heroGrid" class="hero-grid"></div>
<div id="pointsBadge" class="points-badge common"><span id="pointsNumber" class="points-number"></span></div>
<div id="rewardFlash" class="reward-flash" aria-hidden="true"><div class="reward-flash-glow"></div><img id="rewardFlashImage" class="reward-flash-image" alt=""><div class="reward-flash-sheen"></div></div>
<div id="thumbs" class="collection-thumbs"></div>
<button id="myRewards" class="hotspot" aria-label="My Rewards"></button>
<button id="scanMore" class="hotspot" aria-label="Scan More"></button>
<div id="completeFlash" class="complete-flash"></div>
<div id="imagePreload"></div>
<style>
/* COLLECTION PUZZLE — geometry read from Figma frame 10:130 (989×1591). */
.hero-grid{left:45.20%!important;top:37.40%!important;width:49.14%!important;height:25.14%!important;display:block!important;grid-template-columns:none!important;grid-template-rows:none!important;overflow:hidden!important}.hero-piece{position:absolute!important;margin:0!important;padding:0!important;background-repeat:no-repeat!important;background-color:transparent!important;overflow:hidden!important}.points-badge{
  left:54.70%!important;
  top:63.36%!important;
  width:30.54%!important;
  height:3.96%!important;
  filter:none!important;
}
.points-number{
  font-family:'Bebas Neue','Roboto Condensed','Arial Narrow',Arial,sans-serif!important;
  font-size:clamp(18px,4.25vw,42px)!important;font-weight:900!important;line-height:1!important;letter-spacing:-.02em!important;color:#f6e7ce!important;text-shadow:0 2px 0 #071a20,0 0 5px rgba(246,231,206,.18)!important;transform:none!important;-webkit-text-stroke:1px #071a20!important;
}
.reward-flash{z-index:120!important}
</style></main>
<script src="./app.js?v=20261006-23.8"></script>
<script>
(async()=>{
  const nameEl=document.getElementById('collectionName'),select=document.getElementById('select');
  const hero=document.getElementById('heroGrid'),thumbs=document.getElementById('thumbs');
  const pointsBadge=document.getElementById('pointsBadge'),pointsNumber=document.getElementById('pointsNumber');
  document.getElementById('back').onclick=()=>{BR.safeSession.remove('barameelCollectionParent');BR.safeSession.set('barameelActivePath','world');BR.goAfter('screen04.html','back',180)};
  document.getElementById('myRewards').onclick=()=>{
    BR.safeSession.set('barameelRewardsParent','screen06.html');
    BR.safeSession.set('barameelCollectionId',collectionId);
    BR.safeSession.set('barameelActivePath','collection');
    BR.goAfter('marks-wallet.html','confirm',180);
  };
  document.getElementById('scanMore').onclick=()=>{BR.safeSession.set('barameelActivePath','collection');BR.safeSession.set('barameelCollectionId',collectionId);BR.safeSession.set('barameelCollectionParent','screen06.html');BR.goAfter('screen05.html','scan',220)};
  const rewardFlash=document.getElementById('rewardFlash'),rewardFlashImage=document.getElementById('rewardFlashImage');

  const params=new URLSearchParams(location.search);
  let collectionId=params.get('collection')||'collection01';
  let requestedImage=params.get('image')||'image01';
  let index=[],activeCfg=null,activeImageId=requestedImage;
  const configs=new Map(),masters=new Map();

  function getHandoff(){
    try{return JSON.parse(BR.safeSession.get('barameelLastScan')||'null')}catch{return null}
  }

  await BR.syncPlayer().catch(()=>null);
  const handoff=getHandoff();
  if(handoff?.collection_id)collectionId=String(handoff.collection_id);
  if(handoff?.image_id)requestedImage=String(handoff.image_id);

  function masterUrl(file){return './'+String(file||'').replace(/^\.\//,'')+'?v='+BR.VERSION}
  function thumbUrl(file){
    try{
      const origin=new URL(String(file||'').replace(/^\.\//,''),location.href).href;
      return 'https://wsrv.nl/?url='+encodeURIComponent(origin)+'&w=180&output=webp&q=45&maxage=1y';
    }catch{return masterUrl(file)}
  }

  async function loadMaster(file){
    const url=masterUrl(file);
    if(masters.has(url))return masters.get(url);
    const promise=new Promise(resolve=>{
      const img=new Image();img.decoding='async';img.onload=async()=>{try{await img.decode()}catch{}resolve(img)};img.onerror=()=>resolve(null);img.src=url;
    });
    masters.set(url,promise);return promise;
  }

  function syncThumbCrops(grid,img){
    if(!grid)return;
    const gw=grid.clientWidth,gh=grid.clientHeight;
    if(!gw||!gh)return;
    const cover=img?coverGeometry(img,gw,gh):{bw:gw,bh:gh,ox:0,oy:0};
    [...grid.children].forEach((cell,n)=>{
      const col=n%3,row=Math.floor(n/3),x=cell.offsetLeft,y=cell.offsetTop;
      cell.style.backgroundSize=cover.bw+'px '+cover.bh+'px';
      cell.style.backgroundPosition=(-cover.ox-x)+'px '+(-cover.oy-y)+'px';
      cell.style.backgroundRepeat='no-repeat';
    });
  }

  function pieceCollected(cid,iid,num){return BR.hasPiece(cid,iid,num)}
  function imageComplete(cid,im){return BR.count(cid,im.imageId)>=9}

  const HERO_COLS=[{left:2.06,width:30.04},{left:33.95,width:30.04},{left:66.26,width:30.04}]; const HERO_ROWS=[{top:3.0,height:30.0},{top:34.75,height:30.0},{top:66.5,height:30.0}];
  let heroMaster=null;
  function coverGeometry(img,w,h){const scale=Math.max(w/img.naturalWidth,h/img.naturalHeight);const bw=img.naturalWidth*scale,bh=img.naturalHeight*scale;return {bw,bh,ox:(bw-w)/2,oy:(bh-h)/2};}
  function syncHeroCrops(){if(!hero.children.length)return;const gw=hero.clientWidth,gh=hero.clientHeight;if(!gw||!gh)return;const cover=heroMaster?coverGeometry(heroMaster,gw,gh):{bw:gw,bh:gh,ox:0,oy:0};[...hero.children].forEach((cell,n)=>{const col=n%3,row=Math.floor(n/3),c=HERO_COLS[col],r=HERO_ROWS[row],x=gw*c.left/100,y=gh*r.top/100;cell.style.left=c.left+'%';cell.style.top=r.top+'%';cell.style.width=c.width+'%';cell.style.height=r.height+'%';cell.style.backgroundSize=cover.bw+'px '+cover.bh+'px';cell.style.backgroundPosition=(-cover.ox-x)+'px '+(-cover.oy-y)+'px';});}
  function renderHero(im){hero.classList.remove('completed');hero.innerHTML='';hero.style.backgroundImage='';heroMaster=null;if(!im)return;for(let n=1;n<=9;n++){const collected=pieceCollected(collectionId,im.imageId,n);const cell=document.createElement('div');cell.className='hero-piece '+(collected?'is-collected':'is-missing');hero.appendChild(cell);}loadMaster(im.masterFile).then(img=>{if(!img)return;heroMaster=img;const bg='url("' + img.src + '")';[...hero.children].forEach(cell=>cell.style.backgroundImage=bg);syncHeroCrops();if(imageComplete(collectionId,im)){hero.innerHTML='';hero.classList.add('completed');const cover=coverGeometry(img,hero.clientWidth,hero.clientHeight);hero.style.backgroundImage=bg;hero.style.backgroundSize=cover.bw+'px '+cover.bh+'px';hero.style.backgroundPosition=(-cover.ox)+'px '+(-cover.oy)+'px';}});requestAnimationFrame(syncHeroCrops);}
  

  // Exact Figma frame 10:130 thumbnail bounds, normalized to 989×1591.
  const positions=[
    [3.842,76.304,16.582,8.485],[22.245,76.304,16.582,8.485],[40.546,76.304,16.582,8.485],[58.544,76.304,16.582,8.485],[76.946,76.304,16.582,8.485],
    [3.842,85.984,16.582,8.485],[22.245,85.984,16.582,8.485],[40.546,85.984,16.582,8.485],[58.544,85.984,16.582,8.485],[76.946,85.984,16.582,8.485]
  ];

  async function buildThumbs(cfg){
    thumbs.innerHTML='';
    for(const [idx,im] of (cfg.images||[]).entries()){
      const b=document.createElement('button');b.type='button';b.className='collection-thumb';b.dataset.num=String(idx+1);
      const p=positions[idx];b.style.cssText='left:'+p[0]+'%;top:'+p[1]+'%;width:'+p[2]+'%;height:'+p[3]+'%';
      const grid=document.createElement('div');grid.className='thumb-grid';
      for(let n=1;n<=9;n++){
        const cell=document.createElement('span');cell.className='thumb-piece';
        cell.classList.toggle('is-missing',!pieceCollected(collectionId,im.imageId,n));cell.classList.toggle('is-collected',pieceCollected(collectionId,im.imageId,n));
        grid.appendChild(cell);
      }
      b.appendChild(grid);thumbs.appendChild(b);
      b.onclick=()=>{BR.play('tap');BR.haptic('tap');renderImage(im.imageId)};
      const thumb=thumbUrl(im.masterFile); [...grid.children].forEach(cell=>cell.style.backgroundImage='url("'+thumb+'")'); loadMaster(im.masterFile).then(source=>syncThumbCrops(grid,source));
    }
  }

  async function loadCollection(cid){
    if(configs.has(cid))return configs.get(cid);
    const cfg=await BR.fetchCollection(cid);
    if(!Array.isArray(cfg.images)||cfg.images.length!==10)throw Error('COLLECTION_MUST_HAVE_10_IMAGES');
    for(const im of cfg.images)if(!Array.isArray(im.pieces)||im.pieces.length!==9)throw Error('COLLECTION_PIECES_INVALID');
    configs.set(cid,cfg);return cfg;
  }

  async function renderImage(iid){
    activeImageId=String(iid||requestedImage);
    const im=(activeCfg?.images||[]).find(x=>x.imageId===iid)||activeCfg?.images?.[0];
    if(!im)return;
    renderHero(im);
    BR.track('collection_view',{collection_id:collectionId,image_id:im.imageId});
  }

  async function applyCollection(cid,iid){
    collectionId=cid;
    activeCfg=await loadCollection(cid);
    nameEl.textContent=String(activeCfg.displayName||cid).toUpperCase();
    select.innerHTML='';
    for(const item of index){
      const option=document.createElement('option');option.value=item.id;option.textContent=item.displayName;select.appendChild(option);
    }
    select.value=collectionId;
    await renderImage(iid||activeCfg.images[0].imageId);
    await buildThumbs(activeCfg);
  }

  select.onchange=async()=>{
    const cid=select.value;
    BR.play('tap');BR.haptic('tap');
    try{await applyCollection(cid,null)}catch(e){nameEl.textContent='COLLECTION UNAVAILABLE';console.error(e)}
  };

  const rewardWord=points=>Number(points)>=60000?'JACKPOT':Number(points)>=40000?'SPECTACULAR':Number(points)>=20000?'AMAZING':'SUPER';
  const rewardAssets={SUPER:'./assets/rewards/reward-super.webp',AMAZING:'./assets/rewards/reward-amazing.webp',SPECTACULAR:'./assets/rewards/reward-spectacular.webp',JACKPOT:'./assets/rewards/reward-jackpot.webp'};
  const rewardAudioFiles={SUPER:'./assets/rewards/reward-super.mp3',AMAZING:'./assets/rewards/reward-amazing.mp3',SPECTACULAR:'./assets/rewards/reward-spectacular.mp3',JACKPOT:'./assets/rewards/reward-jackpot.mp3'};
  const rewardDisplayMs={SUPER:3718,AMAZING:3979,SPECTACULAR:4371,JACKPOT:7531};
  const rewardAudio={};
  let rewardAudioUnlocked=false;
  Object.entries(rewardAudioFiles).forEach(([word,src])=>{const audio=new Audio();audio.preload='auto';audio.src=src;audio.load();rewardAudio[word]=audio;});
  // Unlock every reward clip during the first real user gesture; mobile browsers may block
  // playback when the reward appears later after asynchronous animations.
  function unlockRewardAudio(){
    if(rewardAudioUnlocked)return;
    rewardAudioUnlocked=true;
    Object.values(rewardAudio).forEach(audio=>{
      const wasMuted=audio.muted;audio.muted=true;
      const p=audio.play();
      if(p&&typeof p.then==='function')p.then(()=>{audio.pause();try{audio.currentTime=0;}catch(e){}audio.muted=wasMuted;}).catch(()=>{audio.muted=wasMuted;rewardAudioUnlocked=false;});
      else{audio.pause();try{audio.currentTime=0;}catch(e){}audio.muted=wasMuted;}
    });
  }
  ['pointerdown','touchstart','keydown'].forEach(type=>document.addEventListener(type,unlockRewardAudio,{capture:true,passive:true}));

  function playRewardAudio(audio){
    if(!audio)return;
    try{audio.pause();audio.currentTime=0;}catch(e){}
    const p=audio.play();
    if(p&&typeof p.catch==='function')p.catch(err=>{console.warn('Reward audio playback was blocked or failed:',err);});
  }

  function showReward(points){
    const n=Number(points)||0;if(!n)return;
    const word=rewardWord(n),src=rewardAssets[word],audio=rewardAudio[word];
    rewardFlashImage.src=src;rewardFlashImage.alt=word;
    rewardFlash.style.setProperty('--flash-art','url("' + src + '")');
    rewardFlash.classList.remove('on');void rewardFlash.offsetWidth;rewardFlash.classList.add('on');
    window.clearTimeout(showReward.timer);
    if(showReward.audio&&showReward.audio!==audio){showReward.audio.pause();try{showReward.audio.currentTime=0;}catch(e){}}
    if(audio){showReward.audio=audio;playRewardAudio(audio);}
    showReward.timer=window.setTimeout(()=>rewardFlash.classList.remove('on'),rewardDisplayMs[word]||4000);
  }

  async function reveal(points,rarity){
    const n=Number(points)||0;if(!n)return;
    pointsNumber.textContent='';
    pointsBadge.className='points-badge '+String(rarity||'COMMON').toLowerCase()+' revealing';
    const spec=BR.rewardSpec(rarity,n),start=performance.now(),duration=Math.max(700,Math.min(1800,Number(spec.duration)||1200));
    BR.playPointsCountUp(n,rarity);
    await new Promise(resolve=>{
      const step=t=>{
        const p=Math.min(1,(t-start)/duration),ease=1-Math.pow(1-p,3);
        pointsNumber.textContent=Math.round(n*ease).toLocaleString();
        if(p<1)requestAnimationFrame(step);else{pointsNumber.textContent=n.toLocaleString();resolve();}
      };requestAnimationFrame(step);
    });
    pointsBadge.classList.remove('revealing');
    await new Promise(resolve=>setTimeout(resolve,90));
    showReward(n);
    if(['EPIC','LEGENDARY','MYTHIC'].includes(String(rarity||'').toUpperCase()))BR.playJackpot(rarity,.02);
  }

  try{index=await BR.listCollections()}catch(e){index=[{id:'collection01',displayName:'ALEXANDRIA'}]}
  try{await applyCollection(collectionId,requestedImage)}catch(e){collectionId='collection01';try{await applyCollection(collectionId,'image01')}catch{nameEl.textContent='COLLECTION UNAVAILABLE';console.error(e)}}

  if(handoff){
    const pts=Number(handoff.points||handoff.points_awarded||0);
    if(pts&&!handoff.duplicate)reveal(pts,handoff.rarity);
    BR.safeSession.remove('barameelLastScan');
  }

  document.getElementById('back').onclick=()=>{BR.safeSession.remove('barameelCollectionParent');BR.safeSession.set('barameelActivePath','world');BR.goAfter('screen04.html','back',180)};
  document.getElementById('myRewards').onclick=()=>{
    BR.safeSession.set('barameelRewardsParent','screen06.html');
    BR.safeSession.set('barameelCollectionId',collectionId);
    BR.safeSession.set('barameelActivePath','collection');
    BR.goAfter('marks-wallet.html','confirm',180);
  };
  document.getElementById('scanMore').onclick=()=>{
    BR.safeSession.set('barameelActivePath','collection');
    BR.safeSession.set('barameelCollectionId',collectionId);
    BR.safeSession.set('barameelCollectionParent','screen06.html');
    BR.goAfter('screen05.html','scan',220);
  };
  window.addEventListener('resize',()=>{
    if(!hero.classList.contains('completed'))syncHeroCrops();
    thumbs.querySelectorAll('.thumb-grid').forEach(grid=>{const b=grid.closest('.collection-thumb'),im=activeCfg?.images?.[Number(b?.dataset.num)-1];if(im)loadMaster(im.masterFile).then(source=>syncThumbCrops(grid,source));});
  },{passive:true});
  BR.track('collection_hunt_view',{collection_id:collectionId});
})();
</script>
</body>
</html>
