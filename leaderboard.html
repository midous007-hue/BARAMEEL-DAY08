<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><link rel="stylesheet" href="./barameel-flow.css?v=20261003-1"><script src="./config.js?v=20261003-1"></script></head><body><main class="flow-stage"><img class="flow-art" src="./assets/run/leaderboard.webp" alt="BARAMEEL RUN" fetchpriority="high"><div class="arcade-shine"></div><div id="rows" style="position:absolute;left:19%;top:34%;width:75%;height:50%;z-index:22;display:grid;grid-template-rows:repeat(20,1fr);font-family:'Roboto Condensed',Arial,sans-serif;font-weight:900;color:#111;pointer-events:none"></div><div id="rank" class="flow-data flow-number" style="left:68%;top:91%;width:25%;text-align:center">—</div><button id="back" class="flow-hit" style="left:3%;top:1%;width:19%;height:6%" aria-label="Back"></button><button id="continue" class="flow-hit" style="left:9%;top:91%;width:50%;height:6%" aria-label="Continue"></button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js?v=20261003-1"></script><script src="./barameel-flow.js?v=20261003-1"></script><script>const s=BR.state||{};document.getElementById('rank').textContent=s.rank?('#'+s.rank):'—';(async()=>{try{const r=await BR.api('/leaderboard',{},'POST'),rows=document.getElementById('rows');(r?.players||[]).forEach(p=>{const d=document.createElement('div');d.style.cssText='display:grid;grid-template-columns:13% 57% 30%;align-items:center;font-size:clamp(9px,2.6vw,22px);line-height:1';d.innerHTML='<span style="text-align:center">'+p.rank+'</span><span style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis">'+String(p.nickname).replace(/[<>]/g,'')+'</span><span style="text-align:right;padding-right:5%">'+Number(p.points||0).toLocaleString()+'</span>';rows.appendChild(d)})}catch{} })();document.getElementById('back').onclick=()=>BARAMEEL_FLOW.go('run-complete.html','back');document.getElementById('continue').onclick=()=>BARAMEEL_FLOW.go('marks-wallet.html','tap');</script></body></html>
