<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><link rel="stylesheet" href="./barameel-flow.css?v=20261004-23.1"><script src="./config.js?v=20261004-23.1"></script></head><body><main class="flow-stage art-948x1660"><img class="flow-art" src="./assets/leaderboard.webp" alt="BARAMEEL RUN" fetchpriority="high"><div class="arcade-shine"></div><div id="rows" style="position:absolute;left:19%;top:34.5%;width:75%;height:43%;z-index:22;display:grid;grid-template-rows:repeat(20,1fr);font-family:'Roboto Condensed',Arial,sans-serif;font-weight:900;color:#111;pointer-events:none"></div><div id="rank" class="flow-data flow-number" style="left:28%;top:81.3%;width:15%;text-align:center">—</div><div id="yourPoints" class="flow-data flow-number" style="left:46%;top:81.3%;width:16%;text-align:center">0</div><div id="toNext" class="flow-data flow-number" style="left:67%;top:81.3%;width:19%;text-align:center">—</div><button id="back" class="flow-hit" style="left:3%;top:1%;width:19%;height:6%" aria-label="Back"></button><button id="continue" class="flow-hit" style="left:8.4%;top:88.9%;width:83.4%;height:8.4%" aria-label="Continue"></button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js?v=20261004-23.1"></script><script src="./barameel-flow.js?v=20261004-23.1"></script><script>const s=BR.state||{};document.getElementById('rank').textContent=s.rank?('#'+s.rank):'—';if(Number.isFinite(Number(s.points)))document.getElementById('yourPoints').textContent=Number(s.points).toLocaleString();(async()=>{try{const r=await BR.api('/leaderboard',{},'POST'),rows=document.getElementById('rows');(r?.players||[]).forEach(p=>{const d=document.createElement('div');d.style.cssText='display:grid;grid-template-columns:13% 57% 30%;align-items:center;font-size:clamp(9px,2.6vw,22px);line-height:1';const rankEl=document.createElement('span');rankEl.style.textAlign='center';rankEl.textContent=String(p.rank??'—');const nameEl=document.createElement('span');nameEl.style.cssText='overflow:hidden;white-space:nowrap;text-overflow:ellipsis';nameEl.textContent=String(p.nickname??'PLAYER');const ptsEl=document.createElement('span');ptsEl.style.cssText='text-align:right;padding-right:5%';ptsEl.textContent=Number(p.points||0).toLocaleString();d.append(rankEl,nameEl,ptsEl);rows.appendChild(d)});const list=r?.players||[];const meRank=Number(s.rank||0);const meIndex=list.findIndex(p=>Number(p.rank)===meRank);const next=meIndex>0?list[meIndex-1]:null;document.getElementById('toNext').textContent=next?Math.max(0,Number(next.points||0)-Number(s.points||0)).toLocaleString():'—';}catch{} })();document.getElementById('back').onclick=()=>BARAMEEL_FLOW.go('run-complete.html','back');document.getElementById('continue').onclick=()=>BARAMEEL_FLOW.go('marks-wallet.html','tap');</script></body></html>
