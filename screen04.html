<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e2a3d">
<title>BARAMEEL RUN — MODE SELECT</title>
<link rel="stylesheet" href="./styles.css?v=20261011-mode-select-1">
<script src="./config.js?v=20261011-mode-select-1"></script>
<style>
.my-run-stage{position:relative;width:min(100vw,calc(100dvh*928/1612));height:min(100dvh,calc(100vw*1612/928));aspect-ratio:928/1612;margin:auto;overflow:hidden;background:#061f27}
.my-run-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.my-run-hit{position:absolute;z-index:40;border:0;background:transparent;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overflow:visible}.my-run-collection::before,.my-run-checkpoint::before{content:"";position:absolute;inset:-.35%;border:3px solid rgba(246,231,206,0);border-radius:5.5%;box-shadow:0 0 0 1px rgba(7,26,32,0),0 0 18px rgba(244,197,47,0);opacity:0;pointer-events:none}.my-run-hit.is-active::before{opacity:1;border-color:#f4c52f;box-shadow:0 0 0 2px rgba(7,26,32,.78),0 0 18px rgba(244,197,47,.58);animation:runCardFrame .46s cubic-bezier(.16,.86,.2,1) both}@keyframes runCardFrame{0%{transform:scale(.975);opacity:0}30%{transform:scale(1.018);opacity:1}100%{transform:scale(1);opacity:1}}
.my-run-collection{left:2.4%;top:39.2%;width:47.1%;height:43.6%;border-radius:5%}
.my-run-checkpoint{left:50.3%;top:39.2%;width:47.2%;height:43.6%;border-radius:5%}
.my-run-back{left:2.5%;top:1.0%;width:12%;height:7%;z-index:50}
.my-run-player-name{display:none}.my-run-value{position:absolute;z-index:35;display:flex;align-items:center;justify-content:center;color:#f6e7ce;font-family:'Bebas Neue','Roboto Condensed','Arial Narrow',Arial,sans-serif;font-size:clamp(14px,3.75vw,29px);font-weight:900;line-height:1;white-space:nowrap;letter-spacing:.035em;text-shadow:0 2px 0 #071a20,0 0 6px rgba(244,197,47,.22);pointer-events:none}
.my-run-points{left:7.0%;top:93.0%;width:24.0%;height:3.5%}
.my-run-rank{left:38.0%;top:93.0%;width:24.0%;height:3.5%}
.my-run-marks{left:69.5%;top:93.0%;width:23.0%;height:3.5%}
.my-run-rewards{left:3.0%;top:83.8%;width:94%;height:15.0%;z-index:45}
.my-run-hit:active{transform:scale(.988);filter:brightness(1.08)}
</style>
</head>
<body>
<main class="my-run-stage">
<img class="my-run-art" src="./assets/barameel-run-mode-select.webp?v=20261011-mode-select-1" alt="BARAMEEL RUN — choose Collection Hunt or Checkpoint Run">
<button id="back" class="my-run-hit my-run-back" aria-label="Back"></button>
<button id="collection" class="my-run-hit my-run-collection" aria-label="Collection Hunt"></button>
<button id="checkpoint" class="my-run-hit my-run-checkpoint" aria-label="Checkpoint Run"></button>
<button id="rewards" class="my-run-hit my-run-rewards" aria-label="Open your Marks wallet and progress"></button>
<div id="playerName" class="my-run-player-name"></div><div id="points" class="my-run-value my-run-points">0</div>
<div id="rank" class="my-run-value my-run-rank">—</div>
<div id="marks" class="my-run-value my-run-marks">0</div>
</main>
<script src="./app.js?v=20261011-mode-select-1"></script>
<script>
(async () => {
  await BR.syncPlayer();

  const state = BR.state || {}; const playerName = String(state.nickname || '').trim().toUpperCase();
  document.getElementById('points').textContent = Number(state.points || 0).toLocaleString();
  document.getElementById('rank').textContent = state.rank ? '#' + state.rank : '—';
  try {
    const wallet = await BR.api('/wallet', {});
    if (wallet?.ok) document.getElementById('marks').textContent = Number(wallet.marks ?? wallet.marks_total ?? 0).toLocaleString();
  } catch {}
  document.getElementById('back').onclick = () => BR.goAfter('screen02.html', 'back', 180);
  document.getElementById('collection').onclick = () => {
    document.getElementById('collection').classList.add('is-active');
    BR.safeSession.set('barameelActivePath', 'collection');
    BR.goAfter('screen05.html', 'confirm', 240);
  };
  document.getElementById('checkpoint').onclick = async () => {
    document.getElementById('checkpoint').classList.add('is-active');
    BR.safeSession.set('checkpointRunStartPoints', String(BR.state?.points || 0));
    BR.safeSession.set('barameelActivePath', 'checkpoint');
    // Unlock audio from this real user gesture, then request iOS motion access before briefing opens.
    BR.play('confirm');
    const Orientation = window.DeviceOrientationEvent;
    if (typeof Orientation?.requestPermission === 'function') {
      try {
        const permission = await Orientation.requestPermission();
        BR.safeSession.set('barameelOrientationPermission', permission === 'granted' ? 'granted' : 'denied');
      } catch {
        BR.safeSession.set('barameelOrientationPermission', 'denied');
      }
    }
    BR.goAfter('run-briefing.html?v=20261010-compass-artwork-2', 'tap', 240);
  };
  document.getElementById('rewards').onclick = () => {
    BR.safeSession.set('barameelRewardsParent', 'screen04.html');
    BR.safeSession.set('barameelActivePath', 'rewards');
    BR.goAfter('marks-wallet.html', 'confirm', 180);
  };
  BR.track('my_run_view');
})();
</script>
</body>
</html>
