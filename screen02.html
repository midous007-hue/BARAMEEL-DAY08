<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071b2b">
<title>BARAMEEL RUN — CHOOSE YOUR AVATAR</title>
<link rel="stylesheet" href="./styles.css?v=20261011-avatar-art-9">
<script src="./config.js?v=20261011-avatar-art-9"></script>
<style>
.avatar-stage{position:relative;width:min(100vw,calc(100dvh*942/1670));height:min(100dvh,calc(100vw*1670/942));aspect-ratio:942/1670;margin:auto;overflow:hidden;background:#071b2b}
.avatar-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.avatar-logo-wrap{position:absolute;z-index:30;left:1%;top:0;width:98%;height:43%;pointer-events:none;overflow:visible}
.avatar-logo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center top;filter:drop-shadow(0 3px 0 rgba(0,0,0,.7))}
.avatar-logo-sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(112deg,transparent 0%,transparent 36%,rgba(255,255,255,.06) 42%,rgba(255,244,188,.86) 48%,rgba(255,255,255,.12) 53%,transparent 60%,transparent 100%);background-size:240% 100%;background-position:150% 0;-webkit-mask-image:url('./assets/barameel-run-avatar-logo.web.webp?v=20261011-avatar-art-9');mask-image:url('./assets/barameel-run-avatar-logo.web.webp?v=20261011-avatar-art-9');-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center top;mask-position:center top;-webkit-mask-size:contain;mask-size:contain;animation:logoMetalSweep 7.2s ease-in-out infinite}
@keyframes logoMetalSweep{0%,20%{background-position:150% 0;opacity:0}30%{opacity:.92}55%{background-position:-70% 0;opacity:.86}68%,100%{background-position:-70% 0;opacity:0}}
@media(prefers-reduced-motion:reduce){.avatar-logo-sheen{animation:none;opacity:0}}
.avatar-hit{position:absolute;z-index:45;width:30.6%;height:auto;aspect-ratio:1/1;border:0;background:transparent;border-radius:50%;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.avatar-01{left:2.7%;top:49.6%;width:31.0%;height:auto;aspect-ratio:1/1}
.avatar-02{left:34.0%;top:49.7%;width:30.6%;height:auto;aspect-ratio:1/1}
.avatar-03{left:65.3%;top:49.8%;width:31.0%;height:auto;aspect-ratio:1/1}
.avatar-04{left:2.7%;top:66.7%;width:31.0%;height:auto;aspect-ratio:1/1}
.avatar-05{left:34.0%;top:66.6%;width:30.6%;height:auto;aspect-ratio:1/1}
.avatar-06{left:65.3%;top:66.7%;width:31.0%;height:auto;aspect-ratio:1/1}
.avatar-hit.is-selected{z-index:55}
.avatar-hit.is-selected::after{content:"";position:absolute;inset:0%;border-radius:50%;background:repeating-conic-gradient(from 0deg,#fff4b0 0deg 5deg,transparent 5deg 12deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 4px));animation:avatarDash 1.45s linear infinite;pointer-events:none;filter:drop-shadow(0 0 1.5px rgba(255,190,0,.95))}
.avatar-hit.is-selected::before{content:"";position:absolute;inset:-.15%;border-radius:50%;border:4px solid #ffbd00;box-shadow:inset 0 0 0 1.5px #fff2a0,0 0 0 1px #7c4d00,0 0 6px rgba(255,190,0,.95);pointer-events:none}
@keyframes avatarDash{to{transform:rotate(360deg)}}
@keyframes avatarLock{0%{transform:scale(.94);opacity:.4}100%{transform:scale(1);opacity:1}}
@keyframes avatarInnerDash{to{transform:rotate(-360deg)}}
@keyframes avatarShine{0%,100%{opacity:0}}
.player-name{position:absolute;left:37.8%;top:44.3%;width:44.1%;height:3.8%;z-index:40;display:flex;align-items:center;justify-content:center;color:#f6e7ce;font:900 clamp(15px,4.1vw,29px)/1 'Roboto Condensed',Arial,sans-serif;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;text-align:center}
.avatar-error{position:absolute;left:18%;right:18%;top:80.2%;min-height:3.8%;z-index:70;display:flex;align-items:center;justify-content:center;padding:1.2% 3%;border:2px solid #f0c830;border-radius:999px;background:rgba(7,26,32,.94);color:#f6e7ce;font:900 clamp(10px,2.4vw,18px)/1 'Roboto Condensed',Arial,sans-serif;text-transform:uppercase;text-align:center;opacity:0;pointer-events:none;transition:.18s ease}
.avatar-error.show{opacity:1}
</style>
</head>
<body>
<main class="avatar-stage" id="avatarStage">
<img class="avatar-art" src="./assets/avatar-selection-twilight.webp?v=20261011-avatar-art-9" alt="CHOOSE YOUR AVATAR" fetchpriority="high">
<div class="avatar-logo-wrap" aria-hidden="true">
<img class="avatar-logo" src="./assets/barameel-run-avatar-logo.web.webp?v=20261011-avatar-art-9" alt="">
<span class="avatar-logo-sheen"></span>
</div>
<div id="playerName" class="player-name" aria-live="polite"></div>
<button class="avatar-hit avatar-01" data-avatar="avatar01" aria-label="Avatar 1"></button>
<button class="avatar-hit avatar-02" data-avatar="avatar02" aria-label="Avatar 2"></button>
<button class="avatar-hit avatar-03" data-avatar="avatar03" aria-label="Avatar 3"></button>
<button class="avatar-hit avatar-04" data-avatar="avatar04" aria-label="Avatar 4"></button>
<button class="avatar-hit avatar-05" data-avatar="avatar05" aria-label="Avatar 5"></button>
<button class="avatar-hit avatar-06" data-avatar="avatar06" aria-label="Avatar 6"></button>
<button id="back" class="avatar-hit" style="left:3.6%;top:1.2%;width:17%;height:6.8%;border-radius:24%" aria-label="Back"></button>
<button id="confirm" class="avatar-hit" style="left:7.4%;top:84.0%;width:85.2%;height:8.8%;border-radius:8%" aria-label="Confirm Avatar"></button>
<div id="error" class="avatar-error" aria-live="polite"></div>
</main>
<script src="./app.js?v=20261011-avatar-art-9"></script>
<script>
(() => {
  const playerName=document.getElementById('playerName');
  const error=document.getElementById('error');
  const buttons=[...document.querySelectorAll('.avatar-hit[data-avatar]')];
  const entered=String(BR.state?.nickname||'').trim();
  let selected=BR.selectedAvatar();

  playerName.textContent=entered.toUpperCase()||'PLAYER';

  function selectAvatar(id,play=true){
    if(!BR.AVATARS.includes(id))return;
    selected=id;
    BR.setAvatar(id);
    buttons.forEach(b=>b.classList.toggle('is-selected',b.dataset.avatar===id));
    if(play){
      BR.playAvatarSelect(id);
      BR.haptic('confirm');
      try{ if(navigator.vibrate) navigator.vibrate([28,18,42]); }catch{}
    }
  }

  selectAvatar(selected,false);

  buttons.forEach(b=>b.addEventListener('click',e=>{
    e.preventDefault();
    selectAvatar(b.dataset.avatar,true);
  }));

  document.getElementById('back').onclick=()=>BR.goAfter('run.html','back',180);

  document.getElementById('confirm').onclick=async()=>{
    if(!entered){
      error.textContent='ENTER YOUR PLAYER NAME FIRST';
      error.classList.add('show');
      BR.play('error');BR.haptic('error');
      return;
    }
    const button=document.getElementById('confirm');
    button.disabled=true;
    BR.safeSession.set('barameelAvatar',selected);
    BR.safeSession.remove('barameelActivePath');
    await BR.syncPlayer().catch(()=>null);
    BR.goAfter('screen04.html','confirm',240);
  };
})();
</script>
</body>
</html>
