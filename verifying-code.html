<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BARAMEEL RUN — VERIFY RECEIPT</title>
<link rel="stylesheet" href="./barameel-flow.css?v=20261005-23.2">
<script src="./config.js?v=20261005-23.2"></script>
<style>
#verifyStatus{position:absolute;left:24%;top:55.2%;width:56%;height:11.5%;z-index:25;display:flex;align-items:center;justify-content:center;color:#f6e7ce;font:900 clamp(16px,4vw,31px)/1 'Bebas Neue',Impact,sans-serif;text-align:center;text-transform:uppercase;text-shadow:2px 2px 0 #071b2b;pointer-events:none}
#verifyStatus.small{font-size:clamp(13px,3.0vw,23px)}
</style>
</head>
<body>
<main class="flow-stage art-955">
<img class="flow-art" src="./assets/verifying-code.webp?v=20261005-23.2" alt="VERIFYING RECEIPT" fetchpriority="high">
<div id="verifyStatus" aria-live="polite">VERIFYING RECEIPT…</div>
<button id="back" class="flow-hit" style="left:3%;top:1%;width:19%;height:6%" aria-label="Back to Receipt"></button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js?v=20261005-23.2"></script>
<script>
(() => {
  const status=document.getElementById('verifyStatus');
  const hasReward=!!BR.safeSession.get('barameelReceiptReward');
  document.getElementById('back').onclick=()=>BR.goAfter('receipt-code.html','back',180);
  if(!hasReward){status.textContent='VERIFICATION UNAVAILABLE';status.classList.add('small');return}
  BR.play('receipt');BR.haptic('scan');BR.track('receipt_verification_view');
  window.setTimeout(()=>{
    status.textContent='CODE VERIFIED';
    BR.haptic('confirm');BR.play('confirm');
    window.setTimeout(()=>BR.goAfter('reveal-barameel-box.html','reward',220),620);
  },1350);
})();
</script>
</body>
</html>
