<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><link rel="stylesheet" href="./barameel-flow.css?v=20261004-23.1"><script src="./config.js?v=20261004-23.1"></script><style>#camera{position:absolute;left:57%;top:43%;width:37%;height:24%;z-index:18;overflow:hidden;border-radius:16px;background:#071b2b}#camera video{width:100%;height:100%;object-fit:cover}#scanStatus{position:absolute;left:54%;top:68%;width:41%;z-index:25;color:#f6e7ce;text-align:center;font:900 clamp(10px,2.5vw,21px)/1.1 'Roboto Condensed',Arial,sans-serif;text-transform:uppercase;text-shadow:0 2px 0 #071b2b;pointer-events:none}.scan-line{position:absolute;left:8%;right:8%;top:15%;height:3px;background:#ef2d24;box-shadow:0 0 12px #ef2d24;animation:scanline 1.4s linear infinite}@keyframes scanline{from{transform:translateY(0)}to{transform:translateY(420%)}}@media(prefers-reduced-motion:reduce){.scan-line{animation:none}}</style></head><body><main class="flow-stage art-948x1660"><img class="flow-art" src="./assets/checkpoint-scanner.webp?v=20261004-23.1" alt="BARAMEEL RUN CHECKPOINT SCANNER" fetchpriority="high"><div class="arcade-shine"></div><div id="camera"><video id="video" playsinline webkit-playsinline muted autoplay></video><div class="scan-line" aria-hidden="true"></div></div><div id="scanStatus" aria-live="polite">READY TO SCAN</div><button id="back" class="flow-hit" style="left:3%;top:1%;width:19%;height:6%" aria-label="Back"></button><button id="open" class="flow-hit" style="left:7.4%;top:82.7%;width:85.2%;height:10%" aria-label="Open camera and scan"></button><button id="gallery" class="flow-hit" style="left:17%;top:84%;width:23%;height:8%" aria-label="Gallery"></button><button id="flash" class="flow-hit" style="left:73%;top:84%;width:20%;height:8%" aria-label="Flash"></button><canvas id="canvas" hidden></canvas></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js?v=20261004-23.1"></script><script src="./barameel-flow.js?v=20261004-23.1"></script><script>(()=>{const v=document.getElementById('video'),status=document.getElementById('scanStatus'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),open=document.getElementById('open'),back=document.getElementById('back');let stream=null,detector=null,raf=0,locked=false,starting=false;const set=(t,e=false)=>{status.textContent=t;status.style.color=e?'#ff8b84':'#f6e7ce'};const stop=()=>{cancelAnimationFrame(raf);raf=0;stream?.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;starting=false};const native=async()=>{if(!('BarcodeDetector'in window))return false;try{const fs=await BarcodeDetector.getSupportedFormats();if(fs.includes('qr_code')){detector=new BarcodeDetector({formats:['qr_code']});return true}}catch{}return false};const parse=raw=>{const s=decodeURIComponent(String(raw||'').trim());const m=s.match(/^BARAMEEL[-_:]?CHECKPOINT[-_:]?([A-Z0-9_-]+)$/i);return m?m[1]:null};async function handle(raw){if(locked)return;const id=parse(raw);if(!id){set('WRONG QR — FIND A CHECKPOINT QR',true);BR.play('error');return}locked=true;stop();try{BR.safeSession.set('barameelCheckpointScan',JSON.stringify({id,ts:Date.now()}))}catch{}set('CHECKPOINT FOUND');BARAMEEL_FLOW.fx('reward');setTimeout(()=>BARAMEEL_FLOW.go('checkpoint-found.html','reward',260),420)}async function loop(){if(!stream||locked)return;try{if(v.readyState>=2){if(detector){const x=await detector.detect(v);if(x?.length)return handle(x[0].rawValue||'')}else if(window.jsQR){const w=640,h=Math.round(640*(v.videoHeight||480)/(v.videoWidth||640));canvas.width=w;canvas.height=h;ctx.drawImage(v,0,0,w,h);const x=window.jsQR(ctx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'attemptBoth'});if(x?.data)return handle(x.data)}}}catch{}raf=requestAnimationFrame(loop)}async function start(){if(starting||stream)return;starting=true;set('OPENING CAMERA');if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){set('CAMERA NEEDS HTTPS',true);starting=false;return}try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});v.srcObject=stream;await v.play();await native();starting=false;if(!detector&&typeof window.jsQR!=='function'){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';s.onload=()=>{set('SCAN CHECKPOINT QR');loop()};s.onerror=()=>{set('QR READER UNAVAILABLE',true)};document.head.appendChild(s)}else{set('SCAN CHECKPOINT QR');loop()}}catch{starting=false;const ua=navigator.userAgent||'';const inApp=/Instagram|FBAN|FBAV|FB_IAB|musical_ly|BytedanceWebview/i.test(ua);set(inApp?'OPEN IN SAFARI / CHROME TO USE THE CAMERA':'CAMERA ACCESS OFF — ENABLE CAMERA IN BROWSER SETTINGS',true);BR.play('error')}}open.onclick=start;back.onclick=()=>{stop();BARAMEEL_FLOW.go('route-map.html','back')};document.getElementById('gallery').onclick=()=>BARAMEEL_FLOW.fx('tap');document.getElementById('flash').onclick=()=>BARAMEEL_FLOW.fx('tap');window.addEventListener('pagehide',stop)})();</script></body></html>
