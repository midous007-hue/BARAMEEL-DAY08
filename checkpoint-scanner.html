<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><link rel="stylesheet" href="./barameel-flow.css?v=20261003-1"><script src="./config.js?v=20261003-1"></script></head><body><main class="flow-stage"><img class="flow-art" src="./assets/run/checkpoint-scanner.webp" alt="BARAMEEL RUN" fetchpriority="high"><div class="arcade-shine"></div><button id="back" class="flow-hit" style="left:3%;top:1%;width:19%;height:6%" aria-label="Back"></button><div id="camera" style="position:absolute;left:57%;top:43%;width:37%;height:24%;z-index:18;overflow:hidden;border-radius:16px;border:3px solid rgba(244,197,47,.9);background:#071b2b"><video id="video" playsinline muted autoplay style="width:100%;height:100%;object-fit:cover"></video><div style="position:absolute;inset:10%;border:2px solid #f4c52f;border-radius:12px;box-shadow:0 0 20px rgba(244,197,47,.4) inset"></div><div style="position:absolute;left:8%;right:8%;top:15%;height:3px;background:#ef2d24;box-shadow:0 0 12px #ef2d24;animation:scanline 1.4s linear infinite"></div></div><button id="open" class="flow-hit" style="left:54%;top:72%;width:40%;height:7%" aria-label="Open Camera"></button><button id="gallery" class="flow-hit" style="left:17%;top:84%;width:23%;height:8%" aria-label="Gallery"></button><button id="flash" class="flow-hit" style="left:73%;top:84%;width:20%;height:8%" aria-label="Flash"></button><style>@keyframes scanline{from{transform:translateY(0)}to{transform:translateY(420%)}}</style></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js?v=20261003-1"></script><script src="./barameel-flow.js?v=20261003-1"></script><script>const v=document.getElementById('video'),open=document.getElementById('open'),back=document.getElementById('back');let stream=null;async function start(){BARAMEEL_FLOW.fx('scan');if(!navigator.mediaDevices?.getUserMedia){BARAMEEL_FLOW.go('checkpoint-found.html','confirm');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=stream;await v.play();setTimeout(()=>{stop();BARAMEEL_FLOW.go('checkpoint-found.html','reward')},2600)}catch{BARAMEEL_FLOW.go('checkpoint-found.html','reward')}}function stop(){stream?.getTracks().forEach(t=>t.stop());stream=null}open.onclick=start;back.onclick=()=>{stop();BARAMEEL_FLOW.go('route-map.html','back')};document.getElementById('gallery').onclick=()=>BARAMEEL_FLOW.fx('tap');document.getElementById('flash').onclick=()=>BARAMEEL_FLOW.fx('tap');window.addEventListener('pagehide',stop);</script></body></html>
