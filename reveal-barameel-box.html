<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BARAMEEL RUN — REWARD READY</title>
<link rel="stylesheet" href="./barameel-flow.css?v=20261005-23.3">
<script src="./config.js?v=20261005-23.3"></script>
</head>
<body>
<main class="flow-stage art-948x1659">
<img class="flow-art" src="./assets/reveal-barameel-box.webp?v=20261005-23.3" alt="YOUR BARAMEEL REWARD IS READY" fetchpriority="high">
<div class="arcade-shine"></div>
<button id="back" class="flow-hit" style="left:3%;top:1%;width:19%;height:6%" aria-label="Back to Verify Receipt"></button>
<button id="reveal" class="flow-hit" style="left:11%;top:86%;width:78%;height:8%" aria-label="Reveal my reward"></button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js?v=20261005-23.3"></script>
<script>
(() => {
  const stored=BR.safeSession.get('barameelReceiptReward');
  if(!stored) {
    document.getElementById('reveal').disabled=true;
    return;
  }
  document.getElementById('back').onclick=()=>BR.goAfter('verifying-code.html','back',180);
  document.getElementById('reveal').onclick=()=>{
    BR.play('reward');BR.haptic('reward');BR.flash();
    BR.goAfter('your-barameel-drop.html','reward',420);
  };
  BR.track('reward_box_view');
})();
</script>
</body>
</html>
