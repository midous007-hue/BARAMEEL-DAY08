}

<script src="./app.js?v=20261008-1"></script>
<script>
(async()=>{
  const status=document.getElementById('routeStatus'),current=document.getElementById('currentLocation');
  const next=document.getElementById('nextCheckpoint'),distance=document.getElementById('distanceNext');
  const fill=document.getElementById('routeProgressFill'),action=document.getElementById('routeAction');
  const direct=document.getElementById('directBarameel');
  const navOverlay=document.getElementById('navOverlay'),navDirection=document.getElementById('navDirection'),navDistance=document.getElementById('navDistance'),navCompass=document.getElementById('navCompass');
  const livePlayersLayer=document.getElementById('livePlayers');
  const routeBack=document.getElementById('back');
  routeBack.onclick=()=>BR.goAfter('screen04.html','back',180);

  const TEST_PARAMS=new URLSearchParams(location.search);
  const TEST_MODE=TEST_PARAMS.get('test')==='1';
  // Supabase player sync must NEVER block map/GPS startup.
  // It runs in the background while the map and location services initialize.
  if(!TEST_MODE) BR.syncPlayer().catch(()=>null);
  const TEST_CP_ID=String(TEST_PARAMS.get('cp')||'CP01').toUpperCase();
  const TEST_APPROACH=TEST_MODE && TEST_PARAMS.get('approach')==='1';
  const TEST_INSTANT=TEST_MODE && TEST_PARAMS.get('instant')==='1';
  let testApproachTimer=null;
  const CHECKPOINT_HOTSPOT_RADIUS=10;
  const CHECKPOINT_SIGNAL_RADIUS=35;
  const cfg=window.BARAMEEL_ROUTE_CONFIG||{};
  const destination=cfg.destination&&Number.isFinite(Number(cfg.destination.lat))&&Number.isFinite(Number(cfg.destination.lng))
    ? {lat:Number(cfg.destination.lat),lng:Number(cfg.destination.lng),name:String(cfg.destination.name||'BARAMEEL'),radius_meters:Math.max(20,Number(cfg.destination.radius_meters||120))}
    : null;
  const checkpoints=Array.isArray(cfg.checkpoints)
    ? cfg.checkpoints.filter(x=>x&&Number.isFinite(Number(x.lat))&&Number.isFinite(Number(x.lng))).map(x=>({id:String(x.id||''),name:String(x.name||'CHECKPOINT'),lat:Number(x.lat),lng:Number(x.lng),order:Number.isFinite(Number(x.order))?Number(x.order):null,radius_meters:Math.max(5,Number(x.radius_meters||CHECKPOINT_HOTSPOT_RADIUS))}))
    : [];

  // These must exist before initMap() runs. let/const declarations are not
  // initialized before their declaration (TDZ), even though function
  // declarations themselves are hoisted.
  let map=null,watchId=null,playerMarker=null,markers=[],latestPosition=null,routeLine=null;
  let navigationTarget=null,navigationSteps=[],navigationStarted=false,lastRouteAt=0,lastRoutePosition=null;
  let bestGpsAccuracy=Infinity;
  const GPS_GOOD_ACCURACY=35;
  let baseTiles=null,labelTiles=null;
  const liveMarkers=new Map();
  const discovered=new Set((BR.state?.checkpoints||[]).map(String));

  // Render the real map immediately after its configuration exists.
  // GPS and Supabase are intentionally non-blocking.
  initMap(destination||{lat:31.190520,lng:29.920547});
  document.getElementById('mapStatus').textContent='REAL MAP • WAITING FOR GPS';

  function haversine(a,b){
    const R=6371000,rad=Math.PI/180;
    const dLat=(b.lat-a.lat)*rad,dLng=(b.lng-a.lng)*rad;
    const x=Math.sin(dLat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));
  }
  function formatDistance(m){return m<1000?Math.max(1,Math.round(m))+' M':(m/1000).toFixed(m<10000?1:0)+' KM'}
  function setAction(enabled,ariaLabel='Go to Checkpoint'){
    action.disabled=!enabled;
    action.setAttribute('aria-label',ariaLabel);
  }
  function avatarPosition(id){
    const map={avatar01:['0%','24%'],avatar02:['50%','24%'],avatar03:['100%','24%'],avatar04:['0%','78%'],avatar05:['50%','78%'],avatar06:['100%','78%']};
    return map[id]||map.avatar01;
  }
  function playerIcon(){
    const avatar=BR.selectedAvatar(),name=String(BR.state?.nickname||'PLAYER').toUpperCase().replace(/[&<>"]/g,'');
    const pos=avatarPosition(avatar);
    return L.divIcon({className:'',iconSize:[78,70],iconAnchor:[39,35],html:'<div class="player-marker"><div class="player-marker-avatar" style="background-position:'+pos[0]+' '+pos[1]+'"></div><div class="player-marker-name">'+name+'</div></div>'});
  }
  function marker(lat,lng,type,text){
    const fillColor=type==='player'?'#ef2d24':type==='barameel'?'#f4c52f':type==='found'?'#f4c52f':'#071b2b';
    const m=L.circleMarker([lat,lng],{radius:type==='player'?8:7,color:'#f6e7ce',weight:3,fillColor,fillOpacity:1});
    m.addTo(map).bindTooltip(text,{direction:'top',offset:[0,-10]});
    return m;
  }
  function unlockedCheckpoints(){
    const ordered=[...checkpoints].sort((a,b)=>{
      const ao=Number.isFinite(a.order)?a.order:9999,bo=Number.isFinite(b.order)?b.order:9999;
      return ao-bo;
    });
    return ordered.slice(0,Math.min(ordered.length,Math.max(1,discovered.size+1)));
  }

  let mapLibreLayer=null;
  let mapFallbackStarted=false;

  function addRasterFallback(reason=''){
    if(!map || baseTiles)return;
    try{
      baseTiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
        maxZoom:19,
        attribution:'© OpenStreetMap contributors'
      });
      baseTiles.on('load',()=>{
        const el=document.getElementById('mapStatus');
        if(el && !navigationStarted)el.textContent='REAL MAP • GPS READY';
      });
      baseTiles.on('tileerror',(evt)=>{
        console.error('[BARAMEEL OSM TILE ERROR]',evt?.error||evt);
        const el=document.getElementById('mapStatus');
        if(el && !navigationStarted)el.textContent='MAP TILES UNAVAILABLE • RETRY';
      });
      baseTiles.addTo(map);
      mapFallbackStarted=true;
    }catch(err){
      console.error('[BARAMEEL MAP FALLBACK]',err);
    }
  }

  function initMap(center){
    if(map)return;
    const fallbackCenter=center||destination||{lat:31.190520,lng:29.920547};

    // Stable production baseline: Leaflet + official OSM raster tiles.
    // MapLibre is temporarily removed from the runtime path until this
    // navigation baseline is verified independently.
    map=L.map('routeMap',{
      zoomControl:true,
      attributionControl:true,
      scrollWheelZoom:true,
      doubleClickZoom:true,
      touchZoom:true,
      dragging:true,
      preferCanvas:true,
      minZoom:12,
      maxZoom:19
    }).setView([fallbackCenter.lat,fallbackCenter.lng],15);

    addRasterFallback('BASELINE');

    if(destination)marker(destination.lat,destination.lng,'barameel',destination.name);
    const unlocked=unlockedCheckpoints();
    unlocked.forEach(cp=>markers.push({
      cp,marker:marker(cp.lat,cp.lng,discovered.has(cp.id)?'found':'checkpoint',discovered.has(cp.id)?'CLEARED':'AVAILABLE')
    }));
  }
  function renderMap(pos){
    latestPosition=pos;
    initMap(pos);
    if(!playerMarker){
      playerMarker=L.marker([pos.lat,pos.lng],{icon:playerIcon(),keyboard:false,interactive:false}).addTo(map);
    }else{
      playerMarker.setLatLng([pos.lat,pos.lng]);
      playerMarker.setIcon(playerIcon());
    }
  }

  function projectLivePlayer(lat,lng,name,avatar){
    if(!map)return;
    const point=map.latLngToContainerPoint([lat,lng]);
    const el=document.createElement('div');
    el.className='live-player-marker';
    el.textContent=(String(name||'P').trim()[0]||'P').toUpperCase();
    const label=document.createElement('span');label.textContent=String(name||'PLAYER').toUpperCase();el.appendChild(label);
    el.style.left=point.x+'px';el.style.top=point.y+'px';
    livePlayersLayer.appendChild(el);
  }
  async function loadLivePlayers(pos=latestPosition){
    // Live player sharing is non-blocking. Navigation continues even if the
    // live-player service is temporarily unavailable.
    try{
      const payload=pos?{lat:Number(pos.lat),lng:Number(pos.lng),accuracy_meters:Number(pos.accuracy||0)}:{};
      const r=await BR.api('/live-players',payload);
      const list=Array.isArray(r?.players)?r.players:[];
      livePlayersLayer.innerHTML='';
      for(const p of list){
        if(!Number.isFinite(Number(p.lat))||!Number.isFinite(Number(p.lng)))continue;
        if(String(p.id||'')===String(BR.state?.playerId||''))continue;
        projectLivePlayer(Number(p.lat),Number(p.lng),p.nickname||p.name,p.avatar);
      }
    }catch{
      livePlayersLayer.innerHTML='';
    }
  }

  function routeInstruction(step){
    const m=step?.maneuver||{};
    const modifier=String(m.modifier||'').replace(/_/g,' ').toUpperCase();
    const type=String(m.type||'').toLowerCase();
    if(type==='arrive')return 'ARRIVE';
    if(type==='depart')return modifier?('GO '+modifier):'START WALKING';
    if(type==='roundabout' || type==='rotary')return modifier?('ROUNDABOUT • '+modifier):'ROUNDABOUT';
    if(modifier.includes('UTURN'))return 'U-TURN';
    if(modifier.includes('SLIGHT RIGHT'))return 'SLIGHT RIGHT';
    if(modifier.includes('SLIGHT LEFT'))return 'SLIGHT LEFT';
    if(modifier.includes('SHARP RIGHT'))return 'SHARP RIGHT';
    if(modifier.includes('SHARP LEFT'))return 'SHARP LEFT';
    if(modifier.includes('RIGHT'))return 'TURN RIGHT';
    if(modifier.includes('LEFT'))return 'TURN LEFT';
    return 'GO STRAIGHT';
  }

  function nearestUpcomingStep(pos){
    let best=null,bestD=Infinity;
    for(const step of navigationSteps){
      const loc=step?.maneuver?.location;
      if(!Array.isArray(loc)||loc.length<2)continue;
      const d=haversine(pos,{lat:Number(loc[1]),lng:Number(loc[0])});
      if(d<bestD){bestD=d;best={step,distance:d};}
    }
    return best;
  }
  function bearing(a,b){
    const rad=Math.PI/180,deg=180/Math.PI;
    const y=Math.sin((b.lng-a.lng)*rad)*Math.cos(b.lat*rad);
    const x=Math.cos(a.lat*rad)*Math.sin(b.lat*rad)-Math.sin(a.lat*rad)*Math.cos(b.lat*rad)*Math.cos((b.lng-a.lng)*rad);
    return (Math.atan2(y,x)*deg+360)%360;
  }

  async function buildWalkingRoute(origin,target){
    if(!target)return false;
    const url='https://routing.openstreetmap.de/routed-foot/route/v1/driving/'+origin.lng+','+origin.lat+';'+target.lng+','+target.lat+'?overview=full&geometries=geojson&steps=true';
    try{
      const res=await fetch(url,{headers:{'Accept':'application/json'}});
      if(!res.ok)throw new Error('ROUTER_'+res.status);
      const data=await res.json();
      const route=data?.routes?.[0];
      if(!route?.geometry?.coordinates?.length)throw new Error('NO_WALKING_ROUTE');
      if(routeLine)routeLine.remove();
      routeLine=L.geoJSON(route.geometry,{style:{color:'#ef2d24',weight:5,opacity:.92,dashArray:'12 8'}}).addTo(map);
      navigationSteps=Array.isArray(route.legs?.[0]?.steps)?route.legs[0].steps:[];
      lastRouteAt=Date.now();lastRoutePosition={...origin};
      navOverlay.classList.add('active');
      navCompass.classList.add('active');
      status.textContent='WALKING NAVIGATION • FOLLOW THE ROUTE';document.getElementById('mapStatus').textContent='WALKING TO '+navigationTarget.name;
      updateNavigation(origin);
      return true;
    }catch(e){
      navOverlay.classList.remove('active');
      navCompass.classList.remove('active');
      status.textContent='WALKING ROUTE UNAVAILABLE — USE MAP';
      status.classList.add('route-error');
      return false;
    }
  }

  function updateNavigation(pos){
    if(!navigationStarted||!navigationTarget)return;
    const remaining=haversine(pos,navigationTarget);
    distance.textContent=formatDistance(remaining);
    next.textContent=navigationTarget.name;

    // Keep the player in the navigation focus, like a walking-navigation map.
    if(map){
      map.setView([pos.lat,pos.lng],18,{animate:false});
      map.invalidateSize({pan:false});
    }

    const upcoming=nearestUpcomingStep(pos);
    if(upcoming){
      navDirection.textContent=routeInstruction(upcoming.step);
      navDistance.textContent=upcoming.distance<=10?'NOW':'IN '+formatDistance(upcoming.distance);
    }

    if(lastRoutePosition){
      const moved=haversine(lastRoutePosition,pos);
      if(moved>4){
        const hdg=bearing(lastRoutePosition,pos);
        navCompass.style.transform='rotate('+hdg+'deg)';
        lastRoutePosition={...pos};
      }
    }

    if(navigationTarget.id!=='barameel' && remaining<=Math.max(5,navigationTarget.radius_meters||CHECKPOINT_HOTSPOT_RADIUS)){
      enterCheckpointHotspot(navigationTarget);
      return;
    }
    if(remaining<=Math.max(10,navigationTarget.radius_meters)){
      navDirection.textContent=navigationTarget.id==='barameel'?'BARAMEEL':'CHECKPOINT';
      navDistance.textContent='YOU ARE HERE';
      status.classList.remove('route-error');
      if(navigationTarget.id==='barameel'){
        status.textContent='BARAMEEL AREA REACHED • ARRIVE';
        setAction(true,'Enter Barameel Final Zone');
        action.classList.remove('scan-ready');
        action.onclick=()=>BR.goAfter('barameel-final-zone.html','confirm',240);
      }else{
        enterCheckpointHotspot(navigationTarget);
      }
      return;
    }

    action.classList.remove('scan-ready');
    if(!lastRoutePosition||haversine(pos,lastRoutePosition)>35 || Date.now()-lastRouteAt>20000)buildWalkingRoute(pos,navigationTarget);
  }

  let checkpointLockId=null;
  let checkpointSignalId=null;

  function checkpointAudio(kind='lock'){
    try{
      if(!window.AudioContext&&!window.webkitAudioContext)return;
      const Ctx=window.AudioContext||window.webkitAudioContext;
      if(!checkpointAudio.ctx)checkpointAudio.ctx=new Ctx();
      const c=checkpointAudio.ctx;
      if(c.state==='suspended')c.resume().catch(()=>{});
      const now=c.currentTime;
      const master=c.createGain();
      master.gain.setValueAtTime(.0001,now);
      master.gain.exponentialRampToValueAtTime(kind==='lock'?.20:.085,now+.025);
      master.gain.exponentialRampToValueAtTime(.0001,now+(kind==='lock'?1.15:.48));
      master.connect(c.destination);

      const sweep=c.createOscillator(),sg=c.createGain();
      sweep.type='sine';
      sweep.frequency.setValueAtTime(kind==='lock'?180:140,now);
      sweep.frequency.exponentialRampToValueAtTime(kind==='lock'?920:620,now+.72);
      sg.gain.setValueAtTime(.0001,now);
      sg.gain.exponentialRampToValueAtTime(1,now+.035);
      sg.gain.exponentialRampToValueAtTime(.0001,now+.72);
      sweep.connect(sg).connect(master);sweep.start(now);sweep.stop(now+.75);

      const beeps=kind==='lock'?[0,.16,.34,.55]:[0,.24];
      beeps.forEach((delay,i)=>{
        const o=c.createOscillator(),g=c.createGain();
        o.type=i===beeps.length-1?'triangle':'square';
        o.frequency.value=kind==='lock'?[660,880,1175,1568][i]:[520,740][i];
        const t=now+delay;
        g.gain.setValueAtTime(.0001,t);
        g.gain.exponentialRampToValueAtTime(kind==='lock'?.14:.075,t+.018);
        g.gain.exponentialRampToValueAtTime(.0001,t+(i===beeps.length-1?.18:.10));
        o.connect(g).connect(master);o.start(t);o.stop(t+.22);
      });
      if(kind==='lock'){
        const sub=c.createOscillator(),sg2=c.createGain();
        sub.type='triangle';sub.frequency.setValueAtTime(72,now);sub.frequency.exponentialRampToValueAtTime(42,now+.7);
        sg2.gain.setValueAtTime(.0001,now);sg2.gain.exponentialRampToValueAtTime(.11,now+.04);sg2.gain.exponentialRampToValueAtTime(.0001,now+.75);
        sub.connect(sg2).connect(master);sub.start(now);sub.stop(now+.78);
      }
    }catch{}
  }

  function checkpointLayer(mode){
    const layer=document.getElementById('checkpointLockLayer');
    if(!layer)return;
    layer.classList.remove('signal','locked');
    if(mode==='signal'){
      layer.classList.add('active','signal');
      checkpointAudio('signal');
      setTimeout(()=>layer.classList.remove('active','signal'),900);
      return;
    }
    if(mode==='lock'){
      layer.classList.add('active','locked');
      checkpointAudio('lock');
      try{if(typeof navigator.vibrate==='function')navigator.vibrate([24,38,18,62,28,90]);}catch{}
      setTimeout(()=>{if(layer.classList.contains('locked'))layer.classList.remove('active','locked')},4200);
    }
  }

  function enterCheckpointHotspot(cp){
    const id=String(cp?.id||'');
    if(!id)return;
    if(checkpointLockId===id)return;
    checkpointLockId=id;
    checkpointSignalId=id;
    checkpointLayer('lock');
    status.classList.remove('route-error');
    status.textContent='CHECKPOINT READY • OPEN CAMERA';
    next.textContent=id;
    distance.textContent='YOU ARE HERE';
    setAction(true,'Open Checkpoint Scanner');
    action.classList.add('scan-ready');
    const scannerUrl=TEST_MODE
      ? 'checkpoint-scanner.html?v=20261008-2&test=1&cp='+encodeURIComponent(id)
      : 'checkpoint-scanner.html?v=20261008-2';
    action.onclick=()=>BR.goAfter(scannerUrl,'scan',220);
  }

  function leaveCheckpointHotspot(){
    checkpointLockId=null;
    checkpointSignalId=null;
    const layer=document.getElementById('checkpointLockLayer');
    layer?.classList.remove('active','signal','locked');
    action.classList.remove('scan-ready');
  }

  async function startNavigation(target){
    if(!target||!latestPosition)return;
    if(Number(latestPosition.accuracy)>80){
      status.textContent='WAITING FOR MORE ACCURATE GPS • ±'+Math.round(latestPosition.accuracy)+' M';
      document.getElementById('mapStatus').textContent='GPS TOO WEAK • MOVE OUTDOORS';
      requestLocation();
      return;
    }
    navigationTarget=target;
    navigationStarted=true;
    status.classList.remove('route-error');
    action.classList.remove('scan-ready');
    navOverlay.classList.add('active');
    navCompass.classList.add('active');
    navDirection.textContent='CALCULATING';
    navDistance.textContent='WALKING ROUTE';
    setAction(true,target.id==='barameel'?'Navigate to Barameel':'Start Walking Navigation');
    await buildWalkingRoute(latestPosition,target);
    if(navigationTarget.id==='barameel'){
      action.onclick=()=>{ if(haversine(latestPosition,navigationTarget)<=navigationTarget.radius_meters)BR.goAfter('barameel-final-zone.html','confirm',240); else status.textContent='FOLLOW WALKING ROUTE TO BARAMEEL'; };
    }else{
      action.onclick=()=>{ if(haversine(latestPosition,navigationTarget)<=Math.max(10,navigationTarget.radius_meters))BR.goAfter('checkpoint-scanner.html?v=20261007-26.2','scan',220); else status.textContent='KEEP WALKING TO CHECKPOINT'; };
    }
  }

  function refresh(pos){
    const acc=Number.isFinite(Number(pos.accuracy))?Number(pos.accuracy):9999;
    if(latestPosition && acc>bestGpsAccuracy+25 && haversine(pos,latestPosition)>35) return;
    if(acc<bestGpsAccuracy) bestGpsAccuracy=acc;
    latestPosition={lat:pos.lat,lng:pos.lng,accuracy:acc};
    if(!TEST_MODE) renderMap(latestPosition);
    current.textContent='LIVE • '+pos.lat.toFixed(5)+', '+pos.lng.toFixed(5)+' • ±'+Math.round(acc)+' M';
    document.getElementById('mapStatus').textContent=acc<=GPS_GOOD_ACCURACY?'GPS LOCKED • ±'+Math.round(acc)+' M':'GPS IMPROVING • ±'+Math.round(acc)+' M';
    const destDistance=document.getElementById('destDistance'),destTime=document.getElementById('destTime');
    if(destination){
      const bd=haversine(pos,destination);
      destDistance.textContent=formatDistance(bd);
      const mins=Math.max(1,Math.round(bd/80));
      destTime.textContent=mins+' MIN';
      if(acc>GPS_GOOD_ACCURACY) destTime.textContent+=' • GPS ±'+Math.round(acc)+'M';
    }
    const unlocked=unlockedCheckpoints();
    const available=unlocked.filter(cp=>!discovered.has(cp.id)).map(cp=>({...cp,distance:haversine(pos,cp)})).sort((a,b)=>a.distance-b.distance);
    const total=checkpoints.length,done=checkpoints.filter(cp=>discovered.has(cp.id)).length;
    const progress=total?Math.min(100,Math.round(done/total*100)):0;
    fill.style.width=progress+'%';
    BR.mergePlayer({routeProgress:progress,routeDistance:available[0]?.distance??null,nextCheckpoint:available[0]?.id??null});
    if(navigationStarted){ updateNavigation(pos); return; }
    if(TEST_MODE && TEST_INSTANT){
      const testCp=checkpoints.find(cp=>String(cp.id).toUpperCase()===TEST_CP_ID);
      if(!testCp){routeError('TEST CHECKPOINT NOT FOUND');return;}
      const already=discovered.has(TEST_CP_ID);
      if(already){
        const keep=checkpoints.find(cp=>!discovered.has(cp.id));
        if(keep){next.textContent=keep.name;distance.textContent='TEST RESET REQUIRED';status.textContent='CP01 ALREADY TESTED • USE RESET';}
        return;
      }
      next.textContent=testCp.name;
      distance.textContent='0 M • YOU ARE HERE';
      status.textContent='TEST MODE • CHECKPOINT REACHED';
      setAction(true,'Open Checkpoint Scanner');
      enterCheckpointHotspot(testCp);
      return;
    }
    if(available.length){
      const hotspot=available[0];
      const hotspotRadius=Math.max(5,Number(hotspot.radius_meters||CHECKPOINT_HOTSPOT_RADIUS));
      if(hotspot.distance<=hotspotRadius){
        enterCheckpointHotspot(hotspot);
        return;
      }
      if(hotspot.distance<=CHECKPOINT_SIGNAL_RADIUS && checkpointSignalId!==hotspot.id){
        checkpointSignalId=hotspot.id;
        checkpointLayer('signal');
      }else if(hotspot.distance>CHECKPOINT_SIGNAL_RADIUS && checkpointSignalId===hotspot.id){
        checkpointSignalId=null;
      }
      next.textContent=available[0].name;
      distance.textContent=formatDistance(available[0].distance);
      if(checkpointLockId && hotspot.distance>hotspotRadius)leaveCheckpointHotspot();
      status.textContent=available.length===1?'CHECKPOINT AVAILABLE':'NEAREST CHECKPOINT • '+available.length+' AVAILABLE';
      status.classList.remove('route-error');
      setAction(true,'Start Walking Navigation to Checkpoint');
      action.classList.remove('scan-ready');
      action.onclick=()=>startNavigation(available[0]);
      return;
    }
    next.textContent=destination?destination.name:'ROUTE COMPLETE';
    if(destination){
      const d=haversine(pos,destination);
      distance.textContent=formatDistance(d);
      status.textContent='BARAMEEL AVAILABLE ANYTIME';document.getElementById('mapStatus').textContent='BARAMEEL DESTINATION';
      setAction(true,'Start Walking Navigation to Barameel');
      action.onclick=()=>startNavigation({...destination,id:'barameel'});
    }else{
      distance.textContent='—';
      status.textContent='CHECKPOINT RUN COMPLETE';
      setAction(true,'Finish Run');
      action.onclick=()=>BR.goAfter('run-complete.html','confirm',220);
    }
  }

  function routeError(message){
    const inApp=/Instagram|FBAN|FBAV|FB_IAB|musical_ly|BytedanceWebview/i.test(navigator.userAgent||'');
    status.textContent=inApp&&message.includes('LOCATION')?'OPEN IN SAFARI / CHROME FOR LOCATION ACCESS':message;
    status.classList.add('route-error');
    current.textContent='LOCATION UNAVAILABLE';next.textContent='—';distance.textContent='—';fill.style.width='0%';
    setAction(true,'Try Again');action.onclick=()=>requestLocation();
  }

  function testPosition(){
    const cp=(cfg.checkpoints||[]).find(x=>String(x.id).toUpperCase()===TEST_CP_ID);
    return cp?{lat:Number(cp.lat),lng:Number(cp.lng),accuracy:5}:null;
  }

  function startTestApproach(){
    const target=testPosition();
    if(!target){routeError('TEST CHECKPOINT NOT FOUND');return;}
    if(testApproachTimer)clearInterval(testApproachTimer);
    // Start ~55m away and move toward the real checkpoint in small GPS-like steps.
    let metersRemaining=55;
    const northStep=meters=>meters/111320;
    let p={lat:target.lat+northStep(metersRemaining),lng:target.lng,accuracy:5};
    status.textContent='TEST MODE • APPROACHING '+TEST_CP_ID;
    refresh(p);
    testApproachTimer=setInterval(()=>{
      metersRemaining=Math.max(0,metersRemaining-5);
      p={lat:target.lat+northStep(metersRemaining),lng:target.lng,accuracy:5};
      refresh(p);
      if(metersRemaining<=0){
        clearInterval(testApproachTimer);testApproachTimer=null;
        status.textContent='TEST MODE • CHECKPOINT LOCATION REACHED';
      }
    },650);
  }

  let locationTimer=null;
  function requestLocation(){
    if(TEST_MODE){
      if(TEST_INSTANT){const p=testPosition();if(!p){routeError('TEST CHECKPOINT NOT FOUND');return;}refresh(p);return;}
      if(TEST_APPROACH){startTestApproach();return;}
      const p=testPosition();
      if(!p){routeError('TEST CHECKPOINT NOT FOUND');return;}
      status.textContent='TEST MODE • SIMULATED CHECKPOINT';
      refresh(p);
      return;
    }
    if(!navigator.geolocation){routeError('LOCATION NOT SUPPORTED');return;}
    if(locationTimer)clearTimeout(locationTimer);
    status.textContent='LOCATING YOUR ROUTE…';
    current.textContent='WAITING FOR GPS…';
    document.getElementById('mapStatus').textContent='LOCATING GPS…';
    locationTimer=setTimeout(()=>{
      if(!latestPosition){
        status.textContent='GPS IS TAKING TOO LONG — TAP LOCATE';
        document.getElementById('mapStatus').textContent='GPS WAITING';
        setAction(true,'Try GPS Again');
        action.onclick=()=>requestLocation();
      }
    },8000);
    navigator.geolocation.getCurrentPosition(
      p=>{
        if(locationTimer)clearTimeout(locationTimer);
        const pos={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};
        refresh(pos);
        startWatching();
        loadLivePlayers(pos).catch(()=>{});
      },
      err=>{
        if(locationTimer)clearTimeout(locationTimer);
        const code=err?.code===1?'LOCATION PERMISSION REQUIRED':err?.code===2?'GPS POSITION UNAVAILABLE':'GPS TIMEOUT';
        routeError(code);
        document.getElementById('mapStatus').textContent='GPS '+code.replace('LOCATION ','');
      },
      {enableHighAccuracy:true,timeout:20000,maximumAge:0}
    );
  }
  function startWatching(){
    if(watchId||!navigator.geolocation)return;
    watchId=navigator.geolocation.watchPosition(
      p=>{const pos={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};refresh(pos);loadLivePlayers(pos);},
      ()=>{status.textContent='GPS SIGNAL WEAK — KEEP LOCATION ON';document.getElementById('mapStatus').textContent='GPS SIGNAL WEAK';},
      {enableHighAccuracy:true,maximumAge:0,timeout:20000}
    );
  }

  document.getElementById('mapLocate').onclick=()=>{if(latestPosition&&map)map.setView([latestPosition.lat,latestPosition.lng],18,{animate:true});else requestLocation();};
  document.getElementById('mapNorth').onclick=()=>{if(map)map.setBearing?map.setBearing(0):map.setView(map.getCenter(),map.getZoom(),{animate:true});};
  document.getElementById('startNavCard').onclick=()=>{if(latestPosition&&destination)startNavigation({...destination,id:'barameel'});else requestLocation();};
  direct.onclick=()=>{ if(latestPosition&&destination)startNavigation({...destination,id:'barameel'}); else requestLocation(); };

  if(!checkpoints.length&&!destination){
    current.textContent='LIVE ROUTE NOT CONFIGURED';next.textContent='—';distance.textContent='—';
    status.textContent='CHECKPOINT DATA NOT ACTIVE YET';status.classList.add('route-error');fill.style.width='0%';
    setAction(true,'Back to My Run');action.onclick=()=>BR.goAfter('screen04.html','back',180);
  }else{
    requestLocation();
    setInterval(()=>{
      if(latestPosition)loadLivePlayers(latestPosition).catch(()=>{});
    },10000);
  }

  window.addEventListener('pagehide',()=>{if(watchId&&navigator.geolocation)navigator.geolocation.clearWatch(watchId);if(testApproachTimer)clearInterval(testApproachTimer);leaveCheckpointHotspot()});
  if(TEST_MODE){
    status.textContent='TEST MODE • '+TEST_CP_ID+(TEST_INSTANT?' • CHECKPOINT REACHED':TEST_APPROACH?' • APPROACH SIMULATION':' • SIMULATED');
    document.title='BARAMEEL RUN — CHECKPOINT RUN — TEST';
  }
  BR.track('checkpoint_route_view').catch(()=>{});
})().catch(err=>{
  console.error('[BARAMEEL ROUTE MAP BOOT]',err);
  const s=document.getElementById('routeStatus');
  const m=document.getElementById('mapStatus');
  if(s){s.textContent='MAP RECOVERY MODE';s.classList.remove('route-error');}
  if(m)m.textContent='REAL MAP • RECOVERING';
  const a=document.getElementById('routeAction');
  if(a){a.disabled=false;a.setAttribute('aria-label','Retry Route Map');a.onclick=()=>location.reload();}
  try{
    const target=window.BARAMEEL_ROUTE_CONFIG?.destination||{lat:31.190520,lng:29.920547};
    if(!map)initMap(target);
    requestLocation();
  }catch(recoveryErr){
    console.error('[BARAMEEL ROUTE RECOVERY]',recoveryErr);
  }
});
</script>
</body>
</html>
