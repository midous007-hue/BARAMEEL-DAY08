<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071b2b">
<title>BARAMEEL RUN — CHECKPOINT RUN</title>
<link rel="stylesheet" href="./barameel-flow.css?v=20261006-23.6">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="./config.js?v=20261006-23.6"></script>
<style>
#routeMap{position:absolute;left:32.9%;top:28.0%;width:59.9%;height:19.7%;z-index:20;overflow:hidden;border-radius:4.0%;isolation:isolate;background:#071b2b;box-shadow:inset 0 0 0 3px rgba(246,231,206,.9),inset 0 0 0 6px rgba(244,197,47,.28),0 6px 14px rgba(0,0,0,.4)}
#routeMap .leaflet-container{width:100%;height:100%;background:#071b2b;filter:saturate(.76) contrast(.94) brightness(.9) sepia(.08)}
#routeMap .leaflet-tile-pane{opacity:.94}
#routeMap .leaflet-control-attribution{font-size:7px;line-height:1.1;background:rgba(7,27,43,.74)!important;color:#f6e7ce!important}
#routeMap .leaflet-control-attribution a{color:#f6e7ce!important}
#routeMap .leaflet-tooltip{font:900 10px/1 'Roboto Condensed',Arial,sans-serif;color:#071b2b;background:#f6e7ce;border:2px solid #f4c52f;box-shadow:0 2px 0 #071b2b}.player-marker{position:relative;width:78px;height:70px}.player-marker-avatar{position:absolute;left:19px;top:0;width:40px;height:40px;border-radius:50%;border:3px solid #f4c52f;box-shadow:0 0 0 3px #071b2b,0 0 14px rgba(244,197,47,.8);background-image:url('./assets/avatar-selection.webp?v=20261006-23.6');background-repeat:no-repeat;background-size:320% 560%;overflow:hidden}.player-marker-name{position:absolute;left:0;top:44px;width:78px;padding:3px 5px;border:2px solid #f4c52f;border-radius:999px;background:#f6e7ce;color:#071b2b;font:900 10px/1 'Roboto Condensed',Arial,sans-serif;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 #071b2b}
.route-field{position:absolute;z-index:24;display:flex;align-items:center;justify-content:center;color:#071b2b;font:900 clamp(11px,2.6vw,21px)/1 'Roboto Condensed',Arial,sans-serif;text-align:center;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2%;pointer-events:none}
#currentLocation{left:46.7%;top:53.9%;width:47.0%;height:4.2%}
#nextCheckpoint{left:46.7%;top:61.3%;width:47.0%;height:4.2%}
#distanceNext{left:46.7%;top:68.6%;width:47.0%;height:4.2%}
#routeProgress{position:absolute;left:34.1%;top:79.4%;width:58.1%;height:2.55%;z-index:25;background:rgba(246,231,206,.20);border-radius:99px;overflow:hidden;pointer-events:none}
#routeProgressFill{height:100%;width:0;background:#ef2d24;border-radius:99px;transition:width .45s ease}
#routeStatus{position:absolute;left:35.0%;top:44.0%;width:56.5%;height:3.4%;z-index:24;color:#f6e7ce;font:900 clamp(9px,2.15vw,16px)/1 'Roboto Condensed',Arial,sans-serif;text-align:center;text-transform:uppercase;text-shadow:0 2px 0 #071b2b;pointer-events:none}
#routeAction{left:30.2%;top:86.3%;width:64.9%;height:7.4%;z-index:30}
#routeAction:disabled{pointer-events:none;opacity:.55}
#routeActionLabel{position:absolute;inset:0;display:none;place-items:center;margin:2% 5%;border:3px solid #ef2d24;border-radius:999px;background:#f4c52f;color:#071b2b;font:900 clamp(14px,3.8vw,31px)/1 'Roboto Condensed',Arial,sans-serif;text-transform:uppercase;text-shadow:0 2px 0 rgba(255,255,255,.2);pointer-events:none;box-shadow:0 3px 0 #071b2b}
#routeAction.forward #routeActionLabel{display:grid}
.route-error{color:#ff9a8f!important}
@media(prefers-reduced-motion:reduce){#routeProgressFill{transition:none}}
</style>
</head>
<body>
<main class="flow-stage art-948x1659">
<img class="flow-art" src="./assets/route-map.webp?v=20261006-23.6" alt="BARAMEEL RUN CHECKPOINT RUN" fetchpriority="high">
<div id="routeMap" aria-label="Live checkpoint map"></div>
<div id="currentLocation" class="route-field">LOCATING…</div>
<div id="nextCheckpoint" class="route-field">LOADING…</div>
<div id="distanceNext" class="route-field">—</div>
<div id="routeStatus" aria-live="polite">PREPARING LIVE ROUTE</div>
<div id="routeProgress" aria-hidden="true"><div id="routeProgressFill"></div></div>
<button id="back" class="flow-hit" style="left:3%;top:1%;width:19%;height:6%" aria-label="Back to My Run"></button>
<button id="routeAction" class="flow-hit" disabled aria-label="Checkpoint action"><span id="routeActionLabel">LOADING ROUTE</span></button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./app.js?v=20261006-23.6"></script>
<script>
(async()=>{
  const status=document.getElementById('routeStatus'),current=document.getElementById('currentLocation');
  const next=document.getElementById('nextCheckpoint'),distance=document.getElementById('distanceNext');
  const fill=document.getElementById('routeProgressFill'),action=document.getElementById('routeAction'),label=document.getElementById('routeActionLabel');
  const routeBack=document.getElementById('back');routeBack.onclick=()=>BR.goAfter('screen04.html','back',180);
  await BR.syncPlayer().catch(()=>null);
  const cfg=window.BARAMEEL_ROUTE_CONFIG||{};
  const destination=cfg.destination&&Number.isFinite(Number(cfg.destination.lat))&&Number.isFinite(Number(cfg.destination.lng))
    ? {lat:Number(cfg.destination.lat),lng:Number(cfg.destination.lng),name:String(cfg.destination.name||'BARAMEEL'),radius_meters:Math.max(20,Number(cfg.destination.radius_meters||120))}
    : null;
  const checkpoints=Array.isArray(cfg.checkpoints)
    ? cfg.checkpoints.filter(x=>x&&Number.isFinite(Number(x.lat))&&Number.isFinite(Number(x.lng))).map(x=>({id:String(x.id||''),name:String(x.name||'CHECKPOINT'),lat:Number(x.lat),lng:Number(x.lng),order:Number.isFinite(Number(x.order))?Number(x.order):null}))
    : [];

  function haversine(a,b){
    const R=6371000,rad=Math.PI/180;
    const dLat=(b.lat-a.lat)*rad,dLng=(b.lng-a.lng)*rad;
    const x=Math.sin(dLat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));
  }
  function formatDistance(m){return m<1000?Math.max(1,Math.round(m))+' M':(m/1000).toFixed(m<10000?1:0)+' KM'}
  function setAction(text,enabled,showLabel=false){
    label.textContent=text;
    action.disabled=!enabled;
    action.classList.toggle('forward',!!showLabel);
  }

  const discovered=new Set((BR.state?.checkpoints||[]).map(String));
  let map=null,watchId=null,playerMarker=null,markers=[];

  function avatarPosition(id){const map={avatar01:['0%','24%'],avatar02:['50%','24%'],avatar03:['100%','24%'],avatar04:['0%','78%'],avatar05:['50%','78%'],avatar06:['100%','78%']};return map[id]||map.avatar01}
  function playerIcon(){const avatar=BR.selectedAvatar(),name=String(BR.state?.nickname||'PLAYER').toUpperCase().replace(/[&<>"]/g,'');const pos=avatarPosition(avatar);return L.divIcon({className:'',iconSize:[78,70],iconAnchor:[39,35],html:'<div class="player-marker"><div class="player-marker-avatar" style="background-position:'+pos[0]+' '+pos[1]+'"></div><div class="player-marker-name">'+name+'</div></div>'})}
  function marker(lat,lng,type,text){
    const fillColor=type==='player'?'#ef2d24':type==='barameel'?'#f4c52f':type==='found'?'#f4c52f':'#071b2b';
    const m=L.circleMarker([lat,lng],{radius:type==='player'?8:7,color:'#f6e7ce',weight:3,fillColor,fillOpacity:1});
    m.addTo(map).bindTooltip(text,{direction:'top',offset:[0,-10]});
    return m;
  }

  function renderMap(pos){
    if(!map){
      map=L.map('routeMap',{zoomControl:false,attributionControl:true,scrollWheelZoom:false,doubleClickZoom:false,touchZoom:false}).setView([pos.lat,pos.lng],15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
      playerMarker=L.marker([pos.lat,pos.lng],{icon:playerIcon(),keyboard:false,interactive:false}).addTo(map);
      if(destination){
        marker(destination.lat,destination.lng,'barameel',destination.name);
      }
      checkpoints.forEach(cp=>markers.push({cp,marker:marker(cp.lat,cp.lng,discovered.has(cp.id)?'found':'checkpoint',discovered.has(cp.id)?'CLEARED':'CHECKPOINT')}));
    }else{
      playerMarker.setLatLng([pos.lat,pos.lng]);playerMarker.setIcon(playerIcon());
    }
  }

  function refresh(pos){
    renderMap(pos);
    current.textContent='LIVE • '+pos.lat.toFixed(5)+', '+pos.lng.toFixed(5);

    const candidates=checkpoints.filter(cp=>!discovered.has(cp.id));const hasOrder=candidates.some(cp=>Number.isFinite(cp.order));const available=candidates.map(cp=>({...cp,distance:haversine(pos,cp)})).sort((a,b)=>hasOrder&&Number.isFinite(a.order)&&Number.isFinite(b.order)?a.order-b.order:a.distance-b.distance);
    const total=checkpoints.length,done=checkpoints.filter(cp=>discovered.has(cp.id)).length;
    const progress=total?Math.min(100,Math.round(done/total*100)):0;
    fill.style.width=progress+'%';
    BR.mergePlayer({routeProgress:progress,routeDistance:available[0]?.distance??null,nextCheckpoint:available[0]?.id??null});
    if(available.length){
      next.textContent=available[0].name;
      distance.textContent=formatDistance(available[0].distance);
      status.textContent='NEXT CHECKPOINT READY';
      status.classList.remove('route-error');
      setAction('GO TO CHECKPOINT',true);
      action.onclick=()=>BR.goAfter('checkpoint-scanner.html','scan',220);
      return;
    }

    next.textContent=destination?destination.name:'ROUTE COMPLETE';
    if(destination){
      const d=haversine(pos,destination);
      distance.textContent=formatDistance(d);
      if(d<=destination.radius_meters){
        status.textContent='BARAMEEL FINAL ZONE REACHED';
        setAction('ARRIVE AT BARAMEEL',true,true);
        action.onclick=()=>BR.goAfter('barameel-final-zone.html','confirm',240);
      }else{
        status.textContent='ALL CHECKPOINTS CLEARED • HEAD TO BARAMEEL';
        setAction('REFRESH LOCATION',true,false);
        action.onclick=()=>{BR.play('tap');BR.haptic('tap');requestLocation()};
      }
    }else{
      distance.textContent='—';
      status.textContent='CHECKPOINT RUN COMPLETE';
      setAction('FINISH RUN',true,true);
      action.onclick=()=>BR.goAfter('run-complete.html','confirm',220);
    }
  }

  function routeError(message){
    const inApp=/Instagram|FBAN|FBAV|FB_IAB|musical_ly|BytedanceWebview/i.test(navigator.userAgent||'');
    status.textContent=inApp&&message.includes('LOCATION')?'OPEN IN SAFARI / CHROME FOR LOCATION ACCESS':message;status.classList.add('route-error');
    current.textContent='LOCATION UNAVAILABLE';next.textContent='—';distance.textContent='—';fill.style.width='0%';
    setAction('TRY AGAIN',true);action.onclick=()=>requestLocation();
  }

  function requestLocation(){
    if(!navigator.geolocation){routeError('LOCATION NOT SUPPORTED');return;}
    status.textContent='LOCATING YOUR ROUTE…';
    navigator.geolocation.getCurrentPosition(
      p=>refresh({lat:p.coords.latitude,lng:p.coords.longitude}),
      ()=>routeError('LOCATION ACCESS NEEDED FOR CHECKPOINT RUN'),
      {enableHighAccuracy:true,timeout:12000,maximumAge:10000}
    );
  }

  if(!checkpoints.length&&!destination){
    current.textContent='LIVE ROUTE NOT CONFIGURED';next.textContent='—';distance.textContent='—';
    status.textContent='CHECKPOINT DATA NOT ACTIVE YET';status.classList.add('route-error');
    fill.style.width='0%';
    status.textContent='';
    setAction('BACK TO MY RUN',true,false);
    action.onclick=()=>BR.goAfter('screen04.html','back',180);
  }else{
    requestLocation();
  }


  window.addEventListener('pagehide',()=>{if(watchId&&navigator.geolocation)navigator.geolocation.clearWatch(watchId)});
  BR.track('checkpoint_route_view');
})();
</script>
</body>
</html>
