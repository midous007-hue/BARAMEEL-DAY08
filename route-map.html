<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="stylesheet" href="./barameel-flow.css?v=20261004-23.1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="./config.js?v=20261004-23.1"></script>
<style>
#routeMap{position:absolute;left:31.5%;top:21.5%;width:63%;height:36.5%;z-index:20;overflow:hidden;border-radius:22px;background:#071b2b}
#routeMap .leaflet-control-attribution{font-size:8px}
#routeMapStatus{position:absolute;left:34%;top:59.8%;width:59%;z-index:24;color:#f6e7ce;text-align:center;font:900 clamp(11px,2.7vw,24px)/1.1 'Roboto Condensed',Arial,sans-serif;pointer-events:none;text-transform:uppercase;text-shadow:0 2px 0 #071b2b}
#targetTitle{position:absolute;left:57%;top:62.4%;width:35%;z-index:24;color:#f6e7ce;font:900 clamp(13px,3.2vw,28px)/1 'Roboto Condensed',Arial,sans-serif;text-align:center;pointer-events:none;text-transform:uppercase}
#targetMeta{position:absolute;left:57%;top:67.2%;width:35%;z-index:24;color:#f6e7ce;font:700 clamp(10px,2.4vw,20px)/1.1 'Roboto Condensed',Arial,sans-serif;text-align:center;pointer-events:none;opacity:.9}
#routeProgress{position:absolute;left:37%;top:76.2%;width:53%;height:4px;z-index:24;background:rgba(246,231,206,.28);border-radius:99px;overflow:hidden;pointer-events:none}
#routeProgressFill{height:100%;width:0;background:#ef2d24;border-radius:99px;transition:width .5s ease}
#routeAction{left:30.8%;top:86.8%;width:64.7%;height:6.4%;z-index:30}
#routeActionLabel{position:absolute;inset:0;display:grid;place-items:center;color:#071b2b;font:900 clamp(15px,4vw,34px)/1 'Roboto Condensed',Arial,sans-serif;text-transform:uppercase;pointer-events:none}
@media(prefers-reduced-motion:reduce){#routeProgressFill{transition:none}}
</style>
</head>
<body>
<main class="flow-stage art-948x1660">
<img class="flow-art" src="./assets/route-map.webp?v=20261004-23.1" alt="BARAMEEL RUN LIVE ROUTE" fetchpriority="high">
<div id="routeMap" aria-label="Interactive live route map"></div>
<div id="routeMapStatus" aria-live="polite">LOCATING YOUR ROUTE…</div>
<div id="targetTitle">ROUTE LOADING</div>
<div id="targetMeta"></div>
<div id="routeProgress" aria-hidden="true"><div id="routeProgressFill"></div></div>
<button id="back" class="flow-hit" style="left:3%;top:1%;width:19%;height:6%" aria-label="Back"></button>
<button id="routeAction" class="flow-hit" aria-label="Route action"><span id="routeActionLabel">EXPLORE ROUTE</span></button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./app.js?v=20261004-23.1"></script>
<script src="./barameel-flow.js?v=20261004-23.1"></script>
<script>
(()=> {
  const back=document.getElementById('back');
  const action=document.getElementById('routeAction');
  const actionLabel=document.getElementById('routeActionLabel');
  const status=document.getElementById('routeMapStatus');
  const title=document.getElementById('targetTitle');
  const meta=document.getElementById('targetMeta');
  const fill=document.getElementById('routeProgressFill');
  const cfg=window.BARAMEEL_ROUTE_CONFIG||{};
  const destination=cfg.destination && Number.isFinite(Number(cfg.destination.lat)) && Number.isFinite(Number(cfg.destination.lng))
    ? {lat:Number(cfg.destination.lat),lng:Number(cfg.destination.lng),name:String(cfg.destination.name||'BARAMEEL')} : null;
  const checkpoints=Array.isArray(cfg.checkpoints) ? cfg.checkpoints.filter(x=>Number.isFinite(Number(x.lat))&&Number.isFinite(Number(x.lng))).map(x=>({
    ...x,lat:Number(x.lat),lng:Number(x.lng),id:String(x.id||''),name:String(x.name||'CHECKPOINT')
  })) : [];
  const discovered=new Set((BR.state?.checkpoints||[]).map(String));

  function setAction(label,enabled=true){
    actionLabel.textContent=label;
    action.disabled=!enabled;
    action.style.opacity=enabled?'1':'.55';
  }
  function marker(lat,lng,type,label){
    const color=type==='player'?'#ef2d24':type==='barameel'?'#f4c52f':'#071b2b';
    const m=L.circleMarker([lat,lng],{radius:9,color:'#f6e7ce',weight:3,fillColor:color,fillOpacity:1});
    m.addTo(map).bindTooltip(label,{direction:'top',offset:[0,-10]});
    return m;
  }
  let map=null;
  function start(pos){
    map=L.map('routeMap',{zoomControl:false,attributionControl:true}).setView([pos.lat,pos.lng],15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    marker(pos.lat,pos.lng,'player','YOU ARE HERE');

    if(destination){
      marker(destination.lat,destination.lng,'barameel',destination.name);
      L.polyline([[pos.lat,pos.lng],[destination.lat,destination.lng]],{color:'#ef2d24',weight:5,dashArray:'10 10',opacity:.9}).addTo(map);
    }

    checkpoints.forEach(cp=>marker(cp.lat,cp.lng,discovered.has(cp.id)?'found':'checkpoint',discovered.has(cp.id)?'CHECKPOINT FOUND':'CHECKPOINT'));

    const available=checkpoints.filter(cp=>!discovered.has(cp.id));
    if(available.length){
      available.sort((x,y)=>((x.lat-pos.lat)**2+(x.lng-pos.lng)**2)-((y.lat-pos.lat)**2+(y.lng-pos.lng)**2));
      title.textContent=available[0].name;
      meta.textContent='CHECKPOINT AVAILABLE';
      setAction('GO TO CHECKPOINT');
    }else if(destination){
      title.textContent=destination.name;
      meta.textContent='FINAL DESTINATION';
      setAction('HEAD TO BARAMEEL');
    }else{
      title.textContent='ROUTE DATA NOT ACTIVE';
      meta.textContent='CHECKPOINTS WILL APPEAR HERE WHEN THE ROUTE IS LIVE';
      setAction('BACK TO PROGRESS');
    }

    const total=checkpoints.length;
    const done=checkpoints.filter(cp=>discovered.has(cp.id)).length;
    fill.style.width=total ? Math.min(100,(done/total)*100)+'%' : '0%';
    status.textContent=destination||checkpoints.length ? 'LIVE ROUTE READY' : 'LIVE MAP READY';

    action.onclick=()=>{
      if(available.length||destination) BARAMEEL_FLOW.go('checkpoint-scanner.html','scan');
      else BARAMEEL_FLOW.go('screen06.html','back');
    };
  }

  if(!navigator.geolocation){
    status.textContent='LOCATION UNAVAILABLE';
    title.textContent='ROUTE UNAVAILABLE';
    meta.textContent='LOCATION IS REQUIRED';
    setAction('BACK TO PROGRESS');
  }else{
    navigator.geolocation.getCurrentPosition(
      p=>start({lat:p.coords.latitude,lng:p.coords.longitude}),
      ()=>{
        status.textContent='LOCATION ACCESS NEEDED FOR LIVE ROUTE';
        title.textContent='ENABLE LOCATION';
        meta.textContent='YOUR POSITION IS REQUIRED';
        setAction('TRY AGAIN');
        action.onclick=()=>location.reload();
      },
      {enableHighAccuracy:true,timeout:10000,maximumAge:15000}
    );
  }

  back.onclick=()=>{
    const target=BR.safeSession.get('barameelRouteReturn')||'screen06.html';
    BARAMEEL_FLOW.go(target,'back');
  };
})();
</script>
</body></html>
