<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071b2b">
<title>BARAMEEL RUN — CHECKPOINT RUN</title>
<link rel="stylesheet" href="./barameel-flow.css?v=20261007-26.2">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b2b}
.flow-stage.route-map-stage{position:relative;width:100vw;height:100dvh;max-width:none;max-height:none;overflow:hidden;background:#071b2b}
#routeMap{position:absolute;inset:0;z-index:1;background:#071b2b;overflow:hidden}
#routeMap .maplibregl-map,
#routeMap .maplibregl-canvas-container,
#routeMap .maplibregl-canvas{width:100%!important;height:100%!important}
#routeMap .maplibregl-canvas{display:block}
#routeMap .maplibregl-ctrl-attrib{font:700 8px/1 Arial,sans-serif;background:rgba(7,27,43,.72)!important;color:#f6e7ce!important}
#routeMap .maplibregl-ctrl-attrib a{color:#f6e7ce!important}
#routeMap .maplibregl-ctrl-group{display:none}
#mapBrand{position:absolute;left:24px;top:18px;z-index:20;color:#f6e7ce;font:900 clamp(25px,5vw,52px)/.9 'Roboto Condensed',Arial,sans-serif;letter-spacing:-.045em;text-transform:uppercase;text-shadow:3px 3px 0 #071b2b;pointer-events:none}
#mapBrand b{color:#ef2d24}
#mapBrand small{display:block;margin-top:7px;color:#f4c52f;font-size:.28em;letter-spacing:.32em;text-indent:.32em}
#mapStatus{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:20;min-width:180px;max-width:46vw;padding:10px 18px;border:2px solid #f4c52f;border-radius:999px;background:rgba(7,27,43,.88);color:#f6e7ce;font:900 clamp(10px,2vw,15px)/1 'Roboto Condensed',Arial,sans-serif;text-align:center;text-transform:uppercase;letter-spacing:.04em;box-shadow:0 3px 0 rgba(0,0,0,.45);pointer-events:none}
.map-control{position:absolute;z-index:21;right:18px;width:54px;height:54px;border:2px solid #f6e7ce;border-radius:50%;background:rgba(7,27,43,.88);color:#f6e7ce;font:900 29px/48px Arial,sans-serif;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.45);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#mapLocate{top:152px}#mapNorth{top:218px;font-size:24px}
#currentLocation{position:absolute;left:24px;top:92px;z-index:20;padding:8px 12px;border:1px solid rgba(246,231,206,.7);border-radius:999px;background:rgba(7,27,43,.76);color:#f6e7ce;font:900 11px/1 'Roboto Condensed',Arial,sans-serif;white-space:nowrap;pointer-events:none}
#navOverlay{position:absolute;left:50%;top:82px;transform:translateX(-50%);z-index:20;display:none;align-items:center;justify-content:center;gap:8px;padding:8px 12px;border:2px solid #f4c52f;border-radius:12px;background:rgba(7,27,43,.88);color:#f6e7ce;font:900 clamp(10px,2.4vw,18px)/1 'Roboto Condensed',Arial,sans-serif;text-transform:uppercase;white-space:nowrap;pointer-events:none}
#navOverlay.active{display:flex}
#navDirection{color:#f4c52f}
#navCompass{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;display:none;place-items:center;width:42px;height:42px;border-radius:50%;background:rgba(7,27,43,.82);border:2px solid #f4c52f;color:#f4c52f;font:900 25px/1 Arial,sans-serif;pointer-events:none}
#navCompass.active{display:grid}
#mapDestinationCard{position:absolute;left:24px;bottom:24px;z-index:20;width:min(440px,calc(100vw - 48px));padding:16px;border:2px solid #f6e7ce;border-radius:22px;background:rgba(7,27,43,.94);box-shadow:0 5px 0 rgba(0,0,0,.45);color:#f6e7ce}
#mapDestinationCard .dest-title{color:#f4c52f;font:900 clamp(20px,3.2vw,32px)/1 'Roboto Condensed',Arial,sans-serif;text-transform:uppercase}
#mapDestinationCard .dest-meta{display:flex;gap:22px;margin-top:7px;color:#f6e7ce;font:900 clamp(13px,2.2vw,19px)/1 'Roboto Condensed',Arial,sans-serif}
#mapDestinationCard .dest-action{width:100%;margin-top:13px;padding:13px 16px;border:0;border-radius:999px;background:#f4c52f;color:#071b2b;font:900 clamp(15px,2.5vw,23px)/1 'Roboto Condensed',Arial,sans-serif;text-transform:uppercase;cursor:pointer;touch-action:manipulation}
#mapDestinationCard .dest-action:active{transform:translateY(1px)}
#nextCheckpoint,#distanceNext,#routeStatus{position:absolute;left:50%;transform:translateX(-50%);z-index:20;color:#f6e7ce;font:900 11px/1 'Roboto Condensed',Arial,sans-serif;text-transform:uppercase;white-space:nowrap;pointer-events:none}
#nextCheckpoint{bottom:160px;padding:7px 12px;border:1px solid #f4c52f;border-radius:999px;background:rgba(7,27,43,.78);font-size:12px}
#distanceNext{bottom:128px;padding:6px 10px;border-radius:999px;background:rgba(7,27,43,.72)}
#routeStatus{bottom:92px;padding:6px 10px;border-radius:999px;background:rgba(7,27,43,.72)}
#routeProgress{position:absolute;left:24px;right:24px;bottom:14px;height:4px;z-index:20;background:rgba(246,231,206,.25);border-radius:99px;overflow:hidden;pointer-events:none}
#routeProgressFill{height:100%;width:0;background:#ef2d24;border-radius:99px;transition:width .35s ease}
#routeAction{position:absolute;left:24px;right:24px;bottom:82px;top:auto;width:auto;height:48px;z-index:19;opacity:0;pointer-events:none;border:0;background:transparent}
#routeAction.ready{pointer-events:auto}
#directBarameel{display:none}
.map-pin{position:relative;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:3px solid #f6e7ce;background:#071b2b;box-shadow:0 3px 0 rgba(0,0,0,.45),0 0 12px rgba(244,197,47,.55);font:900 10px/1 'Roboto Condensed',Arial,sans-serif;color:#f6e7ce;text-align:center;text-transform:uppercase}
.map-pin.checkpoint{background:#071b2b;border-color:#f4c52f}
.map-pin.cleared{background:#f4c52f;color:#071b2b}
.map-pin.barameel{width:44px;height:44px;background:#ef2d24;border-color:#f4c52f;font-size:11px;box-shadow:0 3px 0 rgba(0,0,0,.5),0 0 18px rgba(239,45,36,.55)}
.map-pin .pin-label{position:absolute;left:50%;top:39px;transform:translateX(-50%);padding:3px 6px;border:1px solid #f4c52f;border-radius:999px;background:rgba(7,27,43,.9);color:#f6e7ce;font:900 9px/1 'Roboto Condensed',Arial,sans-serif;white-space:nowrap}
.map-player{width:48px;height:48px;border-radius:50%;border:3px solid #f4c52f;background:#071b2b;box-shadow:0 0 0 3px #071b2b,0 0 15px rgba(244,197,47,.8);overflow:hidden;background-image:url('./assets/avatar-selection.webp?v=20261007-26.2');background-repeat:no-repeat;background-size:320% 560%}
.map-player-name{position:absolute;top:54px;left:50%;transform:translateX(-50%);padding:3px 6px;border:1px solid #f4c52f;border-radius:999px;background:#f6e7ce;color:#071b2b;font:900 9px/1 'Roboto Condensed',Arial,sans-serif;white-space:nowrap}
.live-player{width:26px;height:26px;border-radius:50%;border:2px solid #f6e7ce;background:#ef2d24;color:#f6e7ce;box-shadow:0 0 0 2px #071b2b,0 0 10px rgba(239,45,36,.75);font:900 9px/22px 'Roboto Condensed',Arial,sans-serif;text-align:center}
.live-player-name{position:absolute;top:29px;left:50%;transform:translateX(-50%);color:#f6e7ce;text-shadow:1px 1px 0 #071b2b;font:900 8px/1 'Roboto Condensed',Arial,sans-serif;white-space:nowrap}
.route-error{color:#ff9a8f!important}
@media(max-width:700px){
  #mapBrand{left:14px;top:13px;font-size:30px}
  #mapStatus{top:13px;right:70px;left:auto;transform:none;min-width:0;max-width:45vw;padding:8px 10px}
  .map-control{right:12px;width:46px;height:46px;line-height:40px}
  #mapLocate{top:78px}#mapNorth{top:136px;font-size:20px}
  #currentLocation{left:14px;top:72px;max-width:55vw;overflow:hidden;text-overflow:ellipsis}
  #mapDestinationCard{left:12px;right:12px;bottom:12px;width:auto;padding:13px;border-radius:18px}
  #mapDestinationCard .dest-action{padding:12px}
  #nextCheckpoint,#distanceNext,#routeStatus{display:none}
}
</style>
</head>
<body>
<main class="flow-stage route-map-stage">
<div id="routeMap" aria-label="Live checkpoint map"></div>
<div id="mapBrand">BARAMEEL <b>RUN</b><small>ALEXANDRIA • REAL GAME MAP</small></div>
<div id="mapStatus">MAP STARTING…</div>
<button id="mapLocate" class="map-control" aria-label="Center on player">◉</button>
<button id="mapNorth" class="map-control" aria-label="North up">N</button>
<div id="currentLocation">LOCATING…</div>
<div id="navOverlay" aria-live="polite"><span id="navDirection">WALK</span><span id="navDistance"></span><span>WALKING</span></div>
<div id="navCompass" aria-hidden="true">↑</div>
<div id="mapDestinationCard">
  <div class="dest-title">BARAMEEL</div>
  <div class="dest-meta"><span id="destDistance">—</span><span id="destTime">—</span></div>
  <button id="startNavCard" class="dest-action">START NAVIGATION</button>
</div>
<div id="nextCheckpoint">LOADING…</div>
<div id="distanceNext">—</div>
<div id="routeStatus" aria-live="polite">PREPARING ROUTE</div>
<div id="routeProgress" aria-hidden="true"><div id="routeProgressFill"></div></div>
<button id="routeAction" aria-label="Open checkpoint scanner"></button>
<div id="livePlayers" aria-hidden="true"></div>
<button id="back" aria-label="Back to My Run" style="position:absolute;left:3%;top:1%;width:19%;height:6%;z-index:30;border:0;background:transparent;cursor:pointer"></button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<script src="./config.js?v=20261008-1"></script>
<script src="./app.js?v=20261007-26.2"></script>

<script>
(async()=>{
  const status=document.getElementById('routeStatus');
  const current=document.getElementById('currentLocation');
  const next=document.getElementById('nextCheckpoint');
  const distance=document.getElementById('distanceNext');
  const fill=document.getElementById('routeProgressFill');
  const action=document.getElementById('routeAction');
  const navOverlay=document.getElementById('navOverlay');
  const navDirection=document.getElementById('navDirection');
  const navDistance=document.getElementById('navDistance');
  const navCompass=document.getElementById('navCompass');
  const routeBack=document.getElementById('back');
  const mapStatus=document.getElementById('mapStatus');
  const destDistance=document.getElementById('destDistance');
  const destTime=document.getElementById('destTime');
  const startNavCard=document.getElementById('startNavCard');

  routeBack.onclick=()=>BR.goAfter('screen04.html','back',180);

  const params=new URLSearchParams(location.search);
  const TEST_MODE=params.get('test')==='1';
  const TEST_CP_ID=String(params.get('cp')||'CP01').toUpperCase();
  const TEST_APPROACH=TEST_MODE&&params.get('approach')==='1';
  const TEST_INSTANT=TEST_MODE&&params.get('instant')==='1';
  const CHECKPOINT_HOTSPOT_RADIUS=10;

  const cfg=window.BARAMEEL_ROUTE_CONFIG||{};
  const destination=cfg.destination&&Number.isFinite(Number(cfg.destination.lat))&&Number.isFinite(Number(cfg.destination.lng))
    ? {id:'barameel',name:String(cfg.destination.name||'BARAMEEL'),lat:Number(cfg.destination.lat),lng:Number(cfg.destination.lng),radius_meters:Math.max(20,Number(cfg.destination.radius_meters||120))}
    : null;
  const checkpoints=Array.isArray(cfg.checkpoints)
    ? cfg.checkpoints.filter(x=>x&&Number.isFinite(Number(x.lat))&&Number.isFinite(Number(x.lng)))
      .map(x=>({id:String(x.id||''),name:String(x.name||'CHECKPOINT'),lat:Number(x.lat),lng:Number(x.lng),order:Number.isFinite(Number(x.order))?Number(x.order):null,radius_meters:Math.max(5,Number(x.radius_meters||CHECKPOINT_HOTSPOT_RADIUS))}))
    : [];

  let map=null;
  let mapReady=false;
  let latestPosition=null;
  let watchId=null;
  let locationTimer=null;
  let bestGpsAccuracy=Infinity;
  let navigationTarget=null;
  let navigationStarted=false;
  let navigationSteps=[];
  let lastRouteAt=0;
  let lastRoutePosition=null;
  let routeHasFit=false;
  let didInitialCenter=false;
  let playerMarker=null;
  let destinationMarker=null;
  let checkpointMarkers=new Map();
  let liveMarkers=new Map();
  let testApproachTimer=null;

  const roadStyle='./assets/barameel-map-style.json?v=20261008-32.0';

  function haversine(a,b){
    const R=6371000,rad=Math.PI/180;
    const dLat=(b.lat-a.lat)*rad,dLng=(b.lng-a.lng)*rad;
    const x=Math.sin(dLat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));
  }
  function formatDistance(m){return m<1000?Math.max(1,Math.round(m))+' M':(m/1000).toFixed(m<10000?1:0)+' KM'}
  function setAction(enabled,label='Open Checkpoint Scanner'){
    action.setAttribute('aria-label',label);
    action.disabled=!enabled;
    action.classList.toggle('ready',!!enabled);
  }
  function avatarPosition(id){
    const mapPos={avatar01:['0%','24%'],avatar02:['50%','24%'],avatar03:['100%','24%'],avatar04:['0%','78%'],avatar05:['50%','78%'],avatar06:['100%','78%']};
    return mapPos[id]||mapPos.avatar01;
  }
  function getDiscovered(){
    const out=new Set((BR.state?.checkpoints||[]).map(String));
    return out;
  }
  function unlockedCheckpoints(){
    const discovered=getDiscovered();
    const ordered=[...checkpoints].sort((a,b)=>(Number.isFinite(a.order)?a.order:9999)-(Number.isFinite(b.order)?b.order:9999));
    return ordered.slice(0,Math.min(ordered.length,Math.max(1,discovered.size+1)));
  }
  function markerElement(kind,label){
    const el=document.createElement('div');
    el.className='map-pin '+kind;
    const labelEl=document.createElement('span');
    labelEl.className='pin-label';
    labelEl.textContent=label;
    el.appendChild(labelEl);
    return el;
  }
  function addDestinationMarker(){
    if(!map||!mapReady||!destination||destinationMarker)return;
    const el=markerElement('barameel','BARAMEEL');
    destinationMarker=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([destination.lng,destination.lat]).addTo(map);
  }
  function syncCheckpointMarkers(){
    if(!map||!mapReady)return;
    const discovered=getDiscovered();
    const allowed=new Set(unlockedCheckpoints().map(x=>x.id));
    for(const [id,m] of checkpointMarkers){
      if(!allowed.has(id)){
        m.remove();
        checkpointMarkers.delete(id);
      }
    }
    for(const cp of checkpoints){
      if(!allowed.has(cp.id))continue;
      const isCleared=discovered.has(cp.id);
      const existing=checkpointMarkers.get(cp.id);
      if(existing){
        existing.getElement().classList.toggle('cleared',isCleared);
        existing.getElement().classList.toggle('checkpoint',!isCleared);
        continue;
      }
      const el=markerElement(isCleared?'cleared':'checkpoint',cp.name);
      const m=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([cp.lng,cp.lat]).addTo(map);
      checkpointMarkers.set(cp.id,m);
    }
  }
  function playerElement(){
    const el=document.createElement('div');
    const avatar=BR.selectedAvatar();
    const name=String(BR.state?.nickname||'PLAYER').toUpperCase();
    el.className='map-player';
    const pos=avatarPosition(avatar);
    el.style.backgroundPosition=pos[0]+' '+pos[1];
    const nameEl=document.createElement('span');
    nameEl.className='map-player-name';
    nameEl.textContent=name;
    el.appendChild(nameEl);
    return el;
  }
  function ensurePlayerMarker(){
    if(!map||!mapReady||!latestPosition)return;
    if(!playerMarker){
      playerMarker=new maplibregl.Marker({element:playerElement(),anchor:'center'}).setLngLat([latestPosition.lng,latestPosition.lat]).addTo(map);
    }else{
      playerMarker.setLngLat([latestPosition.lng,latestPosition.lat]);
    }
  }
  function projectLivePlayers(list){
    if(!map||!mapReady)return;
    const keep=new Set();
    for(const p of list){
      const id=String(p.id||p.player_id||'');
      if(!id||id===String(BR.state?.playerId||''))continue;
      const lat=Number(p.lat),lng=Number(p.lng);
      if(!Number.isFinite(lat)||!Number.isFinite(lng))continue;
      keep.add(id);
      let marker=liveMarkers.get(id);
      if(!marker){
        const el=document.createElement('div');
        el.className='live-player';
        const first=(String(p.nickname||p.name||'P').trim()[0]||'P').toUpperCase();
        el.textContent=first;
        const label=document.createElement('span');
        label.className='live-player-name';
        label.textContent=String(p.nickname||p.name||'PLAYER').toUpperCase();
        el.appendChild(label);
        marker=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([lng,lat]).addTo(map);
        liveMarkers.set(id,marker);
      }else{
        marker.setLngLat([lng,lat]);
      }
    }
    for(const [id,m] of liveMarkers){
      if(!keep.has(id)){m.remove();liveMarkers.delete(id);}
    }
  }
  async function loadLivePlayers(pos=latestPosition){
    if(TEST_MODE||!pos)return;
    try{
      const r=await BR.api('/live-players',{lat:Number(pos.lat),lng:Number(pos.lng),accuracy_meters:Number(pos.accuracy||0)});
      projectLivePlayers(Array.isArray(r?.players)?r.players:[]);
    }catch{
      for(const m of liveMarkers.values())m.remove();
      liveMarkers.clear();
    }
  }
  function routeInstruction(step){
    const m=step?.maneuver||{};
    const modifier=String(m.modifier||'').replace(/_/g,' ').toUpperCase();
    const type=String(m.type||'').toLowerCase();
    if(type==='arrive')return 'ARRIVE';
    if(type==='depart')return modifier?('GO '+modifier):'START WALKING';
    if(type==='roundabout'||type==='rotary')return modifier?('ROUNDABOUT • '+modifier):'ROUNDABOUT';
    if(modifier.includes('UTURN'))return 'U-TURN';
    if(modifier.includes('SHARP RIGHT'))return 'SHARP RIGHT';
    if(modifier.includes('SHARP LEFT'))return 'SHARP LEFT';
    if(modifier.includes('SLIGHT RIGHT'))return 'SLIGHT RIGHT';
    if(modifier.includes('SLIGHT LEFT'))return 'SLIGHT LEFT';
    if(modifier.includes('RIGHT'))return 'TURN RIGHT';
    if(modifier.includes('LEFT'))return 'TURN LEFT';
    return 'GO STRAIGHT';
  }
  function bearing(a,b){
    const rad=Math.PI/180,deg=180/Math.PI;
    const y=Math.sin((b.lng-a.lng)*rad)*Math.cos(b.lat*rad);
    const x=Math.cos(a.lat*rad)*Math.sin(b.lat*rad)-Math.sin(a.lat*rad)*Math.cos(b.lat*rad)*Math.cos((b.lng-a.lng)*rad);
    return (Math.atan2(y,x)*deg+360)%360;
  }
  function nearestUpcomingStep(pos){
    let best=null,bestD=Infinity;
    for(const step of navigationSteps){
      const loc=step?.maneuver?.location;
      if(!Array.isArray(loc)||loc.length<2)continue;
      const d=haversine(pos,{lat:Number(loc[1]),lng:Number(loc[0])});
      if(d<bestD){bestD=d;best={step,distance:d};}
    }
    return best;
  }
  function setMapStatus(textValue,error=false){
    mapStatus.textContent=textValue;
    mapStatus.classList.toggle('route-error',error);
  }
  function initMap(center){
    if(map||typeof window.maplibregl==='undefined'){
      if(typeof window.maplibregl==='undefined')setMapStatus('MAP ENGINE UNAVAILABLE',true);
      return;
    }
    const c=center||destination||{lat:31.190520,lng:29.920547};
    try{
      map=new maplibregl.Map({
        container:'routeMap',
        style:roadStyle,
        center:[c.lng,c.lat],
        zoom:15,
        pitch:0,
        bearing:0,
        attributionControl:true,
        cooperativeGestures:false,
        dragPan:true,
        scrollZoom:true,
        doubleClickZoom:true,
        touchZoomRotate:true,
        minZoom:12,
        maxZoom:19,
        trackResize:true
      });
      map.on('load',()=>{
        mapReady=true;
        routeHasFit=false;
        setMapStatus('BARAMEEL GAME MAP • READY');
        if(destination) addDestinationMarker();
        syncCheckpointMarkers();
        ensurePlayerMarker();
        if(latestPosition) renderRoutePosition(latestPosition);
        if(navigationTarget) updateNavigation(latestPosition);
      });
      map.on('error',evt=>{
        console.error('[BARAMEEL MAP ERROR]',evt?.error||evt);
        if(!mapReady&&!mapLoadFailed){
          mapLoadFailed=true;
          setMapStatus('GAME MAP LOAD FAILED',true);
          status.textContent='MAP STYLE FAILED — RETRY';
          status.classList.add('route-error');
        }
      });
      map.on('resize',()=>{});
    }catch(err){
      console.error('[BARAMEEL MAP INIT ERROR]',err);
      map=null;
      mapLoadFailed=true;
      setMapStatus('GAME MAP INIT FAILED',true);
      status.textContent='MAP START FAILED — RETRY';
      status.classList.add('route-error');
    }
  }
  function waitForMap(timeout=8000){
    if(mapReady)return Promise.resolve(true);
    if(!map)return Promise.resolve(false);
    return new Promise(resolve=>{
      let done=false;
      const timer=setTimeout(()=>{if(!done){done=true;resolve(false)}},timeout);
      map.once('load',()=>{if(!done){done=true;clearTimeout(timer);resolve(true)}});
    });
  }
  function renderRoutePosition(pos){
    latestPosition=pos;
    if(!mapReady)return;
    ensurePlayerMarker();
    if(!didInitialCenter){
      map.easeTo({center:[pos.lng,pos.lat],zoom:16,duration:350});
      didInitialCenter=true;
    }
  }
  function addRouteSourceAndLayer(){
    if(!mapReady||map.getSource('walking-route'))return;
    map.addSource('walking-route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
    map.addLayer({
      id:'walking-route-line',
      type:'line',
      source:'walking-route',
      layout:{'line-cap':'round','line-join':'round'},
      paint:{'line-color':'#ef2d24','line-width':5,'line-opacity':.92,'line-dasharray':[2.2,1.4]}
    });
  }
  function setRouteGeometry(geometry){
    if(!mapReady||!geometry)return;
    addRouteSourceAndLayer();
    map.getSource('walking-route').setData({type:'Feature',properties:{},geometry});
  }
  async function buildWalkingRoute(origin,target){
    if(!origin||!target)return false;
    const url='https://routing.openstreetmap.de/routed-foot/route/v1/driving/'+origin.lng+','+origin.lat+';'+target.lng+','+target.lat+'?overview=full&geometries=geojson&steps=true';
    try{
      const res=await fetch(url,{headers:{Accept:'application/json'},cache:'no-store'});
      if(!res.ok)throw new Error('ROUTER_'+res.status);
      const data=await res.json();
      const route=data?.routes?.[0];
      if(!route?.geometry?.coordinates?.length)throw new Error('NO_WALKING_ROUTE');
      await waitForMap();
      if(!mapReady)throw new Error('MAP_NOT_READY');
      setRouteGeometry(route.geometry);
      navigationSteps=Array.isArray(route.legs?.[0]?.steps)?route.legs[0].steps:[];
      lastRouteAt=Date.now();
      lastRoutePosition={...origin};
      navOverlay.classList.add('active');
      navCompass.classList.add('active');
      navDirection.textContent='START WALKING';
      navDistance.textContent=formatDistance(Number(route.distance||0));
      status.textContent='WALKING NAVIGATION • FOLLOW THE ROUTE';
      status.classList.remove('route-error');
      setMapStatus('WALKING TO '+navigationTarget.name);
      if(!routeHasFit){
        const bounds=new maplibregl.LngLatBounds();
        for(const c of route.geometry.coordinates)bounds.extend(c);
        map.fitBounds(bounds,{padding:{top:150,bottom:230,left:30,right:30},duration:500,maxZoom:17});
        routeHasFit=true;
      }
      return true;
    }catch(e){
      console.error('[BARAMEEL WALKING ROUTE]',e);
      navOverlay.classList.remove('active');
      navCompass.classList.remove('active');
      status.textContent='WALKING ROUTE UNAVAILABLE — USE MAP';
      status.classList.add('route-error');
      return false;
    }
  }
  function enterCheckpointHotspot(cp){
    if(!cp)return;
    next.textContent=cp.name;
    distance.textContent='YOU ARE HERE';
    status.textContent='CHECKPOINT READY • OPEN SCANNER';
    status.classList.remove('route-error');
    setAction(true,'Open Checkpoint Scanner');
    action.onclick=()=>{
      const url=TEST_MODE
        ? 'checkpoint-scanner.html?v=20261008-2&test=1&cp='+encodeURIComponent(cp.id)
        : 'checkpoint-scanner.html?v=20261008-2';
      BR.goAfter(url,'scan',220);
    };
  }
  function updateNavigation(pos){
    if(!navigationStarted||!navigationTarget||!pos)return;
    const remaining=haversine(pos,navigationTarget);
    next.textContent=navigationTarget.name;
    distance.textContent=formatDistance(remaining);
    const upcoming=nearestUpcomingStep(pos);
    if(upcoming){
      navDirection.textContent=routeInstruction(upcoming.step);
      navDistance.textContent=upcoming.distance<=10?'NOW':'IN '+formatDistance(upcoming.distance);
    }
    if(lastRoutePosition){
      const moved=haversine(lastRoutePosition,pos);
      if(moved>4){
        navCompass.style.transform='translate(-50%,-50%) rotate('+bearing(lastRoutePosition,pos)+'deg)';
        lastRoutePosition={...pos};
      }
    }
    if(navigationTarget.id!=='barameel'&&remaining<=Math.max(5,navigationTarget.radius_meters||CHECKPOINT_HOTSPOT_RADIUS)){
      navigationStarted=false;
      enterCheckpointHotspot(navigationTarget);
      return;
    }
    if(navigationTarget.id==='barameel'&&remaining<=Math.max(10,navigationTarget.radius_meters||120)){
      status.textContent='BARAMEEL AREA REACHED • ARRIVE';
      status.classList.remove('route-error');
      setAction(false);
      startNavCard.textContent='ENTER BARAMEEL';
      startNavCard.onclick=()=>BR.goAfter('barameel-final-zone.html','confirm',240);
      navDirection.textContent='BARAMEEL';
      navDistance.textContent='YOU ARE HERE';
      return;
    }
    action.classList.remove('ready');
    action.disabled=true;
    if(!lastRoutePosition||haversine(pos,lastRoutePosition)>35||Date.now()-lastRouteAt>20000)buildWalkingRoute(pos,navigationTarget);
  }
  async function startNavigation(target){
    if(!target)return;
    if(!latestPosition){requestLocation();return;}
    if(Number(latestPosition.accuracy)>80){
      status.textContent='WAITING FOR MORE ACCURATE GPS';
      setMapStatus('GPS TOO WEAK • MOVE OUTDOORS',true);
      requestLocation();
      return;
    }
    navigationTarget=target;
    navigationStarted=true;
    status.classList.remove('route-error');
    navOverlay.classList.add('active');
    navCompass.classList.add('active');
    navDirection.textContent='CALCULATING';
    navDistance.textContent='ROUTE';
    setAction(false);
    await buildWalkingRoute(latestPosition,target);
  }
  function renderRoutePositionAndState(pos){
    latestPosition=pos;
    renderRoutePosition(pos);
    current.textContent='LIVE • '+pos.lat.toFixed(5)+', '+pos.lng.toFixed(5)+' • ±'+Math.round(pos.accuracy||0)+' M';
    const acc=Number(pos.accuracy)||9999;
    if(acc<bestGpsAccuracy)bestGpsAccuracy=acc;
    setMapStatus(acc<=35?'GPS LOCKED • ±'+Math.round(acc)+' M':'GPS IMPROVING • ±'+Math.round(acc)+' M');
    if(destination){
      const bd=haversine(pos,destination);
      destDistance.textContent=formatDistance(bd);
      destTime.textContent=Math.max(1,Math.round(bd/80))+' MIN';
    }
    syncCheckpointMarkers();
    const discovered=getDiscovered();
    const unlocked=unlockedCheckpoints();
    const available=unlocked.filter(cp=>!discovered.has(cp.id)).map(cp=>({...cp,distance:haversine(pos,cp)})).sort((a,b)=>a.distance-b.distance);
    const done=checkpoints.filter(cp=>discovered.has(cp.id)).length;
    fill.style.width=(checkpoints.length?Math.round(done/checkpoints.length*100):0)+'%';
    BR.mergePlayer({routeProgress:checkpoints.length?Math.round(done/checkpoints.length*100):0,routeDistance:available[0]?.distance??null,nextCheckpoint:available[0]?.id??null});
    if(navigationStarted){updateNavigation(pos);return;}
    if(TEST_MODE&&TEST_INSTANT){
      const cp=checkpoints.find(x=>String(x.id).toUpperCase()===TEST_CP_ID);
      if(cp){next.textContent=cp.name;distance.textContent='0 M • YOU ARE HERE';enterCheckpointHotspot(cp);}
      return;
    }
    if(TEST_MODE&&TEST_APPROACH){return;}
    if(available.length){
      next.textContent=available[0].name;
      distance.textContent=formatDistance(available[0].distance);
      if(available[0].distance<=Math.max(5,available[0].radius_meters||CHECKPOINT_HOTSPOT_RADIUS)){
        enterCheckpointHotspot(available[0]);
      }else{
        status.textContent=available.length===1?'CHECKPOINT AVAILABLE':'NEAREST CHECKPOINT • '+available.length+' AVAILABLE';
        status.classList.remove('route-error');
        action.onclick=()=>startNavigation(available[0]);
        setAction(true,'Start Walking Navigation to Checkpoint');
      }
      return;
    }
    if(destination){
      const d=haversine(pos,destination);
      next.textContent='BARAMEEL';
      distance.textContent=formatDistance(d);
      status.textContent='BARAMEEL AVAILABLE ANYTIME';
      status.classList.remove('route-error');
      startNavCard.textContent='START NAVIGATION';
      startNavCard.onclick=()=>startNavigation(destination);
      setAction(false);
      return;
    }
    next.textContent='ROUTE COMPLETE';
    distance.textContent='—';
    status.textContent='CHECKPOINT RUN COMPLETE';
    setAction(false);
  }
  function refreshPosition(pos){
    const normalized={lat:Number(pos.lat),lng:Number(pos.lng),accuracy:Number.isFinite(Number(pos.accuracy))?Number(pos.accuracy):9999};
    if(latestPosition&&normalized.accuracy>bestGpsAccuracy+25&&haversine(normalized,latestPosition)>35)return;
    renderRoutePositionAndState(normalized);
    loadLivePlayers(normalized).catch(()=>{});
  }
  function routeError(message){
    current.textContent='LOCATION UNAVAILABLE';
    next.textContent='—';
    distance.textContent='—';
    fill.style.width='0%';
    status.textContent=message;
    status.classList.add('route-error');
    setMapStatus('GPS ERROR',true);
    setAction(true,'Try GPS Again');
    action.onclick=()=>requestLocation();
  }
  function testPosition(){
    const cp=checkpoints.find(x=>x.id===TEST_CP_ID);
    return cp?{lat:cp.lat,lng:cp.lng,accuracy:5}:null;
  }
  function startTestApproach(){
    const target=testPosition();
    if(!target){routeError('TEST CHECKPOINT NOT FOUND');return;}
    if(testApproachTimer)clearInterval(testApproachTimer);
    let remaining=55;
    status.textContent='TEST MODE • APPROACHING '+TEST_CP_ID;
    refreshPosition({lat:target.lat+remaining/111320,lng:target.lng,accuracy:5});
    testApproachTimer=setInterval(()=>{
      remaining=Math.max(0,remaining-5);
      refreshPosition({lat:target.lat+remaining/111320,lng:target.lng,accuracy:5});
      if(remaining<=0){
        clearInterval(testApproachTimer);
        testApproachTimer=null;
        enterCheckpointHotspot(checkpoints.find(x=>x.id===TEST_CP_ID));
      }
    },650);
  }
  function requestLocation(){
    if(TEST_MODE){
      if(TEST_APPROACH){startTestApproach();return;}
      const p=testPosition();
      if(!p){routeError('TEST CHECKPOINT NOT FOUND');return;}
      refreshPosition(p);
      return;
    }
    if(!navigator.geolocation){routeError('LOCATION NOT SUPPORTED');return;}
    if(locationTimer)clearTimeout(locationTimer);
    status.textContent='LOCATING YOUR ROUTE…';
    current.textContent='WAITING FOR GPS…';
    setMapStatus('LOCATING GPS…');
    locationTimer=setTimeout(()=>{
      if(!latestPosition){
        status.textContent='GPS IS TAKING TOO LONG — TAP LOCATE';
        setAction(true,'Try GPS Again');
        action.onclick=()=>requestLocation();
      }
    },8000);
    try{
      navigator.geolocation.getCurrentPosition(
        p=>{
          if(locationTimer)clearTimeout(locationTimer);
          refreshPosition({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy});
          startWatching();
        },
        err=>{
          if(locationTimer)clearTimeout(locationTimer);
          const msg=err?.code===1?'LOCATION PERMISSION REQUIRED':err?.code===2?'GPS POSITION UNAVAILABLE':'GPS TIMEOUT';
          routeError(msg);
        },
        {enableHighAccuracy:true,timeout:20000,maximumAge:0}
      );
    }catch(err){
      if(locationTimer)clearTimeout(locationTimer);
      console.error('[BARAMEEL GEOLOCATION START ERROR]',err);
      routeError('GPS START FAILED');
    }
  }
  function startWatching(){
    if(watchId||!navigator.geolocation)return;
    watchId=navigator.geolocation.watchPosition(
      p=>refreshPosition({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy}),
      ()=>{status.textContent='GPS SIGNAL WEAK — KEEP LOCATION ON';},
      {enableHighAccuracy:true,maximumAge:0,timeout:20000}
    );
  }

  document.getElementById('mapLocate').onclick=()=>{
    if(latestPosition&&mapReady)map.easeTo({center:[latestPosition.lng,latestPosition.lat],zoom:18,duration:500});
    else requestLocation();
  };
  document.getElementById('mapNorth').onclick=()=>{if(mapReady)map.easeTo({bearing:0,duration:300});};
  startNavCard.onclick=()=>{if(latestPosition&&destination)startNavigation(destination);else requestLocation();};

  try{
    initMap(destination||{lat:31.190520,lng:29.920547});
    if(!TEST_MODE)Promise.resolve().then(()=>BR.syncPlayer()).catch(()=>null);
    if(destination){
      destDistance.textContent='—';
      destTime.textContent='—';
    }
    setAction(false);
    requestLocation();
  }catch(err){
    console.error('[BARAMEEL ROUTE BOOT]',err);
    setMapStatus('ROUTE BOOT FAILED',true);
    status.textContent='ROUTE BOOT FAILED';
    status.classList.add('route-error');
    setAction(true,'Retry Route');
    action.onclick=()=>location.reload();
  }

  setInterval(()=>{
    if(latestPosition)loadLivePlayers(latestPosition).catch(()=>{});
  },10000);

  window.addEventListener('pagehide',()=>{
    if(watchId&&navigator.geolocation)navigator.geolocation.clearWatch(watchId);
    if(testApproachTimer)clearInterval(testApproachTimer);
  });
  Promise.resolve(BR.track?.('checkpoint_route_view')).catch(()=>{});

  if(TEST_MODE){
    document.title='BARAMEEL RUN — CHECKPOINT RUN — TEST';
    status.textContent='TEST MODE • '+TEST_CP_ID+(TEST_INSTANT?' • CHECKPOINT REACHED':TEST_APPROACH?' • APPROACH SIMULATION':' • SIMULATED');
  }
})();
</script>
