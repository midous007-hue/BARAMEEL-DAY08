<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><link rel="stylesheet" href="./barameel-flow.css?v=20261003-1"><script src="./config.js?v=20261003-1"></script></head><body><main class="flow-stage" style="aspect-ratio:955/1647"><img class="flow-art" src="./assets/run/receipt-code.webp" alt="BARAMEEL RUN" fetchpriority="high"><div class="arcade-shine"></div><button id="back" class="flow-hit" style="left:3%;top:1%;width:19%;height:6%" aria-label="Back"></button><input id="receiptCode" class="flow-input" style="left:20.5%;top:71.9%;width:66%;height:4.1%;padding:0 2%" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" aria-label="Receipt code"><button id="continue" class="flow-hit" style="left:17%;top:76.5%;width:66%;height:7%" aria-label="Continue"></button><button id="without" class="flow-hit" style="left:18%;top:84%;width:64%;height:6.5%" aria-label="Continue without code"></button><div id="message" class="flow-data flow-small" style="left:16%;top:70%;width:68%;text-align:center"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js?v=20261003-1"></script><script src="./barameel-flow.js?v=20261003-1"></script><script>const input=document.getElementById('receiptCode'),msg=document.getElementById('message');input.addEventListener('input',()=>input.value=input.value.toUpperCase().replace(/[^A-Z0-9-]/g,''));document.getElementById('back').onclick=()=>BARAMEEL_FLOW.go('run-complete.html','back');document.getElementById('without').onclick=()=>BARAMEEL_FLOW.go('your-barameel-drop.html','confirm');document.getElementById('continue').onclick=async()=>{const code=input.value.trim();if(!code){msg.textContent='ENTER YOUR RECEIPT CODE OR CONTINUE WITHOUT CODE';BARAMEEL_FLOW.fx('error');input.focus();return}msg.textContent='VERIFYING CODE…';BARAMEEL_FLOW.fx('scan');let r=null;try{r=await BR.api('/receipt-draw',{receipt_code:code,idempotency_key:'receipt-'+crypto.randomUUID()})}catch{}if(r?.ok){try{sessionStorage.setItem('barameelReceiptReward',JSON.stringify(r))}catch{}BARAMEEL_FLOW.go('verifying-code.html','confirm',320)}else{msg.textContent=(r?.code||r?.error||'CODE NOT AVAILABLE').replaceAll('_',' ');BARAMEEL_FLOW.fx('error')}};input.focus();</script></body></html>
