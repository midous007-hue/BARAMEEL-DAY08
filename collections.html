<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><link rel="stylesheet" href="./barameel-flow.css?v=20261003-1"><script src="./config.js?v=20261003-1"></script></head><body><main class="flow-stage"><img class="flow-art" src="./assets/collections.webp" alt="BARAMEEL RUN" fetchpriority="high"><div class="arcade-shine"></div><button id="back" class="flow-hit" style="left:3%;top:1%;width:19%;height:6%" aria-label="Back"></button><select id="collectionSelect" class="flow-select" style="left:34%;top:31.5%;width:32%;height:7%"><option value="collection01">ALEXANDRIA</option></select><div id="grid" style="position:absolute;left:10%;top:45%;width:80%;height:30%;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);gap:2.4%"></div><button id="cta" class="flow-hit" style="left:10%;top:88%;width:80%;height:7%" aria-label="Collection Rewards"></button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js?v=20261003-1"></script><script src="./barameel-flow.js?v=20261003-1"></script><script>(async()=>{try{const cfg=await BR.fetchCollection('collection01'),im=cfg.images?.[0];if(im?.masterFile){const src='./'+String(im.masterFile).replace(/^\.\//,'').replace(/\.png$/i,'.webp'),img=new Image();img.src=src;img.decoding='async';await img.decode().catch(()=>{});for(let n=0;n<9;n++){const b=document.createElement('div');b.style.cssText='border:2px solid #f4c52f;border-radius:7px;background:#071b2b center/300% 300% no-repeat;opacity:.95';const p=im.pieces[n];if(p){b.style.backgroundImage='url("'+img.src+'")';b.style.backgroundPosition=((p.column-1)*50)+'% '+((p.row-1)*50)+'%'}document.getElementById('grid').appendChild(b)}}}catch{}})();document.getElementById('back').onclick=()=>BARAMEEL_FLOW.go('screen06.html','back');document.getElementById('cta').onclick=()=>BARAMEEL_FLOW.go('route-map.html','tap');</script></body></html>
