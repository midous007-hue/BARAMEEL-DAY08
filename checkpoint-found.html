<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BARAMEEL RUN — CHECKPOINT CLEARED</title>
<link rel="stylesheet" href="./barameel-flow.css?v=20261008-27.0"><script src="./config.js?v=20261008-27.0"></script>
<style>
.checkpoint-value{position:absolute;z-index:25;display:flex;align-items:center;justify-content:center;color:#f6e7ce;font-family:'Roboto Condensed','Arial Narrow',Arial,sans-serif;font-weight:900;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;pointer-events:none}
#checkpointName{left:42.57%;top:50.30%;width:47.10%;height:4.52%;font-size:clamp(12px,2.9vw,22px)}
#checkpointPoints{left:44.05%;top:61.04%;width:45.31%;height:4.52%;font-family:'Bebas Neue','Roboto Condensed',Arial,sans-serif;font-size:clamp(21px,6vw,46px);color:#f4c52f;text-shadow:2px 2px 0 #071b2b}
#checkpointTotal{position:absolute;left:42.68%;top:71.41%;width:14.75%;height:3.02%;z-index:26;display:flex;align-items:center;justify-content:center;color:#f6e7ce;font:900 clamp(9px,2.2vw,16px)/1 'Roboto Condensed',Arial,sans-serif;text-transform:uppercase;text-shadow:1px 1px 0 #071b2b;pointer-events:none}
#checkpointMarks{position:absolute;left:69.55%;top:71.47%;width:20.02%;height:3.02%;z-index:26;display:flex;align-items:center;justify-content:center;color:#f4c52f;font:900 clamp(9px,2.2vw,16px)/1 'Roboto Condensed',Arial,sans-serif;text-transform:uppercase;text-shadow:1px 1px 0 #071b2b;pointer-events:none}
.action-hit{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;z-index:40}
#continue{left:15.28%;top:77.81%;width:79.56%;height:8.63%}
#wallet{left:12.96%;top:87.52%;width:38.57%;height:6.70%}
#myRun{left:52.69%;top:87.52%;width:40.89%;height:6.70%}
</style></head>
<body><main class="flow-stage art-949x1658">
<img class="flow-art" src="./assets/checkpoint-found.webp?v=20261008-27.0" alt="CHECKPOINT CLEARED" fetchpriority="high">
<div id="checkpointName" class="checkpoint-value">CHECKPOINT</div><div id="checkpointPoints" class="checkpoint-value">0</div>
<div id="checkpointTotal">TOTAL POINTS —</div><div id="checkpointMarks">MARKS —</div>
<button id="continue" class="action-hit" aria-label="Continue checkpoint run"></button>
<button id="wallet" class="action-hit" aria-label="Open Marks Wallet"></button>
<button id="myRun" class="action-hit" aria-label="Open My Run"></button>
<button id="back" class="flow-hit" style="left:3%;top:1%;width:19%;height:6%" aria-label="Back to Route"></button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js?v=20261008-27.0"></script>
<script>
(async()=>{
 let result=null;try{result=JSON.parse(BR.safeSession.get('barameelCheckpointResult')||'null')}catch{}
 const name=document.getElementById('checkpointName'),points=document.getElementById('checkpointPoints'),total=document.getElementById('checkpointTotal'),marks=document.getElementById('checkpointMarks');
 if(!result?.ok){
  name.textContent='CHECKPOINT RESULT UNAVAILABLE';points.textContent='—';
  document.getElementById('continue').onclick=()=>BR.goAfter('route-map.html','back',180);
 }else{
  name.textContent=String(result.checkpoint_name||result.name||result.checkpoint_id||'CHECKPOINT').toUpperCase();
  points.textContent='+'+Number(result.points_awarded||0).toLocaleString();
  total.textContent='TOTAL POINTS '+Number(BR.state?.points||0).toLocaleString();
  try{const wallet=await BR.api('/wallet',{});if(wallet?.ok)marks.textContent='MARKS '+Number(wallet.marks??wallet.marks_total??0).toLocaleString()}catch{}
  BR.haptic('reward');BR.play('confirm');BR.flash();BR.track('checkpoint_cleared',{checkpoint_id:result.checkpoint_id,points:result.points_awarded});
  document.getElementById('continue').onclick=()=>{BR.safeSession.remove('barameelCheckpointResult');BR.goAfter('route-map.html','confirm',220)};
  document.getElementById('wallet').onclick=()=>{BR.safeSession.remove('barameelCheckpointResult');BR.safeSession.set('barameelRewardsParent','route-map.html');BR.goAfter('marks-wallet.html','confirm',220)};
 }
 document.getElementById('myRun').onclick=()=>{BR.safeSession.remove('barameelCheckpointResult');BR.safeSession.set('barameelRewardsParent','screen04.html');BR.goAfter('screen04.html','tap',220)};
 document.getElementById('back').onclick=()=>{BR.safeSession.remove('barameelCheckpointResult');BR.goAfter('route-map.html','back',180)};
})();
</script></body></html>
