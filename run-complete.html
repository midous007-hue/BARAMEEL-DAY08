<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><link rel="stylesheet" href="./barameel-flow.css?v=20261004-23.1"><script src="./config.js?v=20261004-23.1"></script></head><body><main class="flow-stage"><img class="flow-art" src="./assets/run-complete.webp?v=20261004-23.1" alt="BARAMEEL RUN" fetchpriority="high"><div class="arcade-shine"></div><button id="back" class="flow-hit" style="left:3%;top:1%;width:19%;height:6%" aria-label="Back"></button><div id="route" class="flow-data flow-number" style="left:7%;top:59%;width:18%;text-align:center">—</div><div id="check" class="flow-data flow-number" style="left:29%;top:59%;width:18%;text-align:center">—</div><div id="pts" class="flow-data flow-number" style="left:51%;top:59%;width:18%;text-align:center">—</div><div id="marks" class="flow-data flow-number" style="left:73%;top:59%;width:18%;text-align:center">—</div><button id="barameel" class="flow-hit" style="left:7.6%;top:80.8%;width:84.8%;height:9.8%" aria-label="View Leaderboard"></button><button id="keep" class="flow-hit" style="left:21.9%;top:91%;width:56.1%;height:5.2%" aria-label="Back to World"></button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js?v=20261004-23.1"></script><script src="./barameel-flow.js?v=20261004-23.1"></script><script>(async()=>{const s=BR.state||{},done=(s.checkpoints||[]).length;const routeProgress=Number.isFinite(Number(s.routeProgress))?Math.max(0,Math.min(100,Number(s.routeProgress))):null;if(routeProgress!==null)document.getElementById('route').textContent=Math.round(routeProgress)+'%';if(Number.isFinite(Number(done)))document.getElementById('check').textContent=done;if(Number.isFinite(Number(s.points)))document.getElementById('pts').textContent=Number(s.points).toLocaleString();try{const r=await BR.api('/wallet',{});if(r?.ok&&Number.isFinite(Number(r.marks??r.marks_
