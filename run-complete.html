<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BARAMEEL RUN — CHECKPOINT COMPLETE</title>
<link rel="stylesheet" href="./barameel-flow.css?v=20261005-23.3">
<script src="./config.js?v=20261005-23.3"></script>
<style>
.summary-value{position:absolute;z-index:25;display:flex;align-items:center;justify-content:center;color:#071b2b;font:900 clamp(15px,4vw,30px)/1 'Bebas Neue',Impact,sans-serif;text-align:center;white-space:nowrap;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.12)}
#route{left:7.5%;top:57.1%;width:23%;height:6.0%}
#check{left:38%;top:57.1%;width:22%;height:6.0%}
#pts{left:68.5%;top:57.1%;width:24%;height:6.0%}
#continue{left:7.5%;top:79.4%;width:85%;height:10.0%}
#world{left:22%;top:91.8%;width:56%;height:5.2%}
</style>
</head>
<body>
<main class="flow-stage art-948x1660">
<img class="flow-art" src="./assets/run-complete.webp?v=20261005-23.3" alt="CHECKPOINT RUN COMPLETE" fetchpriority="high">
<div id="route" class="summary-value">—</div>
<div id="check" class="summary-value">—</div>
<div id="pts" class="summary-value">—</div>
<button id="back" class="flow-hit" style="left:3%;top:1%;width:19%;height:6%" aria-label="Back"></button>
<button id="continue" class="flow-hit" aria-label="View Live Top 20"></button>
<button id="world" class="flow-hit" aria-label="Back to Barameel World"></button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js?v=20261005-23.3"></script>
<script>
(async()=>{
  await BR.syncPlayer().catch(()=>null);
  const backBtn=document.getElementById('back'),continueBtn=document.getElementById('continue'),worldBtn=document.getElementById('world');
  backBtn.onclick=()=>{const parent=BR.safeSession.get('barameelRunCompleteReturn')||'route-map.html';BR.goAfter(parent,'back',180)};
  continueBtn.onclick=()=>{BR.safeSession.remove('barameelRunCompleteReturn');BR.safeSession.remove('checkpointRunStartPoints');BR.goAfter('leaderboard.html','confirm',220)};
  worldBtn.onclick=()=>{BR.safeSession.remove('barameelRunCompleteReturn');BR.safeSession.remove('checkpointRunStartPoints');BR.goAfter('world.html','tap',180)};
  const state=BR.state||{},checkpointCount=Array.isArray(state.checkpoints)?state.checkpoints.length:0;const baseline=Number(BR.safeSession.get('checkpointRunStartPoints'));const pointsEarned=Number.isFinite(baseline)?Math.max(0,Number(state.points||0)-baseline):Number(state.points||0);
  const route=Number.isFinite(Number(state.routeProgress))?Math.round(Number(state.routeProgress))+'%':'—';
  document.getElementById('route').textContent=route;
  document.getElementById('check').textContent=String(checkpointCount);
  document.getElementById('pts').textContent=pointsEarned.toLocaleString();
  BR.playCompletionSound();BR.haptic('reward');BR.track('checkpoint_run_complete_view',{checkpoints:checkpointCount,points_earned:pointsEarned,total_points:Number(state.points||0)});
BR.safeSession.remove('checkpointRunStartPoints');BR.goAfter('world.html','tap',180)};
})();
</script>
</body>
</html>
