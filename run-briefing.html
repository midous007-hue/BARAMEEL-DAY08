<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071b2b">
<meta name="description" content="BARAMEEL RUN — Stage briefing">
<title>BARAMEEL RUN — YOUR RUN BRIEFING</title>
<link rel="stylesheet" href="./styles.css?v=20261010-briefing-1">
<script src="./config.js?v=20261010-briefing-1"></script>
<style>
:root{color-scheme:dark}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b2b}
.briefing-stage{position:relative;width:min(100vw,calc(100dvh*948/1659));height:min(100dvh,calc(100vw*1659/948));aspect-ratio:948/1659;margin:auto;overflow:hidden;background:#071b2b;isolation:isolate;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.briefing-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none;pointer-events:none}
.compass-assembly{position:absolute;left:50.2%;top:35.5%;width:39%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:12;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.42))}
.compass-core{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:rotate(0deg);transform-origin:50% 50%;will-change:transform;backface-visibility:hidden;transition:transform .12s linear}
.briefing-back{position:absolute;left:3%;top:1%;width:19%;height:4.7%;z-index:30;border:0;background:transparent;border-radius:22%;cursor:pointer}
.briefing-cta{position:absolute;left:8%;top:92.1%;width:84%;height:5.7%;z-index:30;border:0;background:transparent;border-radius:999px;cursor:pointer;touch-action:manipulation}
.briefing-cta:active{transform:scale(.985);filter:brightness(1.12)}
.stat-value{position:absolute;z-index:20;display:flex;align-items:center;justify-content:center;color:#fff2d9;font:900 clamp(15px,4.2vw,32px)/1 'Roboto Condensed',Impact,Arial,sans-serif;text-shadow:0 2px 0 #071b2b,0 0 5px rgba(0,0,0,.8);pointer-events:none;white-space:nowrap}
.stat-checkpoints{left:6.8%;top:52.1%;width:27.7%;height:2.5%}
.stat-points{left:36.4%;top:52.1%;width:27.4%;height:2.5%}
.stat-progress{left:66.5%;top:52.1%;width:27.2%;height:2.5%}
.briefing-toast{position:absolute;z-index:40;left:15%;right:15%;top:31.5%;padding:10px 14px;border:2px solid #f6c532;border-radius:12px;background:rgba(7,27,43,.96);color:#fff2d9;text-align:center;font:800 clamp(11px,2.8vw,17px)/1.2 'Roboto Condensed',Arial,sans-serif;opacity:0;transform:translateY(5px);transition:opacity .18s,transform .18s;pointer-events:none}
.briefing-toast.show{opacity:1;transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.compass-core{transition:none!important}.briefing-toast{transition:none}}

/* Stage 01 paper-map reveal: layered parchment, tactile fold/unfold, accessible controls. */
.paper-map-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at center,rgba(16,27,29,.62),rgba(1,8,13,.94));opacity:0;visibility:hidden;pointer-events:none;perspective:1400px;transition:opacity .35s,visibility .35s}
.paper-map-overlay.is-open{opacity:1;visibility:visible;pointer-events:auto}
.paper-map-shell{position:relative;width:min(96vw,1000px);max-height:90dvh;aspect-ratio:1535/1023;transform:translateY(24px) rotateX(9deg) scale(.82);transform-origin:center;opacity:0;filter:drop-shadow(0 24px 28px rgba(0,0,0,.65));transition:transform .78s cubic-bezier(.16,1,.3,1),opacity .45s;}
.paper-map-overlay.is-open .paper-map-shell{transform:translateY(0) rotateX(0) scale(1);opacity:1}
.paper-map-image{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;touch-action:none;cursor:grab;transform-origin:center;transition:transform .18s ease;filter:sepia(.06) saturate(.94)}
.paper-map-image:active{cursor:grabbing}
.paper-map-fold{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:0;transform-style:preserve-3d}
.paper-map-fold:before,.paper-map-fold:after{content:"";position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,rgba(28,13,4,.18),rgba(255,227,158,.12) 48%,rgba(22,13,4,.32));box-shadow:inset 0 0 18px rgba(20,10,2,.28);backface-visibility:hidden}
.paper-map-fold:before{left:0;transform-origin:left center;transform:rotateY(0)}.paper-map-fold:after{right:0;transform-origin:right center;transform:rotateY(0)}
.paper-map-overlay.is-opening .paper-map-fold{opacity:1}.paper-map-overlay.is-opening .paper-map-fold:before{animation:mapUnfoldLeft .82s cubic-bezier(.2,.75,.18,1) both}.paper-map-overlay.is-opening .paper-map-fold:after{animation:mapUnfoldRight .82s cubic-bezier(.2,.75,.18,1) both}
.paper-map-overlay.is-closing .paper-map-shell{transform:translateY(22px) rotateX(7deg) scale(.86);opacity:0;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
.paper-map-overlay.is-closing .paper-map-fold{opacity:1}.paper-map-overlay.is-closing .paper-map-fold:before{animation:mapFoldLeft .48s ease-in both}.paper-map-overlay.is-closing .paper-map-fold:after{animation:mapFoldRight .48s ease-in both}
@keyframes mapUnfoldLeft{0%{clip-path:inset(0 0 0 0);transform:perspective(800px) rotateY(76deg);filter:brightness(.55)}65%{transform:perspective(800px) rotateY(-7deg);filter:brightness(1.1)}100%{clip-path:inset(0);transform:perspective(800px) rotateY(0);filter:brightness(1)}}
@keyframes mapUnfoldRight{0%{clip-path:inset(0 0 0 0);transform:perspective(800px) rotateY(-76deg);filter:brightness(.5)}65%{transform:perspective(800px) rotateY(7deg);filter:brightness(1.08)}100%{clip-path:inset(0);transform:perspective(800px) rotateY(0);filter:brightness(1)}}
@keyframes mapFoldLeft{0%{transform:perspective(800px) rotateY(0)}100%{transform:perspective(800px) rotateY(76deg)}}@keyframes mapFoldRight{0%{transform:perspective(800px) rotateY(0)}100%{transform:perspective(800px) rotateY(-76deg)}}
.paper-map-close{position:absolute;right:clamp(2px,1.5vw,16px);top:clamp(2px,1.5vw,16px);z-index:5;width:clamp(40px,5.3vw,58px);height:clamp(40px,5.3vw,58px);border:2px solid #ffe3bd;border-radius:50%;background:linear-gradient(145deg,#f04435,#a90d16);color:#fff7e8;font:900 clamp(24px,3vw,34px)/1 Arial,sans-serif;box-shadow:0 3px 0 #5e0b10,0 5px 14px #0009;cursor:pointer;display:grid;place-items:center}
.paper-map-download{position:absolute;left:clamp(3px,1.5vw,18px);bottom:clamp(3px,1.5vw,18px);z-index:5;width:clamp(48px,6.5vw,68px);height:clamp(48px,6.5vw,68px);border:2px solid #f9e5b9;border-radius:50%;background:linear-gradient(145deg,#183c45,#071b2b);color:#ffe9b7;display:grid;place-items:center;box-shadow:0 3px 0 #030a0d,0 5px 14px #0009;cursor:pointer}
.paper-map-download svg{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.paper-map-hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:4;max-width:72%;padding:6px 10px;border:1px solid #c99d48;border-radius:999px;background:rgba(8,25,31,.88);color:#fff0cf;text-align:center;font:800 clamp(9px,2.2vw,13px)/1.15 Arial,sans-serif;pointer-events:none;white-space:nowrap}
@media(max-aspect-ratio:4/5){.paper-map-shell{width:98vw;max-height:80dvh;aspect-ratio:1535/1023}.paper-map-hint{bottom:-26px}}
@media(prefers-reduced-motion:reduce){.paper-map-overlay,.paper-map-shell,.paper-map-image{transition:none!important}.paper-map-overlay.is-opening .paper-map-fold:before,.paper-map-overlay.is-opening .paper-map-fold:after,.paper-map-overlay.is-closing .paper-map-fold:before,.paper-map-overlay.is-closing .paper-map-fold:after{animation:none!important}}

</style>
</head>
<body>
<main class="briefing-stage" id="briefingStage" aria-label="BARAMEEL RUN mission briefing">
<img class="briefing-art" src="./run-briefing.webp?v=20261010-1" alt="BARAMEEL RUN — Stage 01 mission briefing" fetchpriority="high">
<div class="compass-assembly" aria-hidden="true"><img id="compassCore" class="compass-core" src="./run-briefing-compass.webp?v=20261010-1" alt=""></div>
<div class="stat-value stat-checkpoints" id="checkpointsFound">—</div>
<div class="stat-value stat-points" id="pointsEarned">—</div>
<div class="stat-value stat-progress" id="discoveryProgress">—</div>

<button id="briefingBack" class="briefing-back" aria-label="Back to My Run"></button>
<button id="startExploring" class="briefing-cta" aria-label="Start exploring and open the route map"></button>
<div class="briefing-toast" id="briefingToast" aria-live="polite"></div>
</main>
<section class="paper-map-overlay" id="paperMapOverlay" aria-label="Stage 01 exploration map" aria-hidden="true">
 <div class="paper-map-shell" id="paperMapShell">
  <img class="paper-map-image" id="paperMapImage" src="./assets/alexandria-stage01-map.webp?v=20261010-map-1" alt="Alexandria Stage 01 paper exploration map. Thirteen checkpoint areas and Barameel are marked." draggable="false">
  <div class="paper-map-fold" aria-hidden="true"></div>
  <button class="paper-map-close" id="paperMapClose" aria-label="Close map">×</button>
  <button class="paper-map-download" id="paperMapDownload" aria-label="Download map image" title="Download map">
   <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"/></svg>
  </button>
  <div class="paper-map-hint">PINCH / TAP TO ZOOM · DRAG TO EXPLORE</div>
 </div>
</section>

<script src="./app.js?v=20261010-audio-boost-1"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const compass = $('compassCore');
  const toast = $('briefingToast');
  let toastTimer = 0;
  function showToast(message){
    toast.textContent=message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toast.classList.remove('show'),2200);
  }
  function checkpointIds(value){
    if(!Array.isArray(value)) return new Set();
    const ids = new Set();
    for(const item of value){
      const raw = typeof item === 'string' ? item : (item?.location_id || item?.checkpoint_id || item?.checkpointId || item?.id || item?.locationId || '');
      const match = String(raw).toUpperCase().match(/CP\d{2}/);
      if(match) ids.add(match[0]);
    }
    return ids;
  }
  function renderProgress(){
    const state=BR.state||{};
    const ids=checkpointIds(state.checkpoints);
    const count=ids.size;
    $('checkpointsFound').textContent=String(count);
    $('pointsEarned').textContent=Number(state.points||0).toLocaleString('en-US');
    $('discoveryProgress').textContent=count+'/13';
  }
  // Old brass compass + restrained arcade feedback. Sound is event-driven, not continuous.
  let audioContext=null,lastTickAt=0,lastHeading=null,firstHeadingTicked=false;
  function audio(){
    if(audioContext)return audioContext;
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return null;
    audioContext=new C();
    return audioContext;
  }
  function playCompassTick(strength=1){
    const c=audio();if(!c)return;
    if(c.state==='suspended')c.resume().catch(()=>{});
    const now=c.currentTime;
    try{
      // A short, warm brass/metal detent with a little mechanical body.
      const body=c.createOscillator(),bodyGain=c.createGain();
      body.type='triangle';body.frequency.setValueAtTime(390,now);body.frequency.exponentialRampToValueAtTime(245,now+.075);
      bodyGain.gain.setValueAtTime(.0001,now);bodyGain.gain.exponentialRampToValueAtTime(.38*strength,now+.004);bodyGain.gain.exponentialRampToValueAtTime(.0001,now+.105);
      body.connect(bodyGain).connect(c.destination);body.start(now);body.stop(now+.12);
      const ring=c.createOscillator(),ringGain=c.createGain();
      ring.type='sine';ring.frequency.setValueAtTime(1320,now+.004);ring.frequency.exponentialRampToValueAtTime(820,now+.095);
      ringGain.gain.setValueAtTime(.0001,now+.004);ringGain.gain.exponentialRampToValueAtTime(.20*strength,now+.009);ringGain.gain.exponentialRampToValueAtTime(.0001,now+.13);
      ring.connect(ringGain).connect(c.destination);ring.start(now+.004);ring.stop(now+.145);
      const noiseBuffer=c.createBuffer(1,Math.ceil(c.sampleRate*.035),c.sampleRate),data=noiseBuffer.getChannelData(0);
      for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);
      const noise=c.createBufferSource(),filter=c.createBiquadFilter(),ng=c.createGain();
      noise.buffer=noiseBuffer;filter.type='bandpass';filter.frequency.value=2500;filter.Q.value=1.1;
      ng.gain.setValueAtTime(.0001,now);ng.gain.exponentialRampToValueAtTime(.13*strength,now+.003);ng.gain.exponentialRampToValueAtTime(.0001,now+.04);
      noise.connect(filter).connect(ng).connect(c.destination);noise.start(now);noise.stop(now+.045);
    }catch{}
  }
  function normalizedAngle(n){return ((n%360)+360)%360}
  function angleDelta(a,b){return ((a-b+540)%360)-180}
  function headingFromEvent(e){
    if(typeof e.webkitCompassHeading==='number'&&Number.isFinite(e.webkitCompassHeading))return normalizedAngle(e.webkitCompassHeading);
    if(typeof e.alpha==='number'&&Number.isFinite(e.alpha))return normalizedAngle(360-e.alpha);
    return null;
  }
  function onOrientation(e){
    const heading=headingFromEvent(e);if(heading===null)return;
    // Rotate the compass rose opposite the phone's heading so the rose behaves like a physical compass card.
    const target=-heading;
    compass.style.transform='rotate('+target+'deg)';
    if(!firstHeadingTicked){
      playCompassTick(.9);firstHeadingTicked=true;lastTickAt=performance.now();
    }else if(lastHeading!==null){
      const delta=Math.abs(angleDelta(heading,lastHeading));
      const now=performance.now();
      if(delta>=6 && now-lastTickAt>235){
        playCompassTick(Math.min(1,Math.max(.72,delta/16)));
        lastTickAt=now;
      }
    }
    lastHeading=heading;
  }
  // Start immediately. iOS permission is requested from the Checkpoint Run tap on the previous screen.
  let listening=false;
  function startCompass(){
    const DeviceOrientation=window.DeviceOrientationEvent;
    if(!DeviceOrientation)return;
    try{
      if(window.AudioContext||window.webkitAudioContext){
        const c=audio();if(c&&c.state==='suspended')c.resume().catch(()=>{});
      }
      window.addEventListener('deviceorientation',onOrientation,true);
      if('ondeviceorientationabsolute' in window)window.addEventListener('deviceorientationabsolute',onOrientation,true);
      listening=true;
    }catch{}
  }
  startCompass();
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'){
      const c=audio();if(c&&c.state==='suspended')c.resume().catch(()=>{});
      if(!listening)startCompass();
    }
  });
  $('briefingBack').addEventListener('click',()=>BR.goAfter('screen04.html','back',180));
  const mapOverlay=$('paperMapOverlay'),mapImage=$('paperMapImage'),mapShell=$('paperMapShell');
  let mapScale=1,mapX=0,mapY=0,pointers=new Map(),pinchStart=null,dragStart=null,closeTimer=0,mapViewed=false;
  function mapSound(opening=true){
    try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();if(c.state==='suspended')c.resume().catch(()=>{});const now=c.currentTime;
      // Layered parchment flutter: soft filtered noise + low woody fold creak.
      const duration=opening?.72:.48,buffer=c.createBuffer(1,Math.ceil(c.sampleRate*duration),c.sampleRate),data=buffer.getChannelData(0);
      for(let i=0;i<data.length;i++){const t=i/data.length,envelope=opening?Math.sin(Math.PI*t)**.55:Math.sin(Math.PI*t)**.65;data[i]=(Math.random()*2-1)*envelope*(.8-.45*t)}
      const src=c.createBufferSource(),filter=c.createBiquadFilter(),gain=c.createGain();src.buffer=buffer;filter.type='bandpass';filter.frequency.setValueAtTime(opening?1250:980,now);filter.frequency.exponentialRampToValueAtTime(opening?2100:520,now+duration);filter.Q.value=.65;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.22,now+.035);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);src.connect(filter).connect(gain).connect(c.destination);src.start(now);src.stop(now+duration);
      const thump=c.createOscillator(),tg=c.createGain();thump.type='triangle';thump.frequency.setValueAtTime(opening?115:95,now);thump.frequency.exponentialRampToValueAtTime(48,now+.19);tg.gain.setValueAtTime(.0001,now);tg.gain.exponentialRampToValueAtTime(.13,now+.012);tg.gain.exponentialRampToValueAtTime(.0001,now+.22);thump.connect(tg).connect(c.destination);thump.start(now);thump.stop(now+.23);setTimeout(()=>c.close().catch(()=>{}),1200);
    }catch{}
  }
  function applyMapTransform(){mapImage.style.transform='translate('+mapX+'px,'+mapY+'px) scale('+mapScale+')'}
  function resetMapView(){mapScale=1;mapX=0;mapY=0;applyMapTransform()}
  function openPaperMap(){clearTimeout(closeTimer);resetMapView();mapOverlay.classList.remove('is-closing');mapOverlay.classList.add('is-open','is-opening');mapOverlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';mapSound(true);setTimeout(()=>mapOverlay.classList.remove('is-opening'),900);$('paperMapClose').focus({preventScroll:true})}
  function closePaperMap(){if(!mapOverlay.classList.contains('is-open'))return;mapOverlay.classList.remove('is-opening');mapOverlay.classList.add('is-closing');mapSound(false);mapOverlay.setAttribute('aria-hidden','true');closeTimer=setTimeout(()=>{mapOverlay.classList.remove('is-open','is-closing');document.body.style.overflow=''},500);$('startExploring').focus({preventScroll:true})}
  $('startExploring').addEventListener('click',()=>{if(mapViewed){BR.safeSession.set('barameelActivePath','checkpoint');BR.goAfter('route-map.html?v=20261010-briefing-1','confirm',240);return}mapViewed=true;openPaperMap()});$('paperMapClose').addEventListener('click',closePaperMap);
  mapOverlay.addEventListener('click',e=>{if(e.target===mapOverlay)closePaperMap()});
  document.addEventListener('keydown',e=>{if(!mapOverlay.classList.contains('is-open'))return;if(e.key==='Escape')closePaperMap();if(e.key==='+'||e.key==='=')setMapScale(mapScale*1.2);if(e.key==='-')setMapScale(mapScale/1.2)});
  function setMapScale(value){mapScale=Math.max(1,Math.min(4,value));if(mapScale===1){mapX=0;mapY=0}applyMapTransform()}
  mapImage.addEventListener('click',e=>{if(pointers.size>1)return;if(mapScale===1)setMapScale(1.8);else if(mapScale<2.6)setMapScale(2.8);else resetMapView()});
  mapShell.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;mapShell.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)dragStart={x:e.clientX,y:e.clientY,mapX,mapY};else if(pointers.size===2){const p=[...pointers.values()];pinchStart={distance:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),scale:mapScale}}});
  mapShell.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&pinchStart){const p=[...pointers.values()],dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);setMapScale(pinchStart.scale*dist/Math.max(1,pinchStart.distance))}else if(pointers.size===1&&dragStart&&mapScale>1){mapX=dragStart.mapX+(e.clientX-dragStart.x);mapY=dragStart.mapY+(e.clientY-dragStart.y);applyMapTransform()}});
  function endMapPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)pinchStart=null;if(!pointers.size)dragStart=null}mapShell.addEventListener('pointerup',endMapPointer);mapShell.addEventListener('pointercancel',endMapPointer);
  $('paperMapDownload').addEventListener('click',async e=>{e.stopPropagation();try{const response=await fetch(mapImage.src,{cache:'force-cache'});if(!response.ok)throw new Error('Map image unavailable');const blob=await response.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Alexandria-Barameel-Stage-01-Map.webp';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);showToast('MAP DOWNLOADED')}catch{showToast('DOWNLOAD UNAVAILABLE — PRESS AND HOLD THE MAP TO SAVE')}});


  renderProgress();
  BR.syncPlayer().then(renderProgress).catch(()=>showToast('PROGRESS COULD NOT REFRESH — SHOWING SAVED DATA'));
  BR.track('run_briefing_view');
})();
</script>
</body>
</html>
