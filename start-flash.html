<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071b2b">
<title>BARAMEEL RUN — START</title>
<link rel="stylesheet" href="./barameel-flow.css?v=20261005-23.4">
<script src="./config.js?v=20261005-23.4"></script>
</head>
<body>
<main class="flow-stage art-952">
<img class="flow-art" src="./assets/start-flash-screen.webp?v=20261005-23.4" alt="BARAMEEL RUN START" fetchpriority="high">
<div class="arcade-shine"></div>
<button id="skip" class="flow-hit" style="left:3%;top:1%;width:19%;height:6%" aria-label="Skip"></button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js?v=20261005-23.4"></script>
<script src="./barameel-flow.js?v=20261005-23.4"></script>
<script>
(() => {
  const pending = BR.safeSession.get('barameelStartFlashPending') === '1';
  const shown = BR.safeSession.get('barameelStartFlashShown') === '1';

  if (!BR.state?.runHowItWorksSeen) {
    BARAMEEL_FLOW.go('how-it-works.html', 'back', 0);
    return;
  }

  if (!pending || shown) {
    BR.safeSession.set('barameelStartFlashPending', '0');
    BARAMEEL_FLOW.go('run.html', 'tap', 0);
    return;
  }

  BR.safeSession.set('barameelStartFlashShown', '1');
  BR.safeSession.set('barameelStartFlashPending', '0');

  const go = () => BARAMEEL_FLOW.go('run.html', 'confirm', 120);
  document.getElementById('skip').onclick = go;
  BR.haptic('confirm');
  BARAMEEL_FLOW.fx('confirm');
  window.setTimeout(go, 1400);
})();
</script>
</body>
</html>
