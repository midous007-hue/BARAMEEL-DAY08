<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0e2a3d"><title>BARAMEEL RUN</title><link rel="stylesheet" href="./styles.css?v=20260930-20.8"><script src="./config.js?v=20260930-20.8"></script></head><body><main class="stage run-page"><img class="base" src="./assets/screen01-start.webp" alt="BARAMEEL RUN"><button id="runBack" class="ui-back-button" aria-label="Back to Barameel World"></button><div id="nameGuide" class="scan-message" aria-live="polite"></div><input id="nickname" class="nickname-input" maxlength="24" placeholder="TYPE YOUR NICKNAME" aria-label="Nickname"><button id="start" class="hotspot start-hotspot" aria-label="Start Run"></button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js?v=20260930-20.8"></script><script>const i=document.getElementById('nickname');i.value=BR.state.nickname||'';i.oninput=()=>BR.setNickname(i.value);document.getElementById('runBack').onclick=()=>BR.goAfter('world.html','back',220);document.getElementById('start').onclick=()=>{if(!i.value.trim()){BR.play('error');const g=document.getElementById('nameGuide');g.textContent='TYPE YOUR NICKNAME FIRST';g.classList.add('show','error');i.focus();setTimeout(()=>g.classList.remove('show'),2200);return}BR.setNickname(i.value);BR.track('run_start');BR.goAfter('screen02.html','confirm',220)};BR.track('run_view');</script></body></html>
