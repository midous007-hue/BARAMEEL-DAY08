<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e2a3d">
<title>BARAMEEL RUN</title>
<link rel="stylesheet" href="./styles.css?v=20261011-run-engine-5">
<script src="./config.js?v=20261005-23.4"></script>
<style>
.run-engine-stage{isolation:isolate;overflow:hidden}
.run-engine-stage .run-car-frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:0}
.run-engine-stage .run-car-on{z-index:2;pointer-events:none;transition:opacity .16s ease}
.run-engine-stage .run-bruna-overlay{position:absolute;left:16%;top:27%;width:67%;height:55%;object-fit:contain;object-position:center bottom;z-index:4;pointer-events:none;user-select:none;-webkit-user-drag:none}
.run-engine-stage #runBack,.run-engine-stage #nickname,.run-engine-stage #start,.run-engine-stage #nameGuide{z-index:10}
.run-engine-stage #nameGuide{left:17%!important;right:17%!important;top:69.0%!important;width:66%!important;min-height:5.4%!important;padding:1.8% 3%!important;border:1.5px solid rgba(244,197,47,.82)!important;background:rgba(7,27,43,.84)!important;box-shadow:3px 3px 0 rgba(7,27,43,.8),0 0 0 1px rgba(239,45,36,.65)!important;border-radius:15px 15px 15px 4px!important;color:#fff4db!important;font-family:'Roboto Condensed','Arial Narrow',Arial,sans-serif!important;font-size:clamp(14px,3.8vw,23px)!important;font-weight:900;line-height:1.16!important;letter-spacing:.015em!important;text-shadow:1px 1px 0 rgba(7,27,43,.9)!important;text-align:center!important;opacity:0;transform:translateY(5px);transition:opacity .25s ease,transform .25s ease;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.run-engine-stage #nameGuide.show{opacity:1;transform:translateY(0)}
.run-engine-stage #nameGuide.error{left:18%!important;right:18%!important;width:64%!important;top:69%!important;min-height:5.4%!important;padding:1.5% 3%!important;border:2px solid #f05a42!important;background:rgba(7,26,32,.94)!important;box-shadow:0 3px 0 rgba(0,0,0,.3)!important;border-radius:12px!important;color:#fff0bd!important;font-size:clamp(11px,2.8vw,17px)!important;text-shadow:none!important}
@media(prefers-reduced-motion:reduce){.run-engine-stage .run-car-on{transition:none}}
</style>
</head>
<body>
<main class="stage run-page run-engine-stage">
<img class="base run-car-frame" id="runCarFrame" src="./assets/run-car-lights-off.webp?v=20261011-run-engine-1" alt="BARAMEEL RUN classic car, headlights off">
<img class="run-bruna-overlay" src="./assets/run-bruna-car.webp?v=20261011-run-engine-1" alt="" aria-hidden="true">
<img class="run-car-frame run-car-on" id="runCarOn" src="./assets/run-car-lights-on.webp?v=20261011-run-engine-1" alt="" aria-hidden="true">
<audio id="runEngineStart" preload="auto" src="./assets/run-classic-engine-start.mp3?v=20261011-run-engine-1"></audio>
<button id="runBack" class="ui-back-button" aria-label="Back to Barameel World"></button>
<div id="nameGuide" class="scan-message" aria-live="polite"></div>
<input id="nickname" class="nickname-input" maxlength="24" placeholder="REGISTER FIRST" aria-label="Registered player name" autocomplete="off" autocapitalize="words" spellcheck="false" readonly tabindex="-1">
<button id="start" class="hotspot start-hotspot" aria-label="Start Run"></button>
</main>
<script src="./app.js?v=20261024-registration-state-1"></script>
<script>
(() => {
  const input = document.getElementById('nickname');
  const guide = document.getElementById('nameGuide');
  const stage = document.querySelector('.run-engine-stage');
  const carOn = document.getElementById('runCarOn');
  const engine = document.getElementById('runEngineStart');
  let ignitionStarted = false;
  if (carOn) { carOn.style.opacity = '0'; carOn.style.visibility = 'hidden'; }
  const startIgnition = () => {
    if (ignitionStarted) return;
    ignitionStarted = true;
    if (carOn) { carOn.style.visibility = 'visible'; carOn.style.opacity = '1'; }
    if (engine) {
      engine.volume = 0.18;
      engine.currentTime = 0;
      const p = engine.play();
      if (p && p.catch) p.catch(() => {});
      window.setTimeout(() => { engine.pause(); engine.currentTime = 0; }, 4200);
    }
  };
  window.setTimeout(startIgnition, 850);
  stage?.addEventListener('pointerdown', () => { if (!ignitionStarted) startIgnition(); }, { once: true, passive: true });
  // One-time BARAMEEL RUN intro guidance, matching the checkpoint screen's arcade type-on cue.
  let guideAudioContext=null;
  function guideTone(frequency=520,duration=.025,volume=.028,wave='square'){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      if(!guideAudioContext)guideAudioContext=new AC();
      if(guideAudioContext.state==='suspended')guideAudioContext.resume().catch(()=>{});
      const now=guideAudioContext.currentTime;
      const osc=guideAudioContext.createOscillator();
      const gain=guideAudioContext.createGain();
      osc.type=wave;osc.frequency.setValueAtTime(frequency,now);
      gain.gain.setValueAtTime(.0001,now);
      gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),now+.004);
      gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
      osc.connect(gain);gain.connect(guideAudioContext.destination);
      osc.start(now);osc.stop(now+duration+.01);
    }catch{}
  }
  function guideMessageCue(){
    guideTone(740,.085,.085,'square');
    window.setTimeout(()=>guideTone(980,.075,.06,'triangle'),60);
  }
  function typeGuideOnce(message){
    guide.classList.remove('error');
    guide.textContent='';
    guide.classList.add('show');
    guideMessageCue();
    let i=0;
    const timer=window.setInterval(()=>{
      i++;
      guide.textContent=message.slice(0,i);
      if(i%2===0)guideTone(300+(i%7)*38,.018,.018,'square');
      if(i>=message.length)window.clearInterval(timer);
    },38);
  }
  function runIntroGuidance(){
    const phrases=[
      'ALEXANDRIA IS YOUR PLAYGROUND!',
      'YOUR NAME IS ALREADY REGISTERED.',
      'YOUR RUN STARTS NOW.'
    ];
    let index=0;
    const showNext=()=>{
      if(index>=phrases.length)return;
      typeGuideOnce(phrases[index++]);
      if(index<phrases.length)window.setTimeout(showNext,3000);
      else window.setTimeout(()=>guide.classList.remove('show'),2800);
    };
    window.setTimeout(showNext,1100);
  }
  runIntroGuidance();

  input.value = BR.state.nickname || '';
  input.readOnly = true;
  input.setAttribute('aria-readonly', 'true');
  input.style.setProperty('left','8.0%','important');
  input.style.setProperty('top','77.8%','important');
  input.style.setProperty('width','84.0%','important');
  input.style.setProperty('height','7.3%','important');

  document.getElementById('runBack').onclick = () => BR.goAfter('world.html', 'back', 180);

  document.getElementById('start').onclick = () => {
    const name = String(BR.state.nickname || input.value || '').trim().replace(/\s+/g, ' ');
    if (!name) {
      BR.play('error');
      BR.haptic('error');
      guide.textContent = 'REGISTER YOUR PLAYER FIRST';
      guide.classList.add('show', 'error');
      window.setTimeout(() => guide.classList.remove('show'), 2200);
      return;
    }
    if (!/^[A-Z0-9 _-]{2,24}$/i.test(name)) {
      BR.play('error');
      BR.haptic('error');
      guide.textContent = 'PLAYER NAME NEEDS TO BE UPDATED IN REGISTRATION';
      guide.classList.add('show', 'error');
      window.setTimeout(() => guide.classList.remove('show'), 2200);
      return;
    }

    input.value = name;
    BR.safeSession.set('barameelStartFlashPending', '0');
    BR.safeSession.set('barameelStartFlashShown', '1');
    BR.track('run_start');
    BR.goAfter('screen02.html', 'confirm', 220);
  };

  BR.track('run_view');
})();
</script>
</body>
</html>
