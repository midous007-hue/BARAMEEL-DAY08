<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e2a3d">
<title>BARAMEEL RUN</title>
<link rel="stylesheet" href="./styles.css?v=20261005-23.4">
<script src="./config.js?v=20261005-23.4"></script>
</head>
<body>
<main class="stage run-page">
<img class="base" src="./assets/screen01-start.webp?v=20261005-23.4" alt="BARAMEEL RUN">
<button id="runBack" class="ui-back-button" aria-label="Back to Barameel World"></button>
<div id="nameGuide" class="scan-message" aria-live="polite"></div>
<input id="nickname" class="nickname-input" maxlength="24" placeholder="TYPE YOUR NICKNAME" aria-label="Nickname" autocomplete="off" autocapitalize="words" spellcheck="false">
<button id="start" class="hotspot start-hotspot" aria-label="Start Run"></button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js?v=20261005-23.4"></script>
<script>
(() => {
  const input = document.getElementById('nickname');
  const guide = document.getElementById('nameGuide');

  input.value = BR.state.nickname || '';
  input.oninput = () => BR.setNickname(input.value);

  document.getElementById('runBack').onclick = () => BR.goAfter('world.html', 'back', 180);

  document.getElementById('start').onclick = () => {
    const name = input.value.trim().replace(/\s+/g, ' ');
    if (!/^[A-Z0-9 _-]{2,24}$/i.test(name)) {
      BR.play('error');
      BR.haptic('error');
      guide.textContent = name.length < 2
        ? 'TYPE AT LEAST 2 CHARACTERS'
        : 'USE LETTERS, NUMBERS, SPACES OR - _';
      guide.classList.add('show', 'error');
      input.focus();
      window.setTimeout(() => guide.classList.remove('show'), 2200);
      return;
    }

    BR.setNickname(name);
    BR.safeSession.set('barameelStartFlashPending', '0');
    BR.safeSession.set('barameelStartFlashShown', '1');
    BR.track('run_start');
    BR.goAfter('screen02.html', 'confirm', 220);
  };

  BR.track('run_view');
})();
</script>
</body>
</html>
