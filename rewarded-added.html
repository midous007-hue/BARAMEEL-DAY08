<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><link rel="stylesheet" href="./barameel-flow.css?v=20261003-1"><script src="./config.js?v=20261003-1"></script></head><body><main class="flow-stage"><img class="flow-art" src="./assets/rewarded-added.webp" alt="BARAMEEL RUN" fetchpriority="high"><div class="arcade-shine"></div><button id="back" class="flow-hit" style="left:3%;top:1%;width:19%;height:6%" aria-label="Back"></button><div id="points" class="flow-data flow-number" style="left:57%;top:57%;width:32%;text-align:center">0</div><button id="continue" class="flow-hit" style="left:13%;top:89%;width:75%;height:7%" aria-label="Continue"></button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js?v=20261003-1"></script><script src="./barameel-flow.js?v=20261003-1"></script><script>let target=Number(BR.state?.points||0);try{const r=JSON.parse(sessionStorage.getItem('barameelReceiptReward')||'null');target=Number(r?.points_awarded||r?.points||target)}catch{}document.getElementById('points').textContent=target.toLocaleString();document.getElementById('back').onclick=()=>BARAMEEL_FLOW.go('receipt-code.html','back');document.getElementById('continue').onclick=()=>{let r=null;try{r=JSON.parse(sessionStorage.getItem('barameelReceiptReward')||'null')}catch{};const hasPiece=Number(r?.piece_number||r?.piece||r?.reward?.piece_number||r?.reward?.piece||0)>0;BARAMEEL_FLOW.go(hasPiece?'new-collection-piece.html':'run-complete.html','reward')};BARAMEEL_FLOW.fx('reward');</script></body></html>
