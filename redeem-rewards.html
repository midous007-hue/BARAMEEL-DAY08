<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BARAMEEL RUN — REDEEM REWARDS</title>
<link rel="stylesheet" href="./barameel-flow.css?v=20261006-23.9">
<script src="./config.js?v=20261006-23.9"></script>
<style>
body{background:#071a20}
.redeem-stage{position:relative;width:min(100vw,calc(100dvh*948/1659));height:min(100dvh,calc(100vw*1659/948));aspect-ratio:948/1659;margin:auto;overflow:hidden;background:#071a20;color:#f6e7ce}
.redeem-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.28) saturate(.9)}
.redeem-title{position:absolute;left:9%;top:9%;width:82%;text-align:center;color:#f4c52f;font:900 clamp(30px,8vw,70px)/.9 Impact,'Arial Black',sans-serif;text-shadow:4px 4px 0 #071a20,-2px -2px 0 #f6e7ce}
.redeem-sub{position:absolute;left:12%;top:18%;width:76%;text-align:center;font:900 clamp(12px,3.1vw,23px)/1.1 'Roboto Condensed',Arial,sans-serif;text-transform:uppercase}
.grid{position:absolute;left:7%;top:25%;width:86%;height:50%;display:grid;grid-template-columns:repeat(2,1fr);gap:3.5%}
.reward{position:relative;border:3px solid #f4c52f;border-radius:18px;background:rgba(7,26,32,.92);box-shadow:0 0 0 3px #071a20,0 8px 18px rgba(0,0,0,.45);overflow:hidden}
.reward img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.34}
.reward span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:6%;font:900 clamp(20px,5vw,42px)/.95 Impact,'Arial Black',sans-serif;color:#f6e7ce;text-shadow:3px 3px 0 #071a20}
.reward small{position:absolute;left:0;right:0;bottom:7%;text-align:center;font:900 clamp(11px,2.8vw,19px)/1 'Roboto Condensed',Arial,sans-serif;color:#f4c52f}
.reward.is-selected{border-color:#fff1a6;box-shadow:0 0 0 4px #f4c52f,0 0 24px rgba(244,197,47,.7)}
#confirm{position:absolute;left:10%;bottom:7%;width:80%;height:8%;border:0;border-radius:999px;background:#f4c52f;color:#071a20;font:900 clamp(17px,4.5vw,32px)/1 Impact,'Arial Black',sans-serif;box-shadow:0 0 0 4px #071a20,0 0 0 7px #f4c52f}
#confirm:disabled{opacity:.45}
#back{position:absolute;left:3%;top:1%;width:19%;height:6%;z-index:20}
</style>
</head>
<body>
<main class="redeem-stage">
<img class="redeem-bg" src="./assets/marks-wallet.webp?v=20261006-23.9" alt="">
<button id="back" class="flow-hit" aria-label="Back"></button>
<div class="redeem-title">REDEEM REWARDS</div>
<div class="redeem-sub">SELECT A MARKS VALUE TO CONTINUE</div>
<div id="grid" class="grid"></div>
<button id="confirm" disabled>CONTINUE</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js?v=20261006-23.9"></script>
<script>
(()=>{
 const values=[20,50,100,200,500,1000],grid=document.getElementById('grid'),confirm=document.getElementById('confirm');
 let selected=0;
 values.forEach((v,i)=>{
   const b=document.createElement('button');b.className='reward';b.type='button';
   const img=document.createElement('img');img.src='./assets/rewards/'+['reward-super','reward-amazing','reward-spectacular','reward-jackpot'][i%4]+'.webp?v=20261006-23.9';
   const span=document.createElement('span');span.textContent=v+' MARKS';
   const small=document.createElement('small');small.textContent='SELECT';
   b.append(img,span,small);
   b.onclick=()=>{selected=v;document.querySelectorAll('.reward').forEach(x=>x.classList.remove('is-selected'));b.classList.add('is-selected');confirm.disabled=false;BR.play('tap');BR.haptic('tap');};
   grid.appendChild(b);
 });
 document.getElementById('back').onclick=()=>BR.goAfter('marks-wallet.html','back',180);
 confirm.onclick=()=>{
   BR.safeSession.set('barameelRedeemMarkValue',String(selected));
   BR.goAfter('redeem-confirm.html','confirm',220);
 };
})();
</script>
</body>
</html>
