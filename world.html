<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0e2a3d"><title>BARAMEEL WORLD</title><link rel="stylesheet" href="./styles.css?v=20261001-21.0"><script src="./config.js?v=20261001-21.0"></script></head><body><main class="world-stage world-hub-stage" id="worldHub" aria-label="BARAMEEL WORLD">
  <img class="world-art" src="./assets/barameel-world.webp?v=20261001-21.10" alt="BARAMEEL WORLD" fetchpriority="high">

  <!-- WORLD atmosphere: one visual language, five section signatures. The supplied artwork remains untouched. -->
  <div class="world-ambient-glow" aria-hidden="true"></div>
  <div class="world-scanline" aria-hidden="true"></div>
  <div class="world-grain" aria-hidden="true"></div>
  <div class="world-live-pulse" aria-hidden="true"></div>

  <div class="world-card-fx fx-run" data-section="run" aria-hidden="true"></div>
  <div class="world-card-fx fx-duo" data-section="duo" aria-hidden="true"></div>
  <div class="world-card-fx fx-menu" data-section="menu" aria-hidden="true"></div>
  <div class="world-card-fx fx-post" data-section="post" aria-hidden="true"></div>
  <div class="world-card-fx fx-profile" data-section="profile" aria-hidden="true"></div>

  <nav class="world-nav" aria-label="Barameel World">
    <a class="hub-link hub-run" data-section="run" href="./run.html" aria-label="BARAMEEL RUN"></a>
    <a class="hub-link hub-duo" data-section="duo" href="./duo-link.html" aria-label="DUO LINK"></a>
    <a class="hub-link hub-menu" data-section="menu" href="./menu.html" aria-label="BARAMEEL MENU"></a>
    <a class="hub-link hub-post" data-section="post" href="./post.html" aria-label="BARAMEEL POST"></a>
    <a class="hub-link hub-profile" data-section="profile" href="./my-barameel.html" aria-label="MY BARAMEEL"></a>
    <a class="hub-link social-ig" href="#" aria-label="Instagram"></a>
    <a class="hub-link social-tt" href="#" aria-label="TikTok"></a>
    <a class="hub-link social-fb" href="#" aria-label="Facebook"></a>
    <a class="hub-link social-wa" href="https://wa.me/" aria-label="WhatsApp"></a>
  </nav>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js?v=20261001-21.10"></script>
<script>
(() => {
  const stage = document.getElementById('worldHub');
  const links = [...stage.querySelectorAll('.hub-link[data-section]')];
  const tones = {
    run:[196,294,392],
    duo:[330,494,659],
    menu:[247,370,494],
    post:[294,440,587],
    profile:[220,330,523]
  };
  let ctx;
  function audio(section){
    try{
      ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==='suspended') ctx.resume();
      const now=ctx.currentTime;
      (tones[section]||tones.run).forEach((f,i)=>{
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type=i===1?'triangle':'square';
        o.frequency.setValueAtTime(f,now+i*.045);
        g.gain.setValueAtTime(.0001,now+i*.045);
        g.gain.exponentialRampToValueAtTime(.045,now+i*.045+.012);
        g.gain.exponentialRampToValueAtTime(.0001,now+i*.045+.095);
        o.connect(g).connect(ctx.destination); o.start(now+i*.045); o.stop(now+i*.045+.11);
      });
    }catch{}
  }
  function pulse(section){
    stage.dataset.active=section;
    const fx=stage.querySelector('.fx-'+section);
    if(fx){fx.classList.remove('is-active'); void fx.offsetWidth; fx.classList.add('is-active');}
    try{if(navigator.vibrate) navigator.vibrate([8,24,12]);}catch{}
  }
  links.forEach(a=>{
    a.addEventListener('pointerdown',()=>{ const s=a.dataset.section; pulse(s); audio(s); if(window.BR) BR.play('tap'); },{passive:true});
    a.addEventListener('click',(event)=>{
      const s=a.dataset.section;
      pulse(s);
      // Give the section its own arcade "lock-on" moment before navigation.
      if(a.dataset.going) return;
      a.dataset.going='1';
      setTimeout(()=>{ location.href=a.href; },170);
      event.preventDefault();
    });
  });
  stage.querySelectorAll('.social-ig,.social-tt,.social-fb,.social-wa').forEach(a=>a.addEventListener('pointerdown',()=>{if(window.BR) BR.play('tap')},{passive:true}));
  stage.addEventListener('pointermove',e=>{
    const r=stage.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    stage.style.setProperty('--mx',(x*0.8).toFixed(3)+'%');
    stage.style.setProperty('--my',(y*0.6).toFixed(3)+'%');
  },{passive:true});
  stage.addEventListener('pointerleave',()=>{stage.style.setProperty('--mx','0%');stage.style.setProperty('--my','0%')},{passive:true});
  BR.track('world_view');
})();
</script></body></html>
