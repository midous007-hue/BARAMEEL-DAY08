social-wa" href="https://wa.me/" aria-label="WhatsApp"></a></nav></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js?v=20261003-22.0"></script><script>(()=>{const stage=document.getElementById('worldHub'),links=[...stage.querySelectorAll('.hub-link[data-section]')],tones={run:[196,294,392],duo:[330,494,659],menu:[247,370,494],post:[294,440,587],profile:[220,330,523]};let ctx;function audio(section){try{ctx=ctx||(window.AudioContext?new AudioContext():new webkitAudioContext());if(ctx.state==='suspended')ctx.resume();const now=ctx.currentTime;(tones[section]||tones.run).forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=i===1?'triangle':'square';o.frequency.setValueAtTime(f,now+i*.055);g.gain.setValueAtTime(.0001,now+i*.055);g.gain.exponentialRampToValueAtTime(.085,now+i*.055+.012);g.gain.exponentialRampToValueAtTime(.0001,now+i*.055+.13);o.connect(g).connect(ctx.destination);o.start(now+i*.055);o.stop(now+i*.055+.145)})}catch{}}function pulse(section){stage.dataset.active=section;links.forEach(l=>l.classList.toggle('is-active',l.dataset.section===section));try{navigator.vibrate?.([20,38,26,55])}catch{}}links.forEach(a=>{a.addEventListener('pointerdown',()=>{const s=a.dataset.section;pulse(s);audio(s);window.BR?.play?.('tap')},{passive:true});a.addEventListener('click',e=>{const s=a.dataset.section;pulse(s);if(a.dataset.going)return;a.dataset.going='1';document.body.classList.add('world-navigate');setTimeout(()=>location.href=a.href,340);e.preventDefault()})});stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;stage.style.setProperty('--mx',(x*2.2).toFixed(3)+'%');stage.style.setProperty('--my',(y*1.7).toFixed(3)+'%')},{passive:true});stage.addEventListener('pointerleave',()=>{stage.style.setProperty('--mx','0%');stage.style.setProperty('--my','0%')},{passive:true});BR.track('world_view')})();</script></body></html>
