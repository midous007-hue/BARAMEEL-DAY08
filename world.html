(()=> {

       [[0,2200,.48,.045],[.11,1700,.42,.055],[.29,2650,.55,.04],[.53,1400,.46,.065],[.82,3000,.7,.045],[1.13,2100,.6,.05]].forEach(v=>tick(...v));

       hg.gain.setValueAtTime(.0001,t+.52);hg.gain.linearRampToValueAtTime(.25,t+.72);hg.gain.linearRampToValueAtTime(.2,t+1.4);hg.gain.setValueAtTime(.16,t+3.5);hg.gain.exponentialRampToValueAtTime(.0001,t+4.9);
