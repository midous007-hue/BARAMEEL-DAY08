<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071c34">
<title>Join Barameel</title>
<link rel="preload" as="image" href="./assets/barameel-registration-screen.webp">
<link rel="stylesheet" href="./registration.css?v=20261029-registration-submit-guard-1">
</head>
<body>
<main class="registration-shell" id="registrationShell" aria-label="Barameel player registration">
  <div class="registration-art" role="img" aria-label="Barameel retro coastal registration artwork"></div>

  <form id="registrationForm" autocomplete="on" onsubmit="event.preventDefault(); return false;">
    <label class="visually-hidden" for="username">Choose your username</label>
    <input id="username" name="username" class="username-input" type="text" maxlength="24" minlength="3" autocomplete="nickname" placeholder="Enter your nickname" required>
  
    <label class="visually-hidden" for="phone">Mobile number</label>
    <button class="country-hotspot" id="countryTrigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Choose country code">
      <span id="countryFlag" aria-hidden="true">🇪🇬</span><span id="countryCode">+20</span><span class="country-caret" aria-hidden="true">▼</span>
    </button>
    <input id="phone" name="tel-national" class="phone-input" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="Enter your mobile number" required>

    <button id="submitRegistration" class="submit-hotspot" type="submit" aria-label="Create profile">
      <img src="./assets/verify-create-profile-button.webp" alt=""><span class="submit-label">CREATE / RECOVER PROFILE</span>
    </button>
  </form>

  <section class="country-dialog" id="countryDialog" role="dialog" aria-modal="true" aria-labelledby="countryTitle" hidden>
    <div class="country-panel">
      <div class="dialog-heading"><h2 id="countryTitle">Choose your country</h2><button id="closeCountries" type="button" aria-label="Close country list">×</button></div>
      <input id="countrySearch" type="search" placeholder="Search country or dial code" autocomplete="off">
      <div id="countryOptions" class="country-options" role="listbox" aria-label="Countries"></div>
    </div>
  </section>


  <div class="inline-pin-group" role="group" aria-label="Six digit player PIN">
    <input class="inline-pin-digit" id="pinDigit1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="new-password" aria-label="PIN digit 1" required>
    <input class="inline-pin-digit" id="pinDigit2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN digit 2" required>
    <input class="inline-pin-digit" id="pinDigit3" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN digit 3" required>
    <input class="inline-pin-digit" id="pinDigit4" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN digit 4" required>
    <input class="inline-pin-digit" id="pinDigit5" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN digit 5" required>
    <input class="inline-pin-digit" id="pinDigit6" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN digit 6" required>
  </div>
  <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>
</main>
<script src="./config.js?v=20261029-registration-submit-guard-1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js?v=20261029-registration-submit-guard-1"></script>
<script>
(() => {
  const countries = [
    ['EG','Egypt','+20','🇪🇬'],['SA','Saudi Arabia','+966','🇸🇦'],['AE','United Arab Emirates','+971','🇦🇪'],
    ['KW','Kuwait','+965','🇰🇼'],['QA','Qatar','+974','🇶🇦'],['BH','Bahrain','+973','🇧🇭'],
    ['OM','Oman','+968','🇴🇲'],['JO','Jordan','+962','🇯🇴'],['LB','Lebanon','+961','🇱🇧'],
    ['IQ','Iraq','+964','🇮🇶'],['MA','Morocco','+212','🇲🇦'],['TN','Tunisia','+216','🇹🇳'],
    ['DZ','Algeria','+213','🇩🇿'],['US','United States','+1','🇺🇸'],['CA','Canada','+1','🇨🇦'],
    ['GB','United Kingdom','+44','🇬🇧'],['FR','France','+33','🇫🇷'],['DE','Germany','+49','🇩🇪'],
    ['IT','Italy','+39','🇮🇹'],['ES','Spain','+34','🇪🇸'],['TR','Türkiye','+90','🇹🇷'],
    ['IN','India','+91','🇮🇳'],['PK','Pakistan','+92','🇵🇰'],['AU','Australia','+61','🇦🇺']
  ];
  const $ = id => document.getElementById(id);

  // Returning players should never see onboarding again on this device.
  // A recover=1 query is reserved for the recovery route when the server says
  // the saved anonymous session is no longer linked to a player profile.
  function hasRegisteredPlayer() {
    const keys = [
      'barameel.world.player.v23.7',
      'barameel.world.player.v23.6',
      'barameel.world.player.v23.5',
      'barameel.world.player.v23.4',
      'barameel.world.player.v23.3',
      'barameel.world.player.v23.2'
    ];
    for (const key of keys) {
      try {
        const saved = JSON.parse(localStorage.getItem(key) || 'null');
        const playerCodes = [saved?.playerCode, saved?.player_code, saved?.playerId]
          .map(value => String(value || '').trim());
        const nickname = String(saved?.nickname || '').trim();
        if (playerCodes.some(code => /^BM-[A-Z0-9]{8}$/i.test(code)) && nickname.length >= 3) return true;
      } catch {}
    }
    return false;
  }
  const registrationParams = new URLSearchParams(location.search);
  // "first=1" is an explicit request to show registration from the splash or
  // from the world guard. Respect it so invalid/stale local state cannot create
  // a registration <-> world redirect loop.
  if (registrationParams.get('recover') !== '1' &&
      registrationParams.get('first') !== '1' &&
      hasRegisteredPlayer()) {
    location.replace('./world.html?resume=1');
    return;
  }
  let selectedCountry = countries[0];
  const username = $('username'), phone = $('phone'), dialog = $('countryDialog'), search = $('countrySearch');
  const status = $('statusMessage');
  const suggestions = ['RetroRunner','NeonSkater','BrounaFan','SunsetRacer','ArcadeHero','CoastalRunner','GoldenPlayer','DiscoRider'];
  function message(text) { status.textContent = text; status.classList.add('visible'); }
  function saveRegisteredPlayer(result) {
    const raw = result?.player;
    if (!raw || typeof raw !== 'object') {
      throw new Error('The server verified the request but did not return player details. Please try again.');
    }

    // Persist the server-confirmed identity first. Do not depend on app.js being
    // initialized or on mergePlayer/local state to survive the navigation.
    const code = String(raw.playerId || raw.playerCode || raw.player_code || '').trim();
    const nickname = String(raw.nickname || pendingUsername || '').trim().slice(0, 24);
    if (!/^BM-[A-Z0-9]{8}$/i.test(code) || nickname.length < 3) {
      console.error('Player response is missing required identity fields', {
        hasPlayerId: !!raw.playerId,
        hasPlayerCode: !!raw.playerCode,
        hasPlayerCodeSnake: !!raw.player_code,
        hasNickname: !!nickname
      });
      throw new Error('The server response is missing the player code or nickname. Your account was not changed; please try again.');
    }

    const key = 'barameel.world.player.v23.7';
    let previous = {};
    try { previous = JSON.parse(localStorage.getItem(key) || 'null') || {}; } catch {}
    const saved = {
      ...previous,
      ...raw,
      id: raw.id || previous.id || null,
      playerId: code,
      playerCode: code,
      player_code: code,
      nickname,
      avatar: raw.avatar || raw.runner || previous.avatar || 'avatar01',
      runner: raw.runner || raw.avatar || previous.runner || 'avatar01'
    };

    try {
      localStorage.setItem(key, JSON.stringify(saved));
      const check = JSON.parse(localStorage.getItem(key) || 'null');
      if (!check || String(check.playerId || '') !== code || String(check.nickname || '') !== nickname) {
        throw new Error('Player data could not be verified after saving.');
      }
    } catch (storageError) {
      console.error('Player local persistence failed', storageError);
      throw new Error('Your account was verified, but this browser could not save the player data. Please enable site storage and try again.');
    }

    // Sync the in-memory game state after the durable write. A client-side
    // state issue must not undo the already-saved server-confirmed profile.
    try {
      if (window.BR?.mergePlayer) window.BR.mergePlayer(saved);
    } catch (stateError) {
      console.warn('Player state sync deferred; persisted profile remains available.', stateError);
    }
    return true;
  }
  function clearMessage() { status.textContent = ''; status.classList.remove('visible'); }
  let supabaseClient = null;
  let pendingPhone = '';
  let pendingUsername = '';
  let registering = false;
  try {
    if (window.supabase?.createClient && window.BARAMEEL_SUPABASE_URL && window.BARAMEEL_SUPABASE_PUBLISHABLE_KEY) {
      supabaseClient = window.supabase.createClient(window.BARAMEEL_SUPABASE_URL, window.BARAMEEL_SUPABASE_PUBLISHABLE_KEY);
    }
  } catch (err) { console.error('Supabase client initialization failed', err); }
  async function createOrRecoverProfile() {
    if (registering) return;
    if (!supabaseClient) {
      message('Registration is not available right now. Please try again later.');
      return;
    }
    registering = true;
    $('submitRegistration').disabled = true;
    clearMessage();
    try {
      // Barameel uses phone + player PIN, not SMS OTP. An anonymous Supabase
      // session supplies a scoped bearer token for the Edge Function.
      const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
      if (sessionError) throw sessionError;
      if (!sessionData?.session) {
        const { error } = await supabaseClient.auth.signInAnonymously();
        if (error) throw error;
      }
      const { data: result, error } = await supabaseClient.functions.invoke('player', {
        body: { nickname: pendingUsername, phone_number: pendingPhone, pin: pendingPin }
      });
      if (error) {
        // Supabase wraps non-2xx Edge Function responses in FunctionsHttpError.
        // Read only the structured error code so we can diagnose deployment/schema
        // failures without displaying raw server details or secrets to players.
        let serverCode = '';
        try {
          const response = error.context;
          if (response && typeof response.clone === 'function') {
            const payload = await response.clone().json();
            serverCode = String(payload?.error || payload?.code || '');
          }
        } catch {}
        console.error('Player Edge Function request failed', {
          name: error.name,
          message: error.message,
          serverCode: serverCode || 'NO_STRUCTURED_ERROR',
          status: error.context?.status || null
        });
        const known = {
          SERVER_CONFIGURATION_ERROR: 'The registration service is not configured correctly.',
          PLAYER_LOOKUP_FAILED: 'Could not read the player profile. Please contact support.',
          PLAYER_PHONE_LOOKUP_FAILED: 'Could not look up this phone number. Please try again.',
          PLAYER_CREATE_FAILED: 'Could not save the player profile. Please try again.',
          PLAYER_UPDATE_FAILED: 'Could not update the player profile. Please try again.',
          CHECKPOINT_STATE_FAILED: 'Game data is temporarily unavailable. Please try again.',
          COLLECTION_STATE_FAILED: 'Collection data is temporarily unavailable. Please try again.',
          PLAYER_RANK_FAILED: 'Player ranking is temporarily unavailable. Please try again.',
          PLAYER_FUNCTION_FAILED: 'The registration service encountered an internal error.',
          AUTH_REQUIRED: 'Your session expired. Refresh the page and try again.',
          INVALID_PHONE: 'Check the phone country code and number.',
          INVALID_PIN: 'Enter a valid 6-digit PIN.',
          PIN_MISMATCH: 'This phone number is already registered. Enter the correct PIN.'
        };
        throw new Error(known[serverCode] || (serverCode ? 'Registration service error: ' + serverCode : 'The registration service returned an error. Please retry once; if it repeats, check the player Edge Function logs.'));
      }
      if (!result?.ok || !result?.player) {
        const reason = result?.error;
        if (reason === 'PIN_MISMATCH') throw new Error('This phone number is already registered. Enter the correct PIN.');
        if (reason === 'PHONE_ALREADY_REGISTERED') throw new Error('This phone number is already registered. Enter your existing PIN.');
        if (reason === 'INVALID_PIN') throw new Error('Enter a valid 6-digit PIN.');
        throw new Error('We could not create or recover your profile. Please try again.');
      }
      saveRegisteredPlayer(result);
      message('Profile ready! Opening Barameel...');
      window.location.replace('./world.html?resume=1');
    } catch (err) {
      console.error('Player registration/login failed', err);
      message(err?.message || 'We could not complete your registration. Please try again.');
    } finally {
      registering = false;
      $('submitRegistration').disabled = false;
    }
  }
  function renderCountries(query='') {
    const q = query.trim().toLowerCase();
    const filtered = countries.filter(c => c[1].toLowerCase().includes(q) || c[2].includes(q) || c[0].toLowerCase().includes(q));
    $('countryOptions').replaceChildren();
    filtered.forEach(c => {
      const b = document.createElement('button'); b.type='button'; b.className='country-option'; b.setAttribute('role','option');
      b.innerHTML = '<span class="option-flag"></span><span class="option-name"></span><span class="option-code"></span>';
      b.querySelector('.option-flag').textContent=c[3]; b.querySelector('.option-name').textContent=c[1]; b.querySelector('.option-code').textContent=c[2];
      b.setAttribute('aria-selected', String(c[0]===selectedCountry[0]));
      b.addEventListener('click', () => chooseCountry(c)); $('countryOptions').appendChild(b);
    });
    if (!filtered.length) { const p=document.createElement('p'); p.className='no-countries'; p.textContent='No countries found'; $('countryOptions').appendChild(p); }
  }
  function chooseCountry(c) {
    selectedCountry=c; $('countryFlag').textContent=c[3]; $('countryCode').textContent=c[2];
    dialog.hidden=true; $('countryTrigger').setAttribute('aria-expanded','false'); $('countryTrigger').focus(); clearMessage();
  }
  $('countryTrigger').addEventListener('click', () => { dialog.hidden=false; $('countryTrigger').setAttribute('aria-expanded','true'); search.value=''; renderCountries(); search.focus(); });
  $('closeCountries').addEventListener('click', () => { dialog.hidden=true; $('countryTrigger').setAttribute('aria-expanded','false'); $('countryTrigger').focus(); });
  search.addEventListener('input', () => renderCountries(search.value));
  dialog.addEventListener('click', e => { if(e.target===dialog){dialog.hidden=true;$('countryTrigger').setAttribute('aria-expanded','false');} });

  username.addEventListener('input', clearMessage); phone.addEventListener('input', clearMessage);
  let pendingPin = '';
  document.querySelectorAll('.inline-pin-digit').forEach((field,index,all)=>{
    field.addEventListener('input',()=>{field.value=field.value.replace(/\D/g,'').slice(-1);if(field.value&&all[index+1])all[index+1].focus();});
    field.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!field.value&&all[index-1])all[index-1].focus();});
  });
  $('registrationForm').addEventListener('submit', e => {
    e.preventDefault(); clearMessage();
    const name=username.value.trim(), digits=phone.value.replace(/\D/g,'').replace(/^0+/, '');
    if(name.length<3){message('Please enter a username with at least 3 characters.');username.focus();return;}
    if(!/^[a-zA-Z0-9_.-]+$/.test(name)){message('Use letters, numbers, dots, underscores, or hyphens.');username.focus();return;}
    if(digits.length<6||digits.length>14){message('Please enter a valid mobile number.');phone.focus();return;}
    pendingPhone = selectedCountry[2] + digits;
    pendingUsername = name;
    pendingPin=Array.from(document.querySelectorAll('.inline-pin-digit')).map(el=>el.value).join('');
    if(!/^\d{6}$/.test(pendingPin)){message('Enter your 6-digit PIN.');document.querySelector('.inline-pin-digit:not([value])')?.focus();return;}
    createOrRecoverProfile();
  });



  username.value='';
  renderCountries();
})();
</script>
</body>
</html>
