<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071c34">
<title>Join Barameel</title>
<link rel="preload" as="image" href="./assets/barameel-registration-screen.webp">
<link rel="stylesheet" href="./registration.css?v=23.5">
</head>
<body>
<main class="registration-shell" id="registrationShell" aria-label="Barameel player registration">
  <div class="registration-art" role="img" aria-label="Barameel retro coastal registration artwork"></div>

  <form id="registrationForm" autocomplete="on">
    <label class="visually-hidden" for="username">Choose your username</label>
    <input id="username" name="username" class="username-input" type="text" maxlength="24" minlength="3" autocomplete="nickname" placeholder="Enter your nickname" required>
    <button class="shuffle-hotspot" id="shuffleUsername" type="button" aria-label="Generate a random username"></button>

    <label class="visually-hidden" for="phone">Mobile number</label>
    <button class="country-hotspot" id="countryTrigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Choose country code">
      <span id="countryFlag" aria-hidden="true">🇪🇬</span><span id="countryCode">+20</span><span class="country-caret" aria-hidden="true">▼</span>
    </button>
    <input id="phone" name="tel-national" class="phone-input" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="Enter your mobile number" required>

    <button id="submitRegistration" class="submit-hotspot" type="submit" aria-label="Create profile">
      <img src="./assets/verify-create-profile-button.webp" alt="Create profile">
    </button>
  </form>

  <section class="country-dialog" id="countryDialog" role="dialog" aria-modal="true" aria-labelledby="countryTitle" hidden>
    <div class="country-panel">
      <div class="dialog-heading"><h2 id="countryTitle">Choose your country</h2><button id="closeCountries" type="button" aria-label="Close country list">×</button></div>
      <input id="countrySearch" type="search" placeholder="Search country or dial code" autocomplete="off">
      <div id="countryOptions" class="country-options" role="listbox" aria-label="Countries"></div>
    </div>
  </section>

  <section class="otp-dialog" id="otpDialog" role="dialog" aria-modal="true" aria-labelledby="otpTitle" hidden>
    <div class="otp-panel">
      <div class="dialog-heading"><h2 id="otpTitle">Verify your phone</h2><button id="closeOtp" type="button" aria-label="Close verification">×</button></div>
      <p id="otpSummary"></p>
      <label class="otp-label" for="otpCode">6-DIGIT VERIFICATION CODE</label>
      <input id="otpCode" class="otp-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" placeholder="••••••" aria-label="Six digit verification code">
      <p id="otpHint" class="otp-hint">Enter the code sent to your phone.</p>
      <button id="verifyOtp" type="button" class="secondary-action primary-action">VERIFY PHONE &amp; CREATE PROFILE</button>
      <button id="resendOtp" type="button" class="secondary-action">RESEND CODE</button>
      <button id="editDetails" type="button" class="secondary-action">EDIT PHONE NUMBER</button>
    </div>
  </section>
  <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>
</main>
<script src="./config.js?v=20261024-registration"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const countries = [
    ['EG','Egypt','+20','🇪🇬'],['SA','Saudi Arabia','+966','🇸🇦'],['AE','United Arab Emirates','+971','🇦🇪'],
    ['KW','Kuwait','+965','🇰🇼'],['QA','Qatar','+974','🇶🇦'],['BH','Bahrain','+973','🇧🇭'],
    ['OM','Oman','+968','🇴🇲'],['JO','Jordan','+962','🇯🇴'],['LB','Lebanon','+961','🇱🇧'],
    ['IQ','Iraq','+964','🇮🇶'],['MA','Morocco','+212','🇲🇦'],['TN','Tunisia','+216','🇹🇳'],
    ['DZ','Algeria','+213','🇩🇿'],['US','United States','+1','🇺🇸'],['CA','Canada','+1','🇨🇦'],
    ['GB','United Kingdom','+44','🇬🇧'],['FR','France','+33','🇫🇷'],['DE','Germany','+49','🇩🇪'],
    ['IT','Italy','+39','🇮🇹'],['ES','Spain','+34','🇪🇸'],['TR','Türkiye','+90','🇹🇷'],
    ['IN','India','+91','🇮🇳'],['PK','Pakistan','+92','🇵🇰'],['AU','Australia','+61','🇦🇺']
  ];
  const $ = id => document.getElementById(id);
  let selectedCountry = countries[0];
  const username = $('username'), phone = $('phone'), dialog = $('countryDialog'), search = $('countrySearch');
  const status = $('statusMessage');
  const suggestions = ['RetroRunner','NeonSkater','BrounaFan','SunsetRacer','ArcadeHero','CoastalRunner','GoldenPlayer','DiscoRider'];
  function message(text) { status.textContent = text; status.classList.add('visible'); }
  function clearMessage() { status.textContent = ''; status.classList.remove('visible'); }
  let supabaseClient = null;
  let pendingPhone = '';
  let pendingUsername = '';
  let sendingOtp = false;
  let verifyingOtp = false;
  try {
    if (window.supabase?.createClient && window.BARAMEEL_SUPABASE_URL && window.BARAMEEL_SUPABASE_PUBLISHABLE_KEY) {
      supabaseClient = window.supabase.createClient(window.BARAMEEL_SUPABASE_URL, window.BARAMEEL_SUPABASE_PUBLISHABLE_KEY);
    }
  } catch (err) { console.error('Supabase client initialization failed', err); }
  function setOtpBusy(busy, buttonId) {
    $(buttonId).disabled = busy;
    $(buttonId).setAttribute('aria-busy', String(busy));
  }
  async function sendVerificationCode() {
    if (sendingOtp) return;
    if (!supabaseClient) {
      message('Verification is not configured yet. Please try again later.');
      return;
    }
    sendingOtp = true;
    setOtpBusy(true, 'submitRegistration');
    clearMessage();
    try {
      const { error } = await supabaseClient.auth.signInWithOtp({
        phone: pendingPhone,
        options: { shouldCreateUser: true, data: { username: pendingUsername } }
      });
      if (error) throw error;
      $('otpTitle').textContent = 'VERIFY YOUR PHONE';
      $('otpSummary').textContent = 'We sent a verification code to ' + pendingPhone + '.';
      $('otpHint').textContent = 'Enter the 6-digit SMS code to verify your number and create your profile.';
      $('otpCode').hidden = false;
      $('verifyOtp').hidden = false;
      $('resendOtp').hidden = false;
      $('editDetails').textContent = 'EDIT PHONE NUMBER';
      $('otpCode').value = '';
      $('otpDialog').hidden = false;
      $('otpCode').focus();
    } catch (err) {
      console.error('Phone OTP request failed', err);
      const detail = String(err?.message || '').toLowerCase();
      message(detail.includes('sms') || detail.includes('provider') || detail.includes('phone')
        ? 'SMS delivery is not configured or the number was rejected. Check the Supabase phone-auth SMS provider and try again.'
        : 'We could not send the verification code. Check the number and try again.');
    } finally {
      sendingOtp = false;
      setOtpBusy(false, 'submitRegistration');
    }
  }
  async function verifyCodeAndCreateProfile() {
    if (verifyingOtp) return;
    const token = $('otpCode').value.replace(/\D/g, '');
    if (!/^[0-9]{6}$/.test(token)) {
      $('otpHint').textContent = 'Enter the 6-digit code from your SMS.';
      $('otpCode').focus();
      return;
    }
    if (!supabaseClient) {
      $('otpHint').textContent = 'Phone verification is not configured yet.';
      return;
    }
    verifyingOtp = true;
    setOtpBusy(true, 'verifyOtp');
    $('otpHint').textContent = 'Verifying your number...';
    try {
      const { data, error } = await supabaseClient.auth.verifyOtp({ phone: pendingPhone, token, type: 'sms' });
      if (error) throw error;
      if (!data?.session) throw new Error('Verification succeeded but no session was created.');
      const { data: player, error: playerError } = await supabaseClient.functions.invoke('player', {
        body: { nickname: pendingUsername }
      });
      if (playerError) throw playerError;
      if (!player?.ok || !player?.player) throw new Error('Profile creation failed.');
      $('otpHint').textContent = 'Phone verified. Your Barameel profile is ready!';
      $('otpTitle').textContent = 'PROFILE CREATED!';
      $('otpCode').hidden = true;
      $('verifyOtp').hidden = true;
      $('resendOtp').hidden = true;
      $('editDetails').textContent = 'CONTINUE TO BARAMEEL';
      $('editDetails').onclick = () => { window.location.href = './world.html'; };
      window.setTimeout(() => { window.location.href = './world.html'; }, 1200);
    } catch (err) {
      console.error('Phone verification/profile creation failed', err);
      $('otpHint').textContent = 'The code could not be verified or the profile could not be created. Check the code and try again.';
    } finally {
      verifyingOtp = false;
      setOtpBusy(false, 'verifyOtp');
    }
  }
  function renderCountries(query='') {
    const q = query.trim().toLowerCase();
    const filtered = countries.filter(c => c[1].toLowerCase().includes(q) || c[2].includes(q) || c[0].toLowerCase().includes(q));
    $('countryOptions').replaceChildren();
    filtered.forEach(c => {
      const b = document.createElement('button'); b.type='button'; b.className='country-option'; b.setAttribute('role','option');
      b.innerHTML = '<span class="option-flag"></span><span class="option-name"></span><span class="option-code"></span>';
      b.querySelector('.option-flag').textContent=c[3]; b.querySelector('.option-name').textContent=c[1]; b.querySelector('.option-code').textContent=c[2];
      b.setAttribute('aria-selected', String(c[0]===selectedCountry[0]));
      b.addEventListener('click', () => chooseCountry(c)); $('countryOptions').appendChild(b);
    });
    if (!filtered.length) { const p=document.createElement('p'); p.className='no-countries'; p.textContent='No countries found'; $('countryOptions').appendChild(p); }
  }
  function chooseCountry(c) {
    selectedCountry=c; $('countryFlag').textContent=c[3]; $('countryCode').textContent=c[2];
    dialog.hidden=true; $('countryTrigger').setAttribute('aria-expanded','false'); $('countryTrigger').focus(); clearMessage();
  }
  $('countryTrigger').addEventListener('click', () => { dialog.hidden=false; $('countryTrigger').setAttribute('aria-expanded','true'); search.value=''; renderCountries(); search.focus(); });
  $('closeCountries').addEventListener('click', () => { dialog.hidden=true; $('countryTrigger').setAttribute('aria-expanded','false'); $('countryTrigger').focus(); });
  search.addEventListener('input', () => renderCountries(search.value));
  dialog.addEventListener('click', e => { if(e.target===dialog){dialog.hidden=true;$('countryTrigger').setAttribute('aria-expanded','false');} });
  $('shuffleUsername').addEventListener('click', () => { const base=suggestions[Math.floor(Math.random()*suggestions.length)]; username.value=base+Math.floor(10+Math.random()*90); username.dispatchEvent(new Event('input',{bubbles:true})); username.focus(); clearMessage(); });
  username.addEventListener('input', clearMessage); phone.addEventListener('input', clearMessage);
  async function createProfileWithoutPhoneVerification() {
    const submit = $('submitRegistration');
    if (submit.disabled) return;
    submit.disabled = true;
    submit.setAttribute('aria-busy', 'true');
    clearMessage();
    try {
      if (!supabaseClient) throw new Error('SUPABASE_NOT_CONFIGURED');
      const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
      if (sessionError) throw sessionError;
      if (!sessionData?.session) {
        const { error: signInError } = await supabaseClient.auth.signInAnonymously();
        if (signInError) throw signInError;
      }
      const { data, error } = await supabaseClient.functions.invoke('player', {
        body: { nickname: pendingUsername, phone_number: pendingPhone }
      });
      if (error) throw error;
      if (!data?.ok || !data?.player) throw new Error(data?.error || 'PROFILE_CREATION_FAILED');
      message('Profile created successfully. Continuing to Barameel...');
      window.setTimeout(() => { window.location.href = './world.html'; }, 900);
    } catch (err) {
      console.error('Registration failed', err);
      message('We could not save your profile. Please check your connection and try again.');
      submit.disabled = false;
      submit.removeAttribute('aria-busy');
    }
  }
  $('registrationForm').addEventListener('submit', e => {
    e.preventDefault(); clearMessage();
    const name=username.value.trim(), digits=phone.value.replace(/\D/g,'').replace(/^0+/, '');
    if(name.length<3){message('Please enter a username with at least 3 characters.');username.focus();return;}
    if(!/^[a-zA-Z0-9_.-]+$/.test(name)){message('Use letters, numbers, dots, underscores, or hyphens in your username.');username.focus();return;}
    if(digits.length<6||digits.length>14){message('Please enter a valid mobile number.');phone.focus();return;}
    pendingPhone = selectedCountry[2] + digits;
    pendingUsername = name;
    createProfileWithoutPhoneVerification();
  });
  $('verifyOtp').addEventListener('click', verifyCodeAndCreateProfile);
  $('otpCode').addEventListener('input', () => {
    $('otpCode').value = $('otpCode').value.replace(/\D/g, '').slice(0, 6);
    $('otpHint').textContent = 'Enter the 6-digit SMS code to verify your number.';
  });
  $('resendOtp').addEventListener('click', sendVerificationCode);
  $('closeOtp').addEventListener('click', () => { $('otpDialog').hidden=true; });
  $('editDetails').addEventListener('click', () => { $('otpDialog').hidden=true; phone.focus(); });
  $('otpDialog').addEventListener('click', e => { if(e.target===$('otpDialog')) $('otpDialog').hidden=true; });
  username.value='';
  renderCountries();
})();
</script>
</body>
</html>
