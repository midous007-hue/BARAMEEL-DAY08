<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071c34">
<title>Join Barameel</title>
<link rel="preload" as="image" href="./assets/barameel-registration-screen.webp">
<link rel="stylesheet" href="./registration.css?v=22.0">
</head>
<body>
<main class="registration-shell" id="registrationShell" aria-label="Barameel player registration">
  <div class="registration-art" role="img" aria-label="Barameel retro coastal registration artwork"></div>

  <form id="registrationForm" autocomplete="on">
    <label class="visually-hidden" for="username">Choose your username</label>
    <input id="username" name="username" class="username-input" type="text" maxlength="24" minlength="3" autocomplete="nickname" placeholder="Enter your nickname" required>
    <button class="shuffle-hotspot" id="shuffleUsername" type="button" aria-label="Generate a random username"></button>

    <label class="visually-hidden" for="phone">Mobile number</label>
    <button class="country-hotspot" id="countryTrigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Choose country code">
      <span id="countryFlag" aria-hidden="true">🇪🇬</span><span id="countryCode">+20</span><span class="country-caret" aria-hidden="true">▼</span>
    </button>
    <input id="phone" name="tel-national" class="phone-input" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="Enter your mobile number" required>

    <button id="submitRegistration" class="submit-hotspot" type="submit" aria-label="Verify and create profile">
      <img src="./assets/verify-create-profile-button.webp" alt="Verify and create profile">
    </button>
  </form>

  <section class="country-dialog" id="countryDialog" role="dialog" aria-modal="true" aria-labelledby="countryTitle" hidden>
    <div class="country-panel">
      <div class="dialog-heading"><h2 id="countryTitle">Choose your country</h2><button id="closeCountries" type="button" aria-label="Close country list">×</button></div>
      <input id="countrySearch" type="search" placeholder="Search country or dial code" autocomplete="off">
      <div id="countryOptions" class="country-options" role="listbox" aria-label="Countries"></div>
    </div>
  </section>

  <section class="otp-dialog" id="otpDialog" role="dialog" aria-modal="true" aria-labelledby="otpTitle" hidden>
    <div class="otp-panel">
      <div class="dialog-heading"><h2 id="otpTitle">Verify your phone</h2><button id="closeOtp" type="button" aria-label="Close verification">×</button></div>
      <p id="otpSummary"></p>
      <p class="demo-notice">The screen is ready for integration. SMS delivery and account creation require the production verification service; no code has been sent by this demo.</p>
      <button id="editDetails" type="button" class="secondary-action">EDIT DETAILS</button>
    </div>
  </section>
  <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>
</main>
<script>
(() => {
  const countries = [
    ['EG','Egypt','+20','🇪🇬'],['SA','Saudi Arabia','+966','🇸🇦'],['AE','United Arab Emirates','+971','🇦🇪'],
    ['KW','Kuwait','+965','🇰🇼'],['QA','Qatar','+974','🇶🇦'],['BH','Bahrain','+973','🇧🇭'],
    ['OM','Oman','+968','🇴🇲'],['JO','Jordan','+962','🇯🇴'],['LB','Lebanon','+961','🇱🇧'],
    ['IQ','Iraq','+964','🇮🇶'],['MA','Morocco','+212','🇲🇦'],['TN','Tunisia','+216','🇹🇳'],
    ['DZ','Algeria','+213','🇩🇿'],['US','United States','+1','🇺🇸'],['CA','Canada','+1','🇨🇦'],
    ['GB','United Kingdom','+44','🇬🇧'],['FR','France','+33','🇫🇷'],['DE','Germany','+49','🇩🇪'],
    ['IT','Italy','+39','🇮🇹'],['ES','Spain','+34','🇪🇸'],['TR','Türkiye','+90','🇹🇷'],
    ['IN','India','+91','🇮🇳'],['PK','Pakistan','+92','🇵🇰'],['AU','Australia','+61','🇦🇺']
  ];
  const $ = id => document.getElementById(id);
  let selectedCountry = countries[0];
  const username = $('username'), phone = $('phone'), dialog = $('countryDialog'), search = $('countrySearch');
  const status = $('statusMessage');
  const suggestions = ['RetroRunner','NeonSkater','BrounaFan','SunsetRacer','ArcadeHero','CoastalRunner','GoldenPlayer','DiscoRider'];
  function message(text) { status.textContent = text; status.classList.add('visible'); }
  function clearMessage() { status.textContent = ''; status.classList.remove('visible'); }
  function renderCountries(query='') {
    const q = query.trim().toLowerCase();
    const filtered = countries.filter(c => c[1].toLowerCase().includes(q) || c[2].includes(q) || c[0].toLowerCase().includes(q));
    $('countryOptions').replaceChildren();
    filtered.forEach(c => {
      const b = document.createElement('button'); b.type='button'; b.className='country-option'; b.setAttribute('role','option');
      b.innerHTML = '<span class="option-flag"></span><span class="option-name"></span><span class="option-code"></span>';
      b.querySelector('.option-flag').textContent=c[3]; b.querySelector('.option-name').textContent=c[1]; b.querySelector('.option-code').textContent=c[2];
      b.setAttribute('aria-selected', String(c[0]===selectedCountry[0]));
      b.addEventListener('click', () => chooseCountry(c)); $('countryOptions').appendChild(b);
    });
    if (!filtered.length) { const p=document.createElement('p'); p.className='no-countries'; p.textContent='No countries found'; $('countryOptions').appendChild(p); }
  }
  function chooseCountry(c) {
    selectedCountry=c; $('countryFlag').textContent=c[3]; $('countryCode').textContent=c[2];
    dialog.hidden=true; $('countryTrigger').setAttribute('aria-expanded','false'); $('countryTrigger').focus(); clearMessage();
  }
  $('countryTrigger').addEventListener('click', () => { dialog.hidden=false; $('countryTrigger').setAttribute('aria-expanded','true'); search.value=''; renderCountries(); search.focus(); });
  $('closeCountries').addEventListener('click', () => { dialog.hidden=true; $('countryTrigger').setAttribute('aria-expanded','false'); $('countryTrigger').focus(); });
  search.addEventListener('input', () => renderCountries(search.value));
  dialog.addEventListener('click', e => { if(e.target===dialog){dialog.hidden=true;$('countryTrigger').setAttribute('aria-expanded','false');} });
  $('shuffleUsername').addEventListener('click', () => { const base=suggestions[Math.floor(Math.random()*suggestions.length)]; username.value=base+Math.floor(10+Math.random()*90); username.dispatchEvent(new Event('input',{bubbles:true})); username.focus(); clearMessage(); });
  username.addEventListener('input', clearMessage); phone.addEventListener('input', clearMessage);
  $('registrationForm').addEventListener('submit', e => {
    e.preventDefault(); clearMessage();
    const name=username.value.trim(), digits=phone.value.replace(/\D/g,'');
    if(name.length<3){message('Please enter a username with at least 3 characters.');username.focus();return;}
    if(!/^[a-zA-Z0-9_.-]+$/.test(name)){message('Use letters, numbers, dots, underscores, or hyphens in your username.');username.focus();return;}
    if(digits.length<6||digits.length>14){message('Please enter a valid mobile number.');phone.focus();return;}
    $('otpSummary').textContent='Verification will be prepared for '+selectedCountry[2]+' '+digits+'.';
    $('otpDialog').hidden=false;
  });
  $('closeOtp').addEventListener('click', () => $('otpDialog').hidden=true);
  $('editDetails').addEventListener('click', () => { $('otpDialog').hidden=true; phone.focus(); });
  $('otpDialog').addEventListener('click', e => { if(e.target===$('otpDialog')) $('otpDialog').hidden=true; });
  username.value='';
  renderCountries();
})();
</script>
</body>
</html>
